name: Notifiche del mattino

# Gli orari sono in UTC perché GitHub lavora in UTC. Lo script controlla che
# in Italia sia dentro la finestra del mattino e invia solo in quel caso, così
# non arrivano notifiche doppie né notifiche fuori orario.
#
# GitHub, sul piano gratuito, PUÒ SALTARE o RITARDARE le esecuzioni pianificate
# quando è sotto carico: i ritardi misurati sono stati fra i 20 e i 50 minuti.
# Perciò:
#  - usiamo minuti "dispari", meno affollati di :00 e :30
#  - proviamo sette volte lungo la mattina
#  - la finestra dello script arriva fino alle 11, così anche un tentativo
#    partito con cinquanta minuti di ritardo fa ancora in tempo
#
# Lo script invia una volta sola: chi ha già ricevuto oggi viene escluso, quindi
# i tentativi in più non producono notifiche doppie, solo un recupero se il
# primo tentativo viene saltato.
#
# D'inverno i due tentativi delle 5 UTC cadono alle 6 italiane, prima
# dell'apertura della finestra: si escludono da soli, senza fare danno.
on:
  schedule:
    - cron: '17 5 * * *'   # 07:17 d'estate / 06:17 d'inverno
    - cron: '43 5 * * *'   # 07:43 d'estate / 06:43 d'inverno
    - cron: '17 6 * * *'   # 08:17 d'estate / 07:17 d'inverno
    - cron: '43 6 * * *'   # 08:43 d'estate / 07:43 d'inverno
    - cron: '17 7 * * *'   # 09:17 d'estate / 08:17 d'inverno
    - cron: '43 7 * * *'   # 09:43 d'estate / 08:43 d'inverno
    - cron: '17 8 * * *'   # ultimo recupero: 10:17 d'estate / 09:17 d'inverno
  workflow_dispatch:        # pulsante per provare quando vuoi

permissions:
  contents: read

concurrency:
  group: notifiche
  cancel-in-progress: false

jobs:
  invia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Scarico il codice
        uses: actions/checkout@v7

      - name: Preparo Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Installo la libreria per le notifiche
        run: npm install web-push@3.6.7 --no-save --no-audit --no-fund

      - name: Invio il riassunto della giornata
        env:
          VAPID_PRIVATA: ${{ secrets.VAPID_PRIVATA }}
          # serve solo quando i permessi del database sono chiusi
          SUPABASE_SERVIZIO: ${{ secrets.SUPABASE_SERVIZIO }}
          # con il pulsante manuale invio sempre, senza aspettare l'orario
          FORZA: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/invia-notifiche.js

<!--
  ============================================================================
  FATTORIA TASKS — v4 (file unico, tutto in italiano)
  ============================================================================
  Barra in basso:  Oggi · Animali · Lavori · Registro · Spesa
  Home (Oggi):     Calendario e scadenze -> Scadenze -> Attività del giorno -> Routine
  In alto:         🔔 notifiche (scadenze, spesa, routine) · ⚙️ impostazioni · avatar

  PRIMA DI USARLA esegui "schema-v4.sql" nell'SQL Editor di Supabase.
  Cambiano i nomi di tabella e colonne (ora in italiano): esegui lo script e
  carica questo file nello stesso momento.
  ============================================================================
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#8FA583">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fattoria">
<title>Fattoria Tasks</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icona-192.png">
<link rel="apple-touch-icon" href="./icona-192.png">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<style>
  :root {
    --salvia:      #8FA583;
    --salvia-cupo: #6E8663;
    --sabbia:      #E6D8BC;
    --scheda:      #FBF7EC;
    --bordo:       #DFD4BC;
    --inchiostro:  #1E2418;
    --inchiostro2: #4A5340;
    --verde:       #2F6B33;
    --verde-cupo:  #245227;
    --pastiglia:   #E2EADB;
    --pastiglia-t: #24401F;
    --allarme:     #B3261E;
  }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; color: var(--inchiostro);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    overscroll-behavior-y: contain; overflow-x: hidden;
    background-color: var(--sabbia);
    background-image:
      repeating-linear-gradient(90deg, rgba(126,92,50,.10) 0 1px, rgba(0,0,0,0) 1px 5px),
      repeating-linear-gradient(90deg, rgba(126,92,50,.07) 0 2px, rgba(0,0,0,0) 2px 11px),
      repeating-linear-gradient(90deg, rgba(104,72,36,.13) 0 2px, rgba(0,0,0,0) 2px 29px),
      repeating-linear-gradient(90deg, rgba(255,246,226,.30) 0 6px, rgba(0,0,0,0) 6px 67px),
      repeating-linear-gradient(0deg,  rgba(104,72,36,.16) 0 2px, rgba(0,0,0,0) 2px 118px),
      linear-gradient(180deg, rgba(255,250,238,.35), rgba(255,250,238,0) 34%);
    background-attachment: fixed;
  }
  input, select, textarea, button { font-size: 16px; font-family: inherit; color: var(--inchiostro); }
  .no-sb { scrollbar-width: none; -ms-overflow-style: none; }
  .no-sb::-webkit-scrollbar { display: none; }

  .scheda { background: var(--scheda); border: 1px solid rgba(180,164,132,.6);
            border-radius: 1.25rem; padding: 1.05rem;
            box-shadow: 0 3px 10px rgba(74,58,32,.09), 0 1px 2px rgba(74,58,32,.05); }
  .scheda-fitta { padding: .75rem; }
  .scheda-urgente { background: #FFF3EF; border-color: #E9A08F; }
  .scheda-fatta   { background: #F2F1EA; }
  .tocca:active   { transform: scale(.99); }

  .titolo-sez { display: flex; align-items: center; gap: .5rem; font-size: 1.0625rem;
                font-weight: 900; letter-spacing: -.01em; margin: 0 .25rem .75rem; }
  .conta { font-size: .75rem; font-weight: 900; background: var(--pastiglia); color: var(--pastiglia-t);
           padding: .2rem .45rem; border-radius: .4rem; border: 1px solid var(--bordo); }

  .etichetta { display: inline-flex; align-items: center; gap: .25rem; white-space: nowrap;
               font-size: .75rem; font-weight: 800; line-height: 1; padding: .35rem .5rem;
               border-radius: .5rem; background: var(--pastiglia); color: var(--pastiglia-t);
               border: 1px solid var(--bordo); }
  .et-ritardo { background: var(--allarme); color: #fff; border-color: var(--allarme); }
  .et-oggi    { background: #8A4B10; color: #fff; border-color: #8A4B10; }
  .et-alta    { background: #C2410C; color: #fff; border-color: #C2410C; }
  .et-chi     { background: #E7EDF7; color: #1D3A6B; border-color: #C8D6EA; }
  .et-corso   { background: #1D4ED8; color: #fff; border-color: #1D4ED8; }
  .et-fatto   { background: #3F6B44; color: #fff; border-color: #3F6B44; }
  .et-soldi   { background: #FEF3C7; color: #78350F; border-color: #FDE68A; }

  .bot { display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
         min-height: 48px; padding: 0 1rem; border-radius: .8rem; font-weight: 900;
         font-size: .9375rem; border: 2px solid transparent; }
  .bot:active { filter: brightness(.93); }
  .bot-verde  { background: var(--verde); color: #fff; }
  .bot-chiaro { background: var(--scheda); color: var(--inchiostro); border-color: var(--bordo); }
  .bot-rosso  { background: #FDEBEA; color: var(--allarme); border-color: #E9B4B0; }
  .bot-piccolo{ min-height: 42px; padding: 0 .8rem; font-size: .875rem; border-radius: .7rem; }
  .bot-largo  { width: 100%; min-height: 54px; font-size: 1.0625rem; }

  .past { display: inline-flex; align-items: center; justify-content: center; gap: .3rem;
          min-height: 44px; padding: 0 .85rem; border-radius: .8rem; background: var(--scheda);
          color: var(--inchiostro); border: 2px solid var(--bordo); font-weight: 800;
          font-size: .875rem; white-space: nowrap; }
  .past[aria-pressed="true"] { background: var(--verde); color: #fff; border-color: var(--verde); }

  .campo { width: 100%; min-height: 52px; padding: .75rem .9rem; background: #fff;
           border: 2px solid var(--bordo); border-radius: .8rem; font-weight: 700; }
  .campo::placeholder { color: #94907F; font-weight: 600; }
  .campo:focus { outline: none; border-color: var(--verde); box-shadow: 0 0 0 3px rgba(47,107,51,.22); }
  .didascalia { font-size: .75rem; font-weight: 900; letter-spacing: .05em;
                text-transform: uppercase; color: var(--inchiostro2); }

  /* righe da spuntare */
  .riga { display: flex; align-items: center; gap: .85rem; width: 100%;
          background: var(--scheda); border: 1px solid rgba(180,164,132,.6);
          border-radius: 1.25rem; padding: 1rem; text-align: left;
          box-shadow: 0 3px 10px rgba(74,58,32,.09), 0 1px 2px rgba(74,58,32,.05); }
  .cerchio { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%;
             border: 3px solid #B9AE93; display: grid; place-items: center;
             font-size: 1.25rem; font-weight: 900; color: transparent; background: #fff; }
  .riga-ok           { background: #EEF3EA; border-color: #BFCDB6; }
  .riga-ok .cerchio  { background: var(--verde); border-color: var(--verde); color: #fff; }
  .riga-ok .riga-tit { text-decoration: line-through; color: #6B7360; }
  .riga-tit  { display: block; font-weight: 800; font-size: 1rem; line-height: 1.2; }
  .riga-apri { flex: 1 1 auto; text-align: left; min-width: 0; }

  /* ---------- CALENDARIO (compatto, non sborda) ----------
     minmax(0,1fr) è la chiave: senza di esso il contenuto minimo delle celle
     allarga le colonne e la domenica finisce fuori dallo schermo. */
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; width: 100%; }
  .cal-gg  { text-align: center; font-size: .625rem; font-weight: 900;
             color: var(--inchiostro2); padding-bottom: 2px; min-width: 0; }
  .cal-cel { min-width: 0; height: 38px; border-radius: .5rem; background: #FDFBF4;
             border: 1.5px solid rgba(180,164,132,.5); display: flex; flex-direction: column;
             align-items: center; justify-content: center; gap: 1px;
             font-weight: 800; font-size: .8125rem; padding: 0; overflow: hidden; }
  .cal-vuota { background: transparent; border-color: transparent; }
  .cal-oggi  { border-color: var(--verde); border-width: 2.5px; }
  .cal-sel   { background: var(--verde); color: #fff; border-color: var(--verde); }
  .punti { display: flex; gap: 2px; height: 5px; align-items: center; }
  .punto { width: 5px; height: 5px; border-radius: 50%; }
  .p-ritardo { background: var(--allarme); }
  .p-dafare  { background: var(--verde); }
  .p-incorso { background: #1D4ED8; }
  .p-fatto   { background: #9AA394; }
  .cal-sel .p-ritardo { background: #FFD9D4; }
  .cal-sel .p-dafare  { background: #DCF0D6; }
  .cal-sel .p-incorso { background: #CBDBFF; }
  .cal-sel .p-fatto   { background: #E4E7E0; }

  /* ---------- animali ---------- */
  .griglia-animali { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
  .foto-animale { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: .75rem;
                  border: 1.5px solid var(--bordo); background: #EFEADC; display: block; }
  .senza-foto { width: 100%; aspect-ratio: 4 / 3; border-radius: .75rem; border: 1.5px dashed var(--bordo);
                background: #F2EDE0; display: grid; place-items: center; font-size: 2.25rem; }
  /* riquadro per sistemare l'inquadratura trascinando col dito */
  #inquadra { position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: .75rem;
              overflow: hidden; border: 2px solid var(--verde); background: #EFEADC;
              touch-action: none; cursor: grab; }
  #inquadra img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; user-select: none; }
  #inquadra.intera img { object-fit: contain; }
  #inquadra:active { cursor: grabbing; }
  #inquadra .suggerimento { position: absolute; left: 0; right: 0; bottom: 0; padding: .35rem;
                            background: rgba(20,32,15,.62); color: #fff; font-size: .75rem;
                            font-weight: 800; text-align: center; }

  /* ---------- barra in basso e bottone ---------- */
  #barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
           display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
           background: var(--scheda); border-top: 1.5px solid var(--bordo);
           padding-bottom: env(safe-area-inset-bottom, 0px); }
  .voce { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
          padding: .5rem 0 .45rem; font-size: .625rem; font-weight: 800; color: var(--inchiostro2);
          border-top: 3px solid transparent; min-width: 0; }
  .voce .ic { font-size: 1.35rem; line-height: 1; }
  .voce[aria-current="page"] { color: var(--verde-cupo); background: #E7EEE3; border-top-color: var(--verde); }

  #aggiungi { position: fixed; right: 1rem; z-index: 45;
              bottom: calc(78px + env(safe-area-inset-bottom, 0px));
              height: 62px; padding: 0 1.4rem 0 1.15rem; border-radius: 999px;
              background: var(--verde); color: #fff; font-weight: 900; font-size: 1.0625rem;
              display: inline-flex; align-items: center; gap: .5rem;
              box-shadow: 0 6px 18px rgba(20,40,20,.35); border: 3px solid #FBF7EC; }
  #aggiungi:active { filter: brightness(.92); }

  /* Il numero è ancorato alla campanella disegnata, non al bordo del bottone:
     altrimenti resta staccato, perché il bottone è più grande dell'emoji. */
  .campana { position: relative; display: inline-flex; line-height: 1; }
  #pallino { position: absolute; top: -7px; right: -9px;
             min-width: 18px; height: 18px; border-radius: 999px;
             background: var(--allarme); color: #fff;
             font-size: .625rem; font-weight: 900; letter-spacing: 0;
             display: inline-flex; align-items: center; justify-content: center;
             padding: 0 4px; border: 2px solid var(--salvia);
             font-family: system-ui, sans-serif; }

  .miniatura { width: 100%; max-height: 210px; object-fit: cover; border-radius: .8rem;
               border: 1.5px solid var(--bordo); display: block; }
  #lente img { max-width: 100%; max-height: 88vh; object-fit: contain; border-radius: .5rem; }
  /* ---------- stampa del registro ----------
     In stampa nascondo tutta l'app e mostro solo il foglio preparato. */
  #foglio { display: none; }
  @media print {
    body { background: #fff !important; }
    body > *:not(#foglio) { display: none !important; }
    #foglio { display: block !important; padding: 0; color: #000; font-size: 11pt; }
    #foglio h1 { font-size: 17pt; margin: 0 0 2mm; }
    #foglio h2 { font-size: 13pt; margin: 6mm 0 2mm; border-bottom: 1px solid #999; padding-bottom: 1mm; }
    #foglio table { width: 100%; border-collapse: collapse; font-size: 10pt; }
    #foglio th, #foglio td { border: 1px solid #999; padding: 1.6mm 2mm; text-align: left; vertical-align: top; }
    #foglio th { background: #eee; font-weight: 700; }
    #foglio .dx { text-align: right; white-space: nowrap; }
    #foglio .anagrafica td { border: none; padding: .8mm 0; }
    #foglio .anagrafica td:first-child { width: 42mm; color: #444; }
    #foglio .totale { font-weight: 900; }
    #foglio .piede { margin-top: 8mm; font-size: 8.5pt; color: #555; }
    #foglio .animale { page-break-inside: avoid; }
    #foglio .animale + .animale { page-break-before: always; }
    @page { margin: 14mm; }
  }
  /* ---------- trascinamento laterale (swipe) ----------
     Il contenitore ritaglia; il figlio "scorrevole" si sposta col dito.
     touch-action: pan-y lascia libero lo scorrimento verticale della pagina e
     cattura solo il movimento orizzontale. */
  .swipe { position: relative; overflow: hidden; border-radius: 1.25rem; }
  .swipe-fondo { position: absolute; inset: 0; display: flex; align-items: center;
                 justify-content: space-between; padding: 0 1.25rem;
                 font-size: 1.35rem; font-weight: 900; color: #fff;
                 background: #B9AE93; border-radius: 1.25rem; }
  .swipe[data-dir="dx"] .swipe-fondo { background: var(--verde); }
  .swipe[data-dir="sx"] .swipe-fondo { background: var(--allarme); }
  .swipe[data-dir="sx"][data-sx="inizia"] .swipe-fondo { background: #1D4ED8; }
  .swipe-fondo .sx-eti { opacity: 0; }
  .swipe-fondo .dx-eti { opacity: 0; }
  .swipe[data-dir="dx"] .swipe-fondo .sx-eti { opacity: 1; }
  .swipe[data-dir="sx"] .swipe-fondo .dx-eti { opacity: 1; }
  .scorrevole { position: relative; touch-action: pan-y; will-change: transform; }
  .swipe.pronto .swipe-fondo { filter: brightness(1.12); }

  #annulla-azione { margin-left: .6rem; padding: .25rem .6rem; border-radius: .5rem;
                    background: #FBF7EC; color: #20281A; font-weight: 900; font-size: .8125rem; }

  .pannello { animation: su .22s cubic-bezier(.2,.8,.2,1); }
  @keyframes su { from { transform: translateY(16px); opacity: .5 } to { transform: none; opacity: 1 } }
  [hidden] { display: none !important; }
</style>

<body>

<header class="sticky top-0 z-30" style="background:var(--salvia);border-bottom:1.5px solid var(--salvia-cupo)">
  <div class="flex items-center gap-1.5 px-3 py-2.5">
    <h1 class="text-base font-black flex items-center gap-1.5 min-w-0" style="color:#14200F">
      <span>🚜</span><span class="truncate">Fattoria Tasks</span>
    </h1>
    <span id="stato-rete" class="etichetta shrink-0" style="background:#ffffffcc">…</span>
    <div class="ml-auto flex items-center gap-1.5 shrink-0">
      <button id="bot-avvisi" class="w-10 h-10 rounded-xl grid place-items-center text-xl"
              style="background:#ffffff99" aria-label="Avvisi">
        <span class="campana">🔔<span id="pallino" hidden>0</span></span>
      </button>
      <button id="bot-impostazioni" class="w-10 h-10 rounded-xl grid place-items-center text-xl"
              style="background:#ffffff99" aria-label="Impostazioni">⚙️</button>
      <button id="bot-io" class="w-10 h-10 rounded-full grid place-items-center font-black text-white"
              style="background:var(--verde)" aria-label="Chi usa l'app">I</button>
    </div>
  </div>
</header>

<div id="avviso-locale" hidden class="mx-4 mt-3 rounded-xl border-2 border-amber-500 bg-amber-50 p-3 text-sm font-bold text-amber-900"></div>

<main class="px-4 pt-4" style="padding-bottom:150px">
  <section id="vista-oggi"><div id="corpo-oggi" class="space-y-6">
    <div class="text-center py-12"><div class="text-5xl animate-pulse">🌾</div><p class="mt-3 font-black text-lg">Caricamento…</p></div>
  </div></section>
  <section id="vista-animali"  hidden><div id="corpo-animali"  class="space-y-5"></div></section>
  <section id="vista-lavori"   hidden><div id="corpo-lavori"   class="space-y-6"></div></section>
  <section id="vista-registro" hidden><div id="corpo-registro" class="space-y-4"></div></section>
  <section id="vista-spesa"    hidden><div id="corpo-spesa"    class="space-y-5"></div></section>
  <section id="vista-storico"  hidden><div id="corpo-storico"  class="space-y-3"></div></section>
</main>

<button id="aggiungi"><span class="text-2xl leading-none">＋</span><span id="etichetta-aggiungi">Attività</span></button>

<nav id="barra" aria-label="Sezioni">
  <button class="voce" data-vista="oggi" aria-current="page"><span class="ic">🚜</span>Oggi</button>
  <button class="voce" data-vista="animali"><span class="ic">🐄</span>Animali</button>
  <button class="voce" data-vista="lavori"><span class="ic">🔨</span>Lavori</button>
  <button class="voce" data-vista="registro"><span class="ic">📓</span>Registro</button>
  <button class="voce" data-vista="spesa"><span class="ic">🛒</span>Spesa</button>
</nav>

<div id="pannello" hidden class="fixed inset-0 z-50">
  <div id="pannello-sfondo" class="absolute inset-0 bg-black/50"></div>
  <div class="absolute inset-x-0 bottom-0 max-h-[94vh] flex flex-col pannello rounded-t-3xl overflow-hidden" style="background:var(--sabbia)">
    <div class="flex items-center gap-2 px-4 py-3" style="background:var(--salvia)">
      <h2 id="pannello-titolo" class="text-lg font-black min-w-0 truncate" style="color:#14200F">Dettaglio</h2>
      <button id="pannello-chiudi" class="ml-auto w-10 h-10 rounded-xl grid place-items-center text-xl font-black shrink-0" style="background:#ffffff99">✕</button>
    </div>
    <div id="pannello-corpo" class="flex-1 overflow-y-auto px-4 py-4 space-y-4"></div>
  </div>
</div>

<div id="lente" hidden class="fixed inset-0 z-[60] bg-black/90 flex items-center justify-center p-3">
  <img alt="Foto ingrandita">
  <button id="lente-chiudi" class="absolute top-4 right-4 w-12 h-12 rounded-full bg-white/90 text-2xl font-black">✕</button>
</div>

<!-- ===================== ACCESSO ===================== -->
<div id="accesso" hidden class="fixed inset-0 z-[80] flex items-center justify-center p-4" style="background:var(--sabbia)">
  <div class="scheda w-full" style="max-width:26rem">
    <h1 class="text-xl font-black flex items-center gap-2"><span>🚜</span><span>Fattoria Tasks</span></h1>
    <p id="accesso-sotto" class="text-sm font-semibold mt-1" style="color:var(--inchiostro2)">Entra con la tua email.</p>

    <div id="accesso-modulo" class="mt-4 space-y-3">
      <div><label class="didascalia" for="ac-email">Email</label>
        <input id="ac-email" type="email" inputmode="email" autocomplete="username" class="campo mt-1.5" placeholder="nome@esempio.it"></div>
      <div id="ac-riga-password"><label class="didascalia" for="ac-password">Password</label>
        <input id="ac-password" type="password" autocomplete="current-password" class="campo mt-1.5" placeholder="••••••••"></div>
      <p id="ac-messaggio" hidden class="text-sm font-bold"></p>
      <button id="ac-entra" class="bot bot-verde bot-largo">Entra</button>
      <button id="ac-dimenticata" class="bot bot-chiaro w-full">Password dimenticata?</button>
      <button id="ac-annulla" hidden class="bot bot-chiaro w-full">‹ Torna all'accesso</button>
    </div>

    <div id="accesso-nuova" hidden class="mt-4 space-y-3">
      <p class="font-bold">Scegli la nuova password</p>
      <input id="ac-nuova" type="password" autocomplete="new-password" class="campo" placeholder="Almeno 8 caratteri">
      <input id="ac-nuova2" type="password" autocomplete="new-password" class="campo" placeholder="Ripeti la password">
      <p id="ac-messaggio2" hidden class="text-sm font-bold"></p>
      <button id="ac-salva-password" class="bot bot-verde bot-largo">Salva la nuova password</button>
    </div>

    <p class="text-xs font-semibold mt-4" style="color:var(--inchiostro2)">
      L'accesso si fa una volta per telefono: dopo resti collegato.</p>
  </div>
</div>

<div id="foglio" aria-hidden="true"></div>

<!-- l'attributo capture viene aggiunto solo quando si sceglie "Scatta":
     se resta sempre, Android apre la fotocamera e non lascia usare la galleria -->
<input id="scegli-foto" type="file" accept="image/*" hidden>
<div id="messaggio" hidden class="fixed z-[70] left-1/2 -translate-x-1/2 bottom-40 px-4 py-3 rounded-xl text-white font-bold text-sm shadow-xl max-w-[92vw] text-center" style="background:#20281A"></div>

<script>
'use strict';
/* ==========================================================================
   CONFIGURAZIONE SUPABASE

const euro = (n) => {

  if (!isFinite(v)) return null;
  const [interi, dec] = Math.abs(v).toFixed(2).split('.');

};

/* ==========================================================================
   DATE
   ========================================================================== */
const isoDi = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const OGGI = isoDi(new Date());
const fraGiorni = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return isoDi(d); };

function giorniDaOggi(g) {
  if (!g) return null;
  const [y, m, d] = g.split('-').map(Number);
  const a = new Date(y, m - 1, d), b = new Date(); b.setHours(0, 0, 0, 0);
  return Math.round((a - b) / 86400000);
}
function etichettaData(g) {
  const n = giorniDaOggi(g);
  if (n === null) return '';
  if (n === 0) return 'Oggi';
  if (n === 1) return 'Domani';
  if (n === -1) return 'Ieri';
  if (n < -1) return `${Math.abs(n)} gg in ritardo`;
  const [y, m, d] = g.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' });
}
function dataLunga(g) {
  const [y, m, d] = g.split('-').map(Number);
  const t = new Date(y, m - 1, d).toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
  const pre = g === OGGI ? 'Oggi · ' : g === fraGiorni(1) ? 'Domani · ' : g === fraGiorni(-1) ? 'Ieri · ' : '';
  return pre + t.charAt(0).toUpperCase() + t.slice(1);
}
function oraLunga(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const g = isoDi(d) === OGGI ? 'Oggi' : isoDi(d) === fraGiorni(-1) ? 'Ieri'
    : d.toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' });
  return `${g} · ${d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })}`;
}
// Sposta una data secondo la ricorrenza scelta. Se il giorno non esiste nel
// mese di arrivo (es. 31 gennaio + 1 mese) si usa l'ultimo giorno del mese.
function spostaGiorni(base, giorni) {
  const [y, m, g] = (base || OGGI).split('-').map(Number);
  const d = new Date(y, m - 1, g);
  d.setDate(d.getDate() + giorni);
  return isoDi(d);
}
function spostaMesi(base, mesi) {
  const [y, m, g] = (base || OGGI).split('-').map(Number);
  const totale = (m - 1) + mesi;
  const anno = y + Math.floor(totale / 12);
  const mese = ((totale % 12) + 12) % 12;
  const ultimoDelMese = new Date(anno, mese + 1, 0).getDate();
  return isoDi(new Date(anno, mese, Math.min(g, ultimoDelMese)));
}
function prossimaData(dataPartenza, nomeRicorrenza) {
  const r = RICORRENZE.find((x) => x.v === nomeRicorrenza);
  if (!r || (!r.giorni && !r.mesi)) return null;
  return r.giorni ? spostaGiorni(dataPartenza, r.giorni) : spostaMesi(dataPartenza, r.mesi);
}

function eta(nascita) {
  if (!nascita) return '';
  const [y, m, d] = nascita.split('-').map(Number);
  const n = new Date(y, m - 1, d), o = new Date();
  let anni = o.getFullYear() - n.getFullYear();
  let mesi = o.getMonth() - n.getMonth();
  if (o.getDate() < n.getDate()) mesi--;
  if (mesi < 0) { anni--; mesi += 12; }
  if (anni <= 0) return mesi <= 1 ? `${mesi} mese` : `${mesi} mesi`;
  return anni === 1 ? (mesi ? `1 anno e ${mesi} mesi` : '1 anno') : (mesi ? `${anni} anni e ${mesi} mesi` : `${anni} anni`);
}

async function entra() {
  const email = ($('#ac-email').value || '').trim();
  if (!email) { messaggioAccesso('Scrivi la tua email', true); return; }

  // modalità "ti mando il link per rifare la password"
  if (modoAccesso === 'recupera') {
    const bot = $('#ac-entra'); bot.disabled = true; bot.textContent = 'Invio…';
    try {
      const ritorno = location.origin + location.pathname;
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: ritorno });
      if (error) throw error;
      messaggioAccesso('Email inviata. Apri il link dal telefono: torni qui e scegli la password nuova.', false);
    } catch (e) { messaggioAccesso('Non riuscito: ' + (e.message || e), true); }
    finally { bot.disabled = false; bot.textContent = 'Mandami il link'; }
    return;
  }

  const password = $('#ac-password').value || '';
  if (!password) { messaggioAccesso('Scrivi la password', true); return; }
  const bot = $('#ac-entra'); bot.disabled = true; bot.textContent = 'Entro…';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    utente = data.user;
    $('#ac-password').value = '';
    nascondiAccesso();
    allineaIdentita();
    await ricarica(false);
    if (!nomeDaAccount()) {
      // prima volta con questo account: chiedo chi è, una volta sola
      avvisa('Dimmi solo chi sei');
      apriImpostazioni();
    } else avvisa('Bentornato, ' + nomeDaAccount());
  } catch (e) {
    const m = String(e.message || e);
    messaggioAccesso(/Invalid login/i.test(m) ? 'Email o password non corrette.'
      : /Email not confirmed/i.test(m) ? 'Questo indirizzo non è ancora confermato.'
      : 'Accesso non riuscito: ' + m, true);
  } finally { bot.disabled = false; bot.textContent = 'Entra'; }
}

  const a = $('#ac-nuova').value || '', b = $('#ac-nuova2').value || '';
  if (a.length < 8) { messaggioAccesso('Serve almeno 8 caratteri', true, 2); return; }
  if (a !== b) { messaggioAccesso('Le due password non coincidono', true, 2); return; }
  const bot = $('#ac-salva-password'); bot.disabled = true; bot.textContent = 'Salvo…';
  try {
    const { error } = await sb.auth.updateUser({ password: a });
    if (error) throw error;
    $('#ac-nuova').value = ''; $('#ac-nuova2').value = '';
    nascondiAccesso();
    avvisa('✓ Password aggiornata');
    await ricarica(false);
  } catch (e) { messaggioAccesso('Non salvata: ' + (e.message || e), true, 2); }
  finally { bot.disabled = false; bot.textContent = 'Salva la nuova password'; }
}

const daBase64 = (s) => {
  const riempi = '='.repeat((4 - s.length % 4) % 4);
  const b = atob((s + riempi).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(b, (c) => c.charCodeAt(0));
};

  || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const appInstallata = () => window.matchMedia('(display-mode: standalone)').matches
  || window.navigator.standalone === true;

function statoNotifiche() {
  if (!('serviceWorker' in navigator)) return 'non-supportate';
  if (suIPhone() && !appInstallata()) return 'iphone-da-installare';
  if (!('PushManager' in window) || !('Notification' in window)) return 'non-supportate';
  if (Notification.permission === 'denied') return 'negate';
  if (iscrizioneDiQuestoDispositivo()) return 'attive';
  return 'da-attivare';
}

let endpointLocale = localStorage.getItem('fattoria_endpoint') || null;
const iscrizioneDiQuestoDispositivo = () => endpointLocale
  && iscrizioni.some((x) => x.endpoint === endpointLocale);

function descriviDispositivo() {
  const ua = navigator.userAgent;
  const sistema = /Android/.test(ua) ? 'Android' : suIPhone() ? 'iPhone'
    : /Windows/.test(ua) ? 'Windows' : /Mac/.test(ua) ? 'Mac' : 'altro';
  return sistema + ' · ' + io;
}

async function registraServiceWorker() {
  if (!('serviceWorker' in navigator)) return null;
  try {
    regSW = await navigator.serviceWorker.register('./sw.js', { scope: './' });
    await navigator.serviceWorker.ready;
    return regSW;
  } catch (e) { return null; }
}

async function attivaNotifiche() {
  const s = statoNotifiche();
  if (s === 'iphone-da-installare') {
    avvisa('Su iPhone devi prima aggiungere l\'app alla schermata Home (pulsante Condividi di Safari), poi riaprirla da lì.', true);
    return;
  }
  if (s === 'non-supportate') { avvisa('Questo browser non gestisce le notifiche.', true); return; }
  if (s === 'negate') {
    avvisa('Le notifiche sono bloccate nelle impostazioni del browser per questo sito: sbloccale da lì e riprova.', true);
    return;
  }
  try {
    const permesso = await Notification.requestPermission();
    if (permesso !== 'granted') { avvisa('Permesso non concesso.', true); disegnaImpostazioni(); return; }
    const reg = regSW || await registraServiceWorker();
    if (!reg) { avvisa('Service worker non registrato: serve il file sw.js accanto all\'app.', true); return; }

    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({
      userVisibleOnly: true, applicationServerKey: daBase64(CHIAVE_PUSH)
    });
    const j = sub.toJSON();
    const riga = { endpoint: j.endpoint, chiave_p256dh: j.keys.p256dh, chiave_auth: j.keys.auth,
                   dispositivo: descriviDispositivo(), persona: io };
    const salvata = await archivio.salvaIscrizione(riga);
    endpointLocale = j.endpoint;
    localStorage.setItem('fattoria_endpoint', endpointLocale);
    iscrizioni = iscrizioni.filter((x) => x.endpoint !== j.endpoint).concat([salvata || riga]);
    avvisa('✓ Notifiche attivate su questo telefono');
    disegnaImpostazioni();
  } catch (e) {
    avvisa('Attivazione non riuscita: ' + (e.message || e), true);
  }
}

// Se il server scopre che un'iscrizione non vale più (il telefono ha fatto
// pulizia, l'app è stata ricaricata da zero...) la cancella dal database.
// Al primo avvio successivo ce ne accorgiamo e ci riscriviamo da soli, senza
// chiedere di nuovo il permesso: altrimenti le notifiche smetterebbero in
// silenzio e nessuno lo saprebbe fino al mattino sbagliato.
async function riparaIscrizione() {
  if (!CONFIGURATO || !('serviceWorker' in navigator) || !('Notification' in window)) return;
  if (Notification.permission !== 'granted') return;
  if (!endpointLocale) return;                        // non era mai stato attivato qui
  if (iscrizioni.some((x) => x.endpoint === endpointLocale)) return;   // tutto a posto

  try {
    const reg = regSW || await navigator.serviceWorker.getRegistration();
    if (!reg) return;
    // la vecchia iscrizione può essere quella scaduta: la sostituisco
    const vecchia = await reg.pushManager.getSubscription();
    if (vecchia) { try { await vecchia.unsubscribe(); } catch (e) {} }
    const nuova = await reg.pushManager.subscribe({
      userVisibleOnly: true, applicationServerKey: daBase64(CHIAVE_PUSH)
    });
    const j = nuova.toJSON();
    const salvata = await archivio.salvaIscrizione({
      endpoint: j.endpoint, chiave_p256dh: j.keys.p256dh, chiave_auth: j.keys.auth,
      dispositivo: descriviDispositivo(), persona: io
    });
    endpointLocale = j.endpoint;
    localStorage.setItem('fattoria_endpoint', endpointLocale);
    iscrizioni = iscrizioni.filter((x) => x.endpoint !== j.endpoint).concat([salvata || {}]);
    avvisa('🔔 Notifiche ricollegate su questo telefono');
  } catch (e) {
    // niente messaggi allarmanti: lo dico solo nelle impostazioni
    console.log('Iscrizione non ripristinata: ' + (e.message || e));
  }
}

async function spegniNotifiche() {
  try {
    const reg = regSW || (('serviceWorker' in navigator) ? await navigator.serviceWorker.getRegistration() : null);
    const sub = reg && await reg.pushManager.getSubscription();
    const ep = (sub && sub.endpoint) || endpointLocale;
    if (sub) await sub.unsubscribe();
    const riga = iscrizioni.find((x) => x.endpoint === ep);
    if (riga) { try { await archivio.elimina('iscrizioni', riga.id); } catch (e) {} }
    iscrizioni = iscrizioni.filter((x) => x.endpoint !== ep);
    endpointLocale = null; localStorage.removeItem('fattoria_endpoint');
    avvisa('Notifiche spente su questo telefono');
    disegnaImpostazioni();
  } catch (e) { avvisa('Non riuscito: ' + (e.message || e), true); }
}

async function provaNotifica() {
  if (!('Notification' in window)) { avvisa('Notifiche non disponibili', true); return; }
  if (Notification.permission !== 'granted') { avvisa('Prima attiva le notifiche', true); return; }
  const reg = regSW || await navigator.serviceWorker.getRegistration();
  if (!reg) { avvisa('Service worker non attivo', true); return; }
  const avvisi = avvisiCorrenti();
  const corpo = avvisi.length ? avvisi.slice(0, 3).map((a) => a.ico + ' ' + a.testo).join('\n')
                             : 'Nessun avviso: tutto in ordine.';
  if (reg.active) reg.active.postMessage({ tipo: 'prova-notifica', corpo });
  else reg.showNotification('🚜 Fattoria — prova', { body: corpo, icon: './icona-192.png' });
  avvisa('Notifica di prova inviata');
}

/* ==========================================================================
   FOTO — sempre dalla fotocamera o dalla galleria, mai un indirizzo da incollare
   ========================================================================== */
async function rimpicciolisci(file, max = 1280, q = 0.72) {
  const img = await (async () => {
    if (window.createImageBitmap) { try { return await createImageBitmap(file); } catch (e) {} }
    return await new Promise((ok, ko) => {
      const im = new Image(), fr = new FileReader();
      fr.onload = () => { im.onload = () => ok(im); im.onerror = ko; im.src = fr.result; };
      fr.onerror = ko; fr.readAsDataURL(file);
    });
  })();
  const w0 = img.width || img.naturalWidth, h0 = img.height || img.naturalHeight;
  const k = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement('canvas');
  c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', q));
  return { blob, dataUrl: c.toDataURL('image/jpeg', q) };
}

// Due strade separate: la fotocamera subito, oppure la galleria/i file.
// Con `capture` fisso nell'HTML Android aprirebbe sempre la fotocamera.
function apriSelettoreFoto(conFotocamera) {
  const inp = $('#scegli-foto');
  if (conFotocamera) inp.setAttribute('capture', 'environment');
  else inp.removeAttribute('capture');
  inp.click();
}

$('#scegli-foto').addEventListener('change', async (ev) => {
  const input = ev.target;
  const f = input.files && input.files[0];
  if (!f) { input.value = ''; return; }
  try {
    avvisa('Preparo la foto…');
    fotoScelta.dati = await rimpicciolisci(f);
    leggiCampi();                       // non perdere quello che è già stato scritto
    disegnaPannello();
    avvisa('Foto pronta (' + Math.round(fotoScelta.dati.blob.size / 1024) + ' KB)');
  } catch (e) { avvisa('Foto non leggibile: ' + (e.message || e), true); }
  finally { input.value = ''; }
});

function etichetteDi(t) {
  const out = [];
  // Lo stato viene per primo: è la cosa che conta guardando l'elenco.
  if (t.stato === 'In corso')   out.push('<span class="etichetta et-corso">▶ In corso</span>');
  if (t.stato === 'Completato') out.push('<span class="etichetta et-fatto">✓ Fatto</span>');
  if (t.categoria) out.push(`<span class="etichetta">${emojiCat(t.categoria)} ${pul(t.categoria)}</span>`);
  out.push(`<span class="etichetta et-chi">👤 ${pul(persona(t.assegnato_a))}</span>`);
  if (t.priorita === 'Alta' && t.stato !== 'Completato') out.push('<span class="etichetta et-alta">🔥 Alta</span>');
  if (t.ricorrenza && t.ricorrenza !== 'Mai') out.push(`<span class="etichetta">🔁 ${pul(t.ricorrenza.replace(/^Ogni /, 'ogni '))}</span>`);
  if (t.scadenza && t.stato !== 'Completato') {
    const n = giorniDaOggi(t.scadenza);
    // l'orario, se c'è, sta dentro la stessa etichetta della data
    const quando = pul(etichettaData(t.scadenza)) + (t.ora ? ' · ore ' + pul(t.ora) : '');
    out.push(`<span class="etichetta ${n < 0 ? 'et-ritardo' : n === 0 ? 'et-oggi' : ''}">${t.ora ? '🕐' : '📅'} ${quando}</span>`);
  }
  return out.join('');
}

function stileFotoAnimale(a) {

const routineFatta = (t) => t.ultimo_completamento === OGGI;
const eMio = (t) => filtroMiei === 'tutti' || persona(t.assegnato_a) === io || t.assegnato_a === 'Tutti';
const perUrgenza = (a, b) => {
  const da = a.scadenza ? giorniDaOggi(a.scadenza) : 9e5;
  const db = b.scadenza ? giorniDaOggi(b.scadenza) : 9e5;
  if (da !== db) return da - db;
  // stesso giorno: prima chi ha un orario (in ordine cronologico), poi chi non l'ha
  if (a.ora && b.ora && a.ora !== b.ora) return a.ora < b.ora ? -1 : 1;
  if (a.ora && !b.ora) return -1;
  if (!a.ora && b.ora) return 1;
  const r = { Alta: 0, Media: 1, Bassa: 2 };
  const pa = r[a.priorita] ?? 1, pb = r[b.priorita] ?? 1;
  if (pa !== pb) return pa - pb;
  return String(b.creato_il).localeCompare(String(a.creato_il));
};
const leRoutine = () => attivita.filter((t) => t.tipo === 'Routine').sort((a, b) => (a.ordine || 0) - (b.ordine || 0));
const leRoutineDi = (m) => leRoutine().filter((t) => momentoDi(t) === m);

const momentiOrdinati = () => {
  const h = new Date().getHours();
  return (h < 14 ? ['Mattina', 'Sera'] : ['Sera', 'Mattina']).concat(['In giornata']);
};
const iLavori   = () => attivita.filter((t) => t.tipo === 'Lavoro');
const leNote    = () => attivita.filter((t) => t.tipo === 'Nota').sort((a, b) => String(b.creato_il).localeCompare(String(a.creato_il)));
const laSpesa   = () => attivita.filter((t) => t.tipo === 'Spesa');
const interventiDi = (idAn) => interventi.filter((x) => x.animale_id === idAn)
  .sort((a, b) => String(b.data_evento).localeCompare(String(a.data_evento)));
const noteDi = (idAn) => leNote().filter((t) => t.animale_id === idAn);
const nomeAnimale = (id) => { const a = animali.find((x) => x.id === id); return a ? a.nome : ''; };
const spesaTotale = (an) => Number(an.costo_acquisto || 0)

function avvisiCorrenti() {
  const v = [];
  const conOra = (t) => t.titolo + (t.ora ? ' (ore ' + t.ora + ')' : '');
  const ritardo = iLavori().filter((t) => t.stato !== 'Completato' && t.scadenza && giorniDaOggi(t.scadenza) < 0);
  const oggiSc  = iLavori().filter((t) => t.stato !== 'Completato' && t.scadenza === OGGI);
  const domani  = iLavori().filter((t) => t.stato !== 'Completato' && t.scadenza === fraGiorni(1));
  const inCorso = iLavori().filter((t) => t.stato === 'In corso');
  const rtMancanti = leRoutine().filter((t) => !routineFatta(t));
  const daComprare = laSpesa().filter((t) => t.stato !== 'Completato');

  // `conta` dice se l'avviso deve far comparire il numero rosso sulla campanella:
  // è un campo esplicito, non si deduce leggendo il testo.
  if (ritardo.length) v.push({ ico: '⛔', testo: `${ritardo.length} ${ritardo.length === 1 ? 'lavoro in ritardo' : 'lavori in ritardo'}`,
    dettaglio: ritardo.slice(0, 3).map(conOra).join(' · '), vista: 'lavori', forte: true, conta: true });
  if (oggiSc.length) v.push({ ico: '📅', testo: `${oggiSc.length} in scadenza oggi`,
    dettaglio: oggiSc.slice(0, 3).map(conOra).join(' · '), vista: 'oggi', conta: true });
  if (inCorso.length) v.push({ ico: '🔄', testo: `${inCorso.length} ${inCorso.length === 1 ? 'lavoro iniziato' : 'lavori iniziati'} e non finiti`,
    dettaglio: inCorso.slice(0, 3).map(conOra).join(' · '), vista: 'lavori', conta: false });
  if (rtMancanti.length) v.push({ ico: '☀️', testo: `${rtMancanti.length} routine da fare oggi`,
    dettaglio: rtMancanti.slice(0, 4).map((t) => t.titolo).join(' · '), vista: 'oggi', conta: false });
  if (daComprare.length) v.push({ ico: '🛒', testo: `${daComprare.length} ${daComprare.length === 1 ? 'articolo da comprare' : 'articoli da comprare'}`,
    dettaglio: daComprare.slice(0, 4).map((t) => t.titolo).join(' · '), vista: 'spesa', conta: true });
  if (domani.length) v.push({ ico: '🌅', testo: `${domani.length} in scadenza domani`,
    dettaglio: domani.slice(0, 3).map(conOra).join(' · '), vista: 'oggi', conta: false });
  return v;
}

/* ==========================================================================
   SCHEDE ATTIVITÀ
   ========================================================================== */
// Involucro per il trascinamento laterale. Le scritte del fondo dicono cosa
// succede: quella a sinistra si scopre trascinando verso destra, e viceversa.
function conSwipe(dentro, { id, dx, sx, etDx, etSx }) {
  if (!dx && !sx) return dentro;
  return `<div class="swipe" data-sw-id="${id}" data-dx="${dx || ''}" data-sx="${sx || ''}">
      <div class="swipe-fondo" aria-hidden="true">
        <span class="sx-eti">${etDx || ''}</span>
        <span class="dx-eti">${etSx || ''}</span>
      </div>
      ${dentro}
    </div>`;
}

function schedaLavoro(t, azioni = true) {
  const ritardo = t.stato !== 'Completato' && t.scadenza && giorniDaOggi(t.scadenza) < 0;
  const fatto = t.stato === 'Completato';
  const scheda = `
    <article class="scheda scorrevole tocca ${ritardo ? 'scheda-urgente' : ''} ${fatto ? 'scheda-fatta' : ''}" data-apri="${t.id}" role="button" tabindex="0">
      <h3 class="font-black text-base leading-tight ${fatto ? 'line-through opacity-60' : ''}">${pul(t.titolo)}
        <span class="font-bold" style="color:var(--inchiostro2)">›</span></h3>
      <div class="flex flex-wrap gap-1.5 mt-2">${etichetteDi(t)}</div>
      ${t.note ? `<p class="mt-2 text-sm font-semibold" style="color:var(--inchiostro2)">${pul(t.note)}</p>` : ''}
      ${tagFoto(t.foto_url)}
      ${azioni && !fatto ? `<div class="flex gap-2 mt-3 justify-end">
           ${t.stato === 'Da fare'
             ? `<button class="bot bot-chiaro bot-piccolo px-3" data-azione="inizia" data-id="${t.id}">▶ Inizia</button>` : ''}
           <button class="bot bot-verde bot-piccolo" data-azione="finisci" data-id="${t.id}">✓ Fatto</button>
         </div>` : ''}
    </article>`;
  if (fatto || !azioni) return scheda;
  return conSwipe(scheda, { id: t.id, dx: 'finisci', sx: t.stato === 'Da fare' ? 'inizia' : '',
                            etDx: '✓ Fatto', etSx: t.stato === 'Da fare' ? '▶ Inizia' : '' });
}

function rigaRoutine(t) {
  const fatta = routineFatta(t);
  return conSwipe(rigaRoutineDentro(t), {
    id: t.id, dx: fatta ? '' : 'routine', sx: fatta ? 'routine' : '',
    etDx: fatta ? '' : '✓ Fatto', etSx: fatta ? '↩ Da fare' : ''
  });
}

function rigaRoutineDentro(t) {
  return `
    <div class="riga scorrevole ${routineFatta(t) ? 'riga-ok' : ''}">
      <button type="button" class="cerchio" data-azione="routine" data-id="${t.id}"
              aria-label="${routineFatta(t) ? 'Annulla' : 'Segna come fatto'}">✓</button>
      <button type="button" class="riga-apri" data-apri="${t.id}">
        <span class="riga-tit">${pul(t.titolo)}</span>
        <span class="mt-1 flex flex-wrap gap-1.5">
          <span class="etichetta et-chi">👤 ${pul(persona(t.assegnato_a))}</span>
        </span>
      </button>
      <span class="text-xl shrink-0" style="color:var(--inchiostro2)">›</span>
    </div>`;
}

/* ==========================================================================
   CALENDARIO (widget compatto, in cima alla Home)
   ========================================================================== */
function delGiorno(g) {
  const aperte = iLavori().filter((t) => t.scadenza === g && t.stato !== 'Completato').sort(perUrgenza);
  const fatte  = iLavori().filter((t) => t.stato === 'Completato'
    && (t.scadenza === g || String(t.completato_il || '').slice(0, 10) === g));
  const rt     = leRoutine().filter((t) => t.ultimo_completamento === g);
  return { aperte, fatte, rt };
}

function widgetCalendario() {
  const primo = new Date(calA, calM, 1);
  const quanti = new Date(calA, calM + 1, 0).getDate();
  const salto = (primo.getDay() + 6) % 7;              // la settimana inizia lunedì

  let celle = '';
  for (let i = 0; i < salto; i++) celle += '<div class="cal-cel cal-vuota"></div>';
  for (let d = 1; d <= quanti; d++) {
    const g = `${calA}-${String(calM + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const { aperte, fatte, rt } = delGiorno(g);
    const ritardo = aperte.some((t) => giorniDaOggi(t.scadenza) < 0);
    const corso   = aperte.some((t) => t.stato === 'In corso');
    let p = '';
    if (ritardo) p += '<span class="punto p-ritardo"></span>';
    if (corso)   p += '<span class="punto p-incorso"></span>';
    if (aperte.length && !ritardo) p += '<span class="punto p-dafare"></span>';
    if (fatte.length + rt.length) p += '<span class="punto p-fatto"></span>';
    celle += `<button type="button" class="cal-cel ${g === OGGI ? 'cal-oggi' : ''} ${g === calSel ? 'cal-sel' : ''}" data-giorno="${g}">
        <span>${d}</span><span class="punti">${p}</span></button>`;
  }

  const ritardi = iLavori().filter((t) => t.stato !== 'Completato' && t.scadenza && giorniDaOggi(t.scadenza) < 0).length;
  const oggiSc  = iLavori().filter((t) => t.stato !== 'Completato' && t.scadenza === OGGI).length;

  return `<div class="scheda scheda-fitta">
      <div class="flex items-center gap-1">
        <button class="bot bot-chiaro bot-piccolo px-3" data-azione="mese-prec" aria-label="Mese precedente">‹</button>
        <h2 class="flex-1 text-center font-black text-sm truncate">${MESI[calM]} ${calA}</h2>
        <button class="bot bot-chiaro bot-piccolo px-3" data-azione="mese-succ" aria-label="Mese successivo">›</button>
      </div>
      <div class="cal mt-2">
        ${['L', 'M', 'M', 'G', 'V', 'S', 'D'].map((d) => `<div class="cal-gg">${d}</div>`).join('')}
        ${celle}
      </div>
      <div class="flex items-center gap-2 mt-2 flex-wrap">
        ${ritardi ? `<span class="etichetta et-ritardo">⛔ ${ritardi} in ritardo</span>` : ''}
        ${oggiSc ? `<span class="etichetta et-oggi">📅 ${oggiSc} oggi</span>` : ''}
        ${!ritardi && !oggiSc ? '<span class="etichetta">nessuna scadenza urgente</span>' : ''}
        <button class="bot bot-chiaro bot-piccolo ml-auto" data-azione="cal-oggi">Oggi</button>
        <button class="bot bot-chiaro bot-piccolo" data-vista="storico">📋 Storico</button>
      </div>
    </div>`;
}

/* ==========================================================================
   HOME: scadenze -> attività del giorno scelto -> routine
   ========================================================================== */
function disegnaOggi() {
  const rt = leRoutine();
  const fatte = rt.filter(routineFatta).length;

  // 1) scadenze: in ritardo e di oggi
  const scadute = iLavori().filter((t) => t.stato !== 'Completato' && t.scadenza && giorniDaOggi(t.scadenza) <= 0).sort(perUrgenza);
  // 2) prossimi 7 giorni: da domani in poi
  const settimana = iLavori().filter((t) => {
    if (t.stato === 'Completato' || !t.scadenza) return false;
    const n = giorniDaOggi(t.scadenza);
    return n >= 1 && n <= 7;
  }).sort(perUrgenza);
  // lavori iniziati che non compaiono in nessuna delle due liste sopra
  // (senza scadenza, o con scadenza oltre i 7 giorni): altrimenti si perderebbero
  const corsoAltrove = iLavori().filter((t) => t.stato === 'In corso'
    && !scadute.includes(t) && !settimana.includes(t)).sort(perUrgenza);

  let h = '';

  h += `<section><h2 class="titolo-sez">⚠️ Scadenze <span class="conta">${scadute.length}</span></h2>
      <div class="space-y-3">${scadute.length ? scadute.map((t) => schedaLavoro(t)).join('')
        : '<div class="scheda text-center py-6"><div class="text-3xl">👍</div><p class="mt-1 font-black">Nessuna scadenza da recuperare</p></div>'}</div></section>`;

  if (corsoAltrove.length) h += `<section><h2 class="titolo-sez">🔄 Iniziati <span class="conta">${corsoAltrove.length}</span></h2>
      <div class="space-y-3">${corsoAltrove.map((t) => schedaLavoro(t)).join('')}</div></section>`;

  h += `<section><h2 class="titolo-sez">🗓️ Prossimi 7 giorni <span class="conta">${settimana.length}</span></h2>
      <div class="space-y-3">${settimana.length ? settimana.map((t) => schedaLavoro(t)).join('')
        : '<div class="scheda text-center py-6"><p class="font-black">Niente in programma questa settimana</p></div>'}</div></section>`;

  if (!rt.length) {
    h += `<section><h2 class="titolo-sez">☀️ Routine</h2>
      <p class="scheda text-center font-bold py-6">Nessuna routine. Aggiungila da ⚙️</p></section>`;
  } else {
    momentiOrdinati().forEach((m) => {
      const lista = leRoutineDi(m);
      if (!lista.length) return;
      const f = lista.filter(routineFatta).length;
      h += `<section>
        <h2 class="titolo-sez">${ICONA_MOMENTO[m]} ${NOME_MOMENTO[m]} <span class="conta">${f}/${lista.length}</span></h2>
        <div class="space-y-2.5">${lista.map(rigaRoutine).join('')}</div>
      </section>`;
    });
    h += `<p class="text-xs font-semibold px-1" style="color:var(--inchiostro2)">
      Cerchietto = fatto · tocca il nome per modificarla. Le spunte del mattino e della sera sono separate.</p>`;
  }

  // 4) calendario in fondo, con l'elenco del giorno scelto subito sotto
  h += `<section><h2 class="titolo-sez">📅 Calendario</h2>${widgetCalendario()}</section>`;

  if (calSel !== OGGI) {
    const { aperte, fatte: f2 } = delGiorno(calSel);
    h += `<section><h2 class="titolo-sez">${pul(dataLunga(calSel))} <span class="conta">${aperte.length}</span></h2>
        <div class="space-y-3">${aperte.length ? aperte.map((t) => schedaLavoro(t)).join('')
          : '<div class="scheda text-center py-6"><p class="font-black">Niente in programma</p></div>'}
        ${f2.length ? f2.map((t) => schedaLavoro(t, false)).join('') : ''}</div>
        <button class="bot bot-chiaro w-full mt-3" data-azione="nuovo-nel-giorno">＋ Aggiungi in questo giorno</button></section>`;
  }

  $('#corpo-oggi').innerHTML = h;
}

/* ==========================================================================

   ========================================================================== */
function disegnaLavori() {
  const v = iLavori().filter(eMio);
  const daFare = v.filter((t) => t.stato === 'Da fare').sort(perUrgenza);
  const corso  = v.filter((t) => t.stato === 'In corso').sort(perUrgenza);
  const conData = daFare.filter((t) => t.scadenza);
  const senza   = daFare.filter((t) => !t.scadenza);

  let h = `<div class="flex gap-2">
      <button class="past flex-1" data-miei="tutti" aria-pressed="${filtroMiei === 'tutti'}">Tutti i lavori</button>
      <button class="past flex-1" data-miei="miei"  aria-pressed="${filtroMiei === 'miei'}">Solo i miei</button>
    </div>`;
  if (corso.length) h += `<section><h2 class="titolo-sez">🔄 In corso <span class="conta">${corso.length}</span></h2>
      <div class="space-y-3">${corso.map((t) => schedaLavoro(t)).join('')}</div></section>`;
  h += `<section><h2 class="titolo-sez">🔨 Con scadenza <span class="conta">${conData.length}</span></h2>
      <div class="space-y-3">${conData.length ? conData.map((t) => schedaLavoro(t)).join('')
        : '<p class="scheda text-center font-bold py-6">Nessun lavoro in scadenza 🎉</p>'}</div></section>`;
  if (senza.length) h += `<section><h2 class="titolo-sez">📥 Senza data <span class="conta">${senza.length}</span></h2>
      <div class="space-y-3">${senza.map((t) => schedaLavoro(t)).join('')}</div></section>`;
  $('#corpo-lavori').innerHTML = h;
}

/* ==========================================================================
   SPESA
   ========================================================================== */
function disegnaSpesa() {
  const s = laSpesa();
  const da = s.filter((t) => t.stato !== 'Completato');
  const presi = s.filter((t) => t.stato === 'Completato')
    .sort((a, b) => String(b.completato_il).localeCompare(String(a.completato_il)));
  // Spesa: verso destra "comprato", verso sinistra elimina (con Annulla).
  const riga = (t) => conSwipe(`
    <div class="riga scorrevole ${t.stato === 'Completato' ? 'riga-ok' : ''}">
      <button type="button" class="cerchio" data-azione="spesa" data-id="${t.id}" aria-label="Preso">✓</button>
      <span class="riga-tit flex-1 min-w-0">${pul(t.titolo)}</span>
      <button type="button" class="text-xl px-2 shrink-0" data-azione="elimina" data-id="${t.id}" aria-label="Elimina">🗑</button>
    </div>`, { id: t.id, dx: 'spesa', sx: 'elimina-spesa',
               etDx: t.stato === 'Completato' ? '↩ In lista' : '🛒 Comprato', etSx: '🗑 Elimina' });
  let h = `<section><h2 class="titolo-sez">🛒 Da comprare <span class="conta">${da.length}</span></h2>
      <div class="space-y-2.5">${da.length ? da.map(riga).join('')
        : '<p class="scheda text-center font-bold py-6">Lista vuota</p>'}</div></section>`;
  if (presi.length) h += `<section><h2 class="titolo-sez">✅ Comprati di recente <span class="conta">${presi.length}</span></h2>
      <div class="space-y-2.5">${presi.map(riga).join('')}</div>
      <p class="text-xs font-semibold mt-2 px-1" style="color:var(--inchiostro2)">
        Restano qui finché non li togli: tocca il cerchietto per rimetterli in lista.</p>
      <button class="bot bot-chiaro w-full mt-2" data-azione="svuota-comprati">🧹 Togli dalla lista i ${presi.length} comprati</button></section>`;
  $('#corpo-spesa').innerHTML = h;
}

/* ==========================================================================
   STORICO
   ========================================================================== */
const ICONA_AZIONE = { Aggiunto: '➕', Modificato: '✏️', Eliminato: '🗑', Fatto: '✅',
                       Iniziato: '▶️', Comprato: '🛒', Rimesso: '↩️' };

function disegnaDiario() {
  if (!diario.length) {
    return `<p class="scheda text-center font-bold py-10">Il diario è vuoto.<br>
      <span class="font-semibold text-sm">Da qui in avanti ogni cosa fatta finisce qui, con chi l'ha fatta e a che ora.</span></p>`;
  }
  const gruppi = {};
  diario.forEach((r) => {
    const g = String(r.quando).slice(0, 10);
    (gruppi[g] = gruppi[g] || []).push(r);
  });
  return Object.keys(gruppi).sort().reverse().map((g) => `
    <section>
      <h2 class="titolo-sez">📅 ${pul(etichettaData(g) || g)} <span class="conta">${gruppi[g].length}</span></h2>
      <div class="space-y-1.5">
        ${gruppi[g].map((r) => {
          const ora = new Date(r.quando).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
          return `<div class="scheda scheda-fitta flex items-start gap-2">
            <span class="text-lg shrink-0">${ICONA_AZIONE[r.azione] || '•'}</span>
            <span class="flex-1 min-w-0">
              <span class="block font-bold text-sm leading-tight">${pul(r.titolo || r.oggetto || '')}</span>
              <span class="block text-xs font-semibold mt-0.5" style="color:var(--inchiostro2)">
                ${pul(r.azione)}${r.oggetto ? ' · ' + pul(r.oggetto) : ''}${r.dettaglio ? ' · ' + pul(r.dettaglio) : ''}
              </span>
            </span>
            <span class="shrink-0 text-right">
              <span class="etichetta et-chi">${pul(persona(r.chi) || '?')}</span>

function disegnaStorico() {
  const fatti = attivita
    .filter((t) => (t.tipo === 'Lavoro' && t.stato === 'Completato') || (t.tipo === 'Routine' && t.ultimo_completamento))
    .map((t) => ({ t, quando: t.tipo === 'Routine' ? (t.completato_il || t.ultimo_completamento + 'T12:00:00') : (t.completato_il || t.creato_il) }))
    .sort((a, b) => String(b.quando).localeCompare(String(a.quando)));

  let h = `<button class="bot bot-chiaro w-full" data-vista="oggi">‹ Torna alla Home</button>
    <div class="flex gap-2">
      <button class="past flex-1" data-scheda="diario" aria-pressed="${schedaStorico === 'diario'}">📔 Chi ha fatto cosa</button>
      <button class="past flex-1" data-scheda="completati" aria-pressed="${schedaStorico === 'completati'}">✅ Completati</button>
    </div>`;

  if (schedaStorico === 'diario') {

    return;
  }

  if (!fatti.length) h += '<p class="scheda text-center font-bold py-10">Ancora nessun lavoro completato.</p>';
  else {
    const gr = {};
    fatti.forEach((x) => { const g = String(x.quando).slice(0, 10); (gr[g] = gr[g] || []).push(x); });
    h += Object.keys(gr).sort().reverse().map((g) => `
      <section><h2 class="titolo-sez">📅 ${pul(etichettaData(g) || g)} <span class="conta">${gr[g].length}</span></h2>
        <div class="space-y-3">${gr[g].map(({ t, quando }) => `
          <article class="scheda scheda-fatta ${t.tipo === 'Lavoro' ? 'tocca' : ''}" ${t.tipo === 'Lavoro' ? `data-apri="${t.id}" role="button" tabindex="0"` : ''}>
            <div class="flex items-start gap-2">
              <h3 class="flex-1 font-bold leading-tight">${pul(t.titolo)}</h3>
              <span class="etichetta shrink-0">${pul(oraLunga(quando))}</span>
            </div>
            <div class="flex flex-wrap gap-1.5 mt-2">
              ${t.tipo === 'Routine' ? '<span class="etichetta">🔁 Routine</span>' : ''}${etichetteDi(t)}
            </div>
            ${t.note ? `<p class="mt-2 text-sm font-semibold" style="color:var(--inchiostro2)">${pul(t.note)}</p>` : ''}
            ${tagFoto(t.foto_url)}
          </article>`).join('')}</div></section>`).join('');
  }
  $('#corpo-storico').innerHTML = h;
}

/* ==========================================================================
   OPERAZIONI
   ========================================================================== */
function metti(coll, riga) {
  const arr = elenco[coll]();
  const i = arr.findIndex((x) => x.id === riga.id);
  if (i < 0) arr.push(riga); else arr[i] = { ...arr[i], ...riga };
}

async function cambia(coll, id, cambi, messaggio) {
  const arr = elenco[coll]();
  const i = arr.findIndex((x) => x.id === id);
  if (i < 0) return;
  const prima = arr[i];
  arr[i] = { ...prima, ...cambi };
  disegna();
  try {
    await archivio.modifica(coll, id, cambi);
    if (navigator.vibrate) navigator.vibrate(14);
    if (messaggio) avvisa(messaggio);
  } catch (e) { arr[i] = prima; disegna(); avvisa('Non salvato: ' + (e.message || e), true); }
}

// Dal "quando va rifatto" di un intervento nasce un normale lavoro con la
// scadenza: così entra nel calendario, negli avvisi e nella notifica del
// mattino senza bisogno di codice apposta.
async function creaPromemoriaSanitario(idAnimale, tipoEvento, quando, descrizione) {
  const an = animali.find((x) => x.id === idAnimale);
  const titolo = `🩺 ${tipoEvento} — ${an ? an.nome : 'animale'}`;
  const giaCe = attivita.some((x) => x.tipo === 'Lavoro' && x.stato !== 'Completato'
    && x.titolo === titolo && x.scadenza === quando);
  if (giaCe) return;
  try {
    metti('attivita', await archivio.inserisci('attivita', {
      tipo: 'Lavoro', titolo, categoria: 'Animali', priorita: 'Media',
      assegnato_a: 'Tutti', scadenza: quando, stato: 'Da fare',
      note: [descrizione, 'Promemoria dal registro sanitario'].filter(Boolean).join(' · ')
    }));
    avvisa('📅 Promemoria per il ' + quando.split('-').reverse().join('/'));
  } catch (e) { avvisa('Promemoria non creato: ' + (e.message || e), true); }
}

// Un lavoro che si ripete: appena lo segni fatto, ne creo il successivo con la
// data spostata. Se esiste già (per esempio hai completato due volte lo stesso
// lavoro) non lo duplico.
async function ripetiSeServe(id) {
  const t = attivita.find((x) => x.id === id);
  if (!t || t.tipo !== 'Lavoro' || !t.ricorrenza || t.ricorrenza === 'Mai') return;
  const prossima = prossimaData(t.scadenza, t.ricorrenza);
  if (!prossima) return;
  const giaCe = attivita.some((x) => x.tipo === 'Lavoro' && x.stato !== 'Completato'
    && x.titolo === t.titolo && x.scadenza === prossima);
  if (giaCe) return;

  const nuovo = { tipo: 'Lavoro', titolo: t.titolo, categoria: t.categoria,
                  priorita: t.priorita, assegnato_a: t.assegnato_a, scadenza: prossima,
                  stato: 'Da fare', note: t.note || null, ricorrenza: t.ricorrenza };
  if (t.ora) nuovo.ora = t.ora;
  try {
    metti('attivita', await archivio.inserisci('attivita', nuovo));
    disegna();
    avvisa('🔁 Prossima volta: ' + prossima.split('-').reverse().join('/'));
  } catch (e) { avvisa('Ripetizione non creata: ' + (e.message || e), true); }
}

// `silenzioso` serve ai gesti: là il messaggio lo mostra chi ha fatto il gesto,
// insieme al pulsante Annulla, e non deve essere sovrascritto da questo.
const spuntaRoutine = (id, silenzioso) => {
  const t = attivita.find((x) => x.id === id); if (!t) return;
  const su = routineFatta(t);
  cambia('attivita', id, su ? { ultimo_completamento: null, completato_il: null }
                            : { ultimo_completamento: OGGI, completato_il: new Date().toISOString() },
         silenzioso ? null : (su ? 'Rimesso da fare' : '✓ Fatto'));
  annota(su ? 'Rimesso' : 'Fatto', 'Routine', t.titolo, null, id);
};
const spuntaSpesa = (id, silenzioso) => {
  const t = attivita.find((x) => x.id === id); if (!t) return;
  const fatto = t.stato === 'Completato';
  cambia('attivita', id, fatto ? { stato: 'Da fare', completato_il: null }
                               : { stato: 'Completato', completato_il: new Date().toISOString() },
         silenzioso ? null : (fatto ? 'Rimesso in lista' : '✓ Comprato'));
  annota(fatto ? 'Rimesso' : 'Comprato', 'Spesa', t.titolo, null, id);
};
async function svuotaComprati() {
  for (const t of laSpesa().filter((x) => x.stato === 'Completato')) {
    try { await archivio.elimina('attivita', t.id); attivita = attivita.filter((x) => x.id !== t.id); }
    catch (e) { avvisa('Errore: ' + e.message, true); }
  }
  disegna(); avvisa('Lista ripulita');
}
// Scambia una routine con quella sopra o sotto, riscrivendo il campo ordine.
async function spostaRoutine(id, direzione) {
  const lista = leRoutine();
  const i = lista.findIndex((t) => t.id === id);
  const j = i + direzione;
  if (i < 0 || j < 0 || j >= lista.length) return;
  const a = lista[i], b = lista[j];
  // uso le posizioni nella lista, così l'ordine resta compatto anche se i
  // valori sul database erano tutti a zero o duplicati
  const nuovoOrdineA = j + 1, nuovoOrdineB = i + 1;
  const primaA = a.ordine, primaB = b.ordine;
  a.ordine = nuovoOrdineA; b.ordine = nuovoOrdineB;
  disegnaImpostazioni(); disegna();
  try {
    await archivio.modifica('attivita', a.id, { ordine: nuovoOrdineA });
    await archivio.modifica('attivita', b.id, { ordine: nuovoOrdineB });
  } catch (e) {
    a.ordine = primaA; b.ordine = primaB;
    disegnaImpostazioni(); disegna();
    avvisa('Ordine non salvato: ' + (e.message || e), true);
  }
}

const NOME_OGGETTO = { attivita: 'Attività', animali: 'Animale', interventi: 'Intervento',
                       contatti: 'Contatto', iscrizioni: 'Dispositivo', diario: 'Diario' };

// come elimina(), ma senza il messaggio: lo mostra il gesto, con Annulla
async function eliminaSilenzioso(coll, id) { return elimina(coll, id, true); }

async function elimina(coll, id, silenzioso) {
  try {
    // prendo il titolo prima di cancellare, altrimenti nel diario resta un buco
    const riga = (elenco[coll] ? elenco[coll]() : []).find((x) => x.id === id) || {};
    const comeSiChiamava = riga.titolo || riga.nome || riga.tipo_evento || riga.dispositivo || '';
    const tipoRiga = coll === 'attivita' ? (riga.tipo || 'Attività') : NOME_OGGETTO[coll];
    await archivio.elimina(coll, id);
    if (coll !== 'diario') annota('Eliminato', tipoRiga, comeSiChiamava, null, null);
    if (coll === 'attivita') attivita = attivita.filter((x) => x.id !== id);
    if (coll === 'animali') { animali = animali.filter((x) => x.id !== id); interventi = interventi.filter((x) => x.animale_id !== id); }
    if (coll === 'interventi') interventi = interventi.filter((x) => x.id !== id);
    if (coll === 'contatti') contatti = contatti.filter((x) => x.id !== id);
    if (coll === 'iscrizioni') iscrizioni = iscrizioni.filter((x) => x.id !== id);
    disegna();
    if (!silenzioso) avvisa('Eliminato');
  } catch (e) { avvisa('Non eliminato: ' + (e.message || e), true); }
}

// Trascinamento: sposto la parte visibile della foto dentro il riquadro.
function agganciaTrascinamento() {
  const box = $('#inquadra');
  if (!box) return;
  const img = box.querySelector('img');
  let attivo = false, xIniziale = 0, yIniziale = 0, xPerc = 50, yPerc = 50;

  const leggiPosizione = () => {
    const p = (mod.foto_inquadratura && mod.foto_inquadratura !== 'intera') ? mod.foto_inquadratura : '50% 50%';
    const [a, b] = p.split(' ').map(parseFloat);
    return [isFinite(a) ? a : 50, isFinite(b) ? b : 50];
  };

  box.addEventListener('pointerdown', (ev) => {
    if (mod.foto_inquadratura === 'intera') return;
    attivo = true;
    try { box.setPointerCapture(ev.pointerId); } catch (e) {}
    xIniziale = ev.clientX; yIniziale = ev.clientY;
    [xPerc, yPerc] = leggiPosizione();
  });

  box.addEventListener('pointermove', (ev) => {
    if (!attivo) return;
    ev.preventDefault();
    const bw = box.clientWidth, bh = box.clientHeight;
    const nw = img.naturalWidth, nh = img.naturalHeight;
    if (!nw || !nh) return;
    // con il riempimento la foto è ingrandita: `avanzo` è la parte che esce dal
    // riquadro, ed è quella che possiamo spostare
    const scala = Math.max(bw / nw, bh / nh);
    const avanzoX = nw * scala - bw, avanzoY = nh * scala - bh;
    let nx = xPerc, ny = yPerc;
    if (avanzoX > 1) nx = Math.min(100, Math.max(0, xPerc - (ev.clientX - xIniziale) / avanzoX * 100));
    if (avanzoY > 1) ny = Math.min(100, Math.max(0, yPerc - (ev.clientY - yIniziale) / avanzoY * 100));
    mod.foto_inquadratura = Math.round(nx) + '% ' + Math.round(ny) + '%';
    img.style.objectPosition = mod.foto_inquadratura;
  });

  const fine = () => { attivo = false; };
  box.addEventListener('pointerup', fine);
  box.addEventListener('pointercancel', fine);
  box.addEventListener('pointerleave', fine);
}

      <div><label class="didascalia" for="m-data-evento">Data</label>
        <input id="m-data-evento" type="date" class="campo mt-1.5" value="${pul(mod.data_evento)}"></div>
      <div><label class="didascalia" for="m-descrizione">Descrizione</label>

      ${bloccoFoto('Foto della ricevuta')}
      <button class="bot bot-verde bot-largo" data-azione="salva">${nuovo ? '＋ Aggiungi intervento' : '💾 Salva'}</button>
      ${!nuovo ? '<button class="bot bot-rosso bot-largo" data-azione="elimina-nel-pannello">🗑 Elimina intervento</button>' : ''}`;

  /* ---------- CONTATTO ---------- */
  if (k === 'Contatto') {
    $('#pannello-titolo').textContent = 'Nuovo contatto';
    $('#pannello-corpo').innerHTML = `
      <div><label class="didascalia" for="m-titolo">Nome</label>

        <div class="flex flex-wrap gap-2 mt-1.5">${pastiglie(RUOLI, mod.ruolo, 'ruolo', '')}</div></div>
      <div><label class="didascalia" for="m-telefono">Telefono</label>
        <input id="m-telefono" type="tel" inputmode="tel" class="campo mt-1.5" value="${pul(mod.telefono)}" placeholder="+39 333 1234567"></div>
      <div><label class="didascalia" for="m-note">Note</label>
        <textarea id="m-note" rows="2" class="campo mt-1.5" placeholder="Orari, indirizzo…">${pul(mod.note)}</textarea></div>
      <button class="bot bot-verde bot-largo" data-azione="salva">＋ Aggiungi contatto</button>`;
    return;
  }

  /* ---------- ATTIVITÀ / ROUTINE / NOTA / SPESA ---------- */
  const eLavoro = k === 'Lavoro', eRoutine = k === 'Routine', eNota = k === 'Nota', eSpesa = k === 'Spesa';
  $('#pannello-titolo').textContent = nuovo
    ? (eNota ? 'Nuova nota' : eSpesa ? 'Aggiungi alla spesa' : eRoutine ? 'Nuova routine' : 'Nuova attività')
    : (eNota ? 'Nota' : eSpesa ? 'Articolo' : eRoutine ? 'Routine giornaliera' : 'Attività');

  let h = `<div>

      <input id="m-titolo" class="campo mt-1.5" maxlength="140" autocomplete="off" value="${pul(mod.titolo)}"
             placeholder="${eNota ? 'Es. Vacca 12 — zoppia zampa dx' : eSpesa ? 'Es. Mangime 25 kg' : eRoutine ? 'Es. Cibo animali' : 'Es. Riparare recinto pascolo sud'}">
    </div>`;

  if (eSpesa) {
    h += `<button class="bot bot-verde bot-largo" data-azione="salva">${nuovo ? '＋ Aggiungi alla lista' : '💾 Salva'}</button>`;

            <div class="flex flex-wrap gap-2 mt-1.5">${pastiglie(CATEGORIE, mod.categoria, 'categoria', '')}</div></div>`;

  }
  if (eRoutine) {
    // in creazione si può chiedere la coppia mattina+sera in un colpo
    const scelte = nuovo ? MOMENTI.concat([MOMENTO_DOPPIO]) : MOMENTI;

      <div class="flex flex-wrap gap-2 mt-1.5">${pastiglie(scelte, mod.momento || 'Mattina', 'momento', '')}</div>

  if (eLavoro) {

              <div class="flex gap-2 mt-1.5 overflow-x-auto no-sb">
                ${[['Oggi', OGGI], ['Domani', fraGiorni(1)], ['Fra 3 gg', fraGiorni(3)], ['Nessuna', '']]
                  .map(([l, v]) => `<button type="button" class="past flex-1" aria-pressed="${mod.scadenza === v}" data-imposta="scadenza" data-valore="${v}">${l}</button>`).join('')}
              </div>
              <input id="m-scadenza" type="date" class="campo mt-2" value="${pul(mod.scadenza)}"></div>
            <div><label class="didascalia" for="m-ora">Orario dell'appuntamento (se serve)</label>
              <div class="flex gap-2 mt-1.5">
                <input id="m-ora" type="time" class="campo flex-1" value="${pul(mod.ora || '')}">
                ${mod.ora ? '<button type="button" class="bot bot-chiaro" data-imposta="ora" data-valore="">Togli</button>' : ''}
              </div>
              <p class="text-xs font-semibold mt-1" style="color:var(--inchiostro2)">
                Lascialo vuoto se è un lavoro da fare "in giornata".</p></div>
            <div><span class="didascalia">Priorità</span><div class="flex gap-2 mt-1.5">${pastiglie(PRIORITA, mod.priorita, 'priorita')}</div></div>
            <div><span class="didascalia">Si ripete</span>
              <div class="flex flex-wrap gap-2 mt-1.5">${pastiglie(RICORRENZE.map((r) => r.v), mod.ricorrenza || 'Mai', 'ricorrenza', '')}</div>
              <p class="text-xs font-semibold mt-1" style="color:var(--inchiostro2)">
                Quando lo segni fatto, l'app ricrea da sé il prossimo con la data spostata.
                Per le cose di ogni giorno usa invece le routine.</p></div>`;
      if (!nuovo) h += `<div><span class="didascalia">Stato</span><div class="flex gap-2 mt-1.5">${pastiglie(STATI, mod.stato, 'stato')}</div></div>`;
    }

  if (eLavoro ? (mod.extra || !nuovo) : true) {

  h += `<button class="bot bot-verde bot-largo" data-azione="salva">${nuovo ? '＋ Aggiungi' : '💾 Salva modifiche'}</button>`;
  if (!nuovo) {

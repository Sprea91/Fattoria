<!--
  ============================================================================
  FATTORIA TASKS — v2  (Single Page PWA, file unico)
  ============================================================================
  5 sezioni: Oggi · Lavori · Registro · Spesa · Storico
  + routine giornaliere che ogni giorno tornano "da fare"
  + foto scattate dal telefono (Supabase Storage)

  ATTENZIONE: questa versione usa colonne NUOVE nel database.
  Devi eseguire una volta lo script "schema-v2.sql" nell'SQL Editor di
  Supabase (lo trovi nella stessa cartella di questo file, oppure ricopiato
  qui sotto tra "-- INIZIO" e "-- FINE").

  ============================================================================
-- INIZIO ---------------------------------------------------------------------

create extension if not exists "pgcrypto";

-- 1) TABELLA (ricreata da zero: la vecchia versione non serve più)
drop table if exists public.tasks cascade;

create table public.tasks (
  id               uuid        primary key default gen_random_uuid(),
  kind             text        not null default 'Lavoro',   -- Routine | Lavoro | Nota | Spesa
  title            text        not null,
  category         text,                                    -- Animali | Recinti | Macchine | Altro
  priority         text        not null default 'Media',    -- Alta | Media | Bassa
  assigned_to      text        not null default 'Io',       -- Io | Anna | Tutti
  due_date         date,
  estimated_time   text,                                    -- 30m | 1h | 2h+
  status           text        not null default 'Da fare',  -- Da fare | In corso | Completato
  notes            text,
  photo_url        text,
  is_daily_routine boolean     not null default false,
  last_done_date   date,                                    -- ultimo giorno in cui la routine è stata spuntata
  completed_at     timestamptz,                             -- data/ora di completamento (per lo Storico)
  created_at       timestamptz not null default now(),
  sort_order       int         not null default 0
);

create index tasks_kind_idx      on public.tasks (kind);
create index tasks_due_date_idx  on public.tasks (due_date);
create index tasks_completed_idx on public.tasks (completed_at desc);

-- 2) SICUREZZA (accesso aperto: uso familiare senza login)
alter table public.tasks enable row level security;
create policy "tasks_all_select" on public.tasks for select using (true);
create policy "tasks_all_insert" on public.tasks for insert with check (true);
create policy "tasks_all_update" on public.tasks for update using (true) with check (true);
create policy "tasks_all_delete" on public.tasks for delete using (true);

-- 3) REALTIME
alter table public.tasks replica identity full;
do $$ begin
  alter publication supabase_realtime add table public.tasks;
exception when duplicate_object then null; end $$;

-- 4) STORAGE per le foto (bucket pubblico "farm-photos")
insert into storage.buckets (id, name, public)
values ('farm-photos', 'farm-photos', true)
on conflict (id) do update set public = true;

drop policy if exists "farm_photos_read"   on storage.objects;
drop policy if exists "farm_photos_write"  on storage.objects;
drop policy if exists "farm_photos_delete" on storage.objects;

create policy "farm_photos_read"   on storage.objects for select using (bucket_id = 'farm-photos');
create policy "farm_photos_write"  on storage.objects for insert with check (bucket_id = 'farm-photos');
create policy "farm_photos_delete" on storage.objects for delete using (bucket_id = 'farm-photos');

-- 5) ROUTINE GIORNALIERE di partenza (modificabili e cancellabili dall'app)
insert into public.tasks (kind, title, is_daily_routine, assigned_to, estimated_time, category, sort_order) values
  ('Routine', 'Cibo animali',      true, 'Tutti', '30m', 'Animali', 1),
  ('Routine', 'Acqua animali',     true, 'Tutti', '30m', 'Animali', 2),
  ('Routine', 'Raccolta uova',     true, 'Anna',  '30m', 'Animali', 3),
  ('Routine', 'Controllo recinti', true, 'Io',    '30m', 'Recinti', 4),
  ('Routine', 'Mungitura',         true, 'Tutti', '1h',  'Animali', 5);

-- FINE -----------------------------------------------------------------------
-->

const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

function daysFromToday(isoDate) {
  if (!isoDate) return null;
  const [y, m, d] = isoDate.split('-').map(Number);
  const a = new Date(y, m - 1, d), b = new Date(); b.setHours(0, 0, 0, 0);
  return Math.round((a - b) / 86400000);
}
function dateLabel(isoDate) {
  const n = daysFromToday(isoDate);
  if (n === null) return '';
  if (n === 0) return 'Oggi';
  if (n === 1) return 'Domani';
  if (n === -1) return 'Ieri';

function stampLabel(ts) {
  if (!ts) return '';

        ['Mungitura', 'Tutti', 'Animali']
      ].map((r, i) => ({
        id: crypto.randomUUID(), kind: 'Routine', title: r[0], assigned_to: r[1], category: r[2],
        is_daily_routine: true, estimated_time: '30m', priority: 'Media', status: 'Da fare',
        sort_order: i + 1, created_at: new Date().toISOString()
      }));
      this.write(all);
    }
    return all;
  },
  async insert(row) {
    const t = { id: crypto.randomUUID(), created_at: new Date().toISOString(), status: 'Da fare',
                priority: 'Media', is_daily_routine: false, sort_order: 0, ...row };
    const all = this.read(); all.push(t); this.write(all); return t;
  },
  async update(id, patch) {
    const all = this.read(); const i = all.findIndex((t) => t.id === id);
    if (i < 0) throw new Error('Non trovato'); all[i] = { ...all[i], ...patch }; this.write(all); return all[i];
  },
  async remove(id) { this.write(this.read().filter((t) => t.id !== id)); },
  async uploadPhoto(blob, dataUrl) { return dataUrl; }      // in locale la foto resta come dato interno
};

const remoteStore = {
  async load() {
    const { data, error } = await db.from('tasks').select('*').order('sort_order').order('created_at', { ascending: false });
    if (error) throw error;
    return data || [];
  },
  async insert(row) {
    const { data, error } = await db.from('tasks').insert(row).select().single();
    if (error) throw error; return data;
  },
  async update(id, patch) {
    const { data, error } = await db.from('tasks').update(patch).eq('id', id).select().single();
    if (error) throw error; return data;
  },
  async remove(id) {
    const { error } = await db.from('tasks').delete().eq('id', id);
    if (error) throw error;
  },
  async uploadPhoto(blob) {
    const name = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
    const { error } = await db.storage.from(BUCKET).upload(name, blob, { contentType: 'image/jpeg', cacheControl: '31536000' });
    if (error) throw new Error('Foto non caricata: ' + error.message);
    return db.storage.from(BUCKET).getPublicUrl(name).data.publicUrl;
  }
};

/* ==========================================================================
   FOTO: compressione lato telefono (rete debole in stalla) + anteprima
   ========================================================================== */
async function shrink(file, max = 1280, q = 0.72) {
  const bmp = await (async () => {
    if (window.createImageBitmap) { try { return await createImageBitmap(file); } catch (e) {} }
    return await new Promise((res, rej) => {
      const im = new Image(); const fr = new FileReader();
      fr.onload = () => { im.onload = () => res(im); im.onerror = rej; im.src = fr.result; };
      fr.onerror = rej; fr.readAsDataURL(file);
    });
  })();
  const w0 = bmp.width || bmp.naturalWidth, h0 = bmp.height || bmp.naturalHeight;
  const k = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement('canvas');
  c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', q));
  return { blob, dataUrl: c.toDataURL('image/jpeg', q) };
}

let toastTimer = null;
function toast(msg, err = false) {

  el.textContent = msg;
  el.style.background = err ? '#8C1D18' : '#20281A';
  el.hidden = false;
  clearTimeout(toastTimer);

}
function setConn(text, bg, fg) {

// `campo` è il nome del dato che il chip imposta; `attr` è l'attributo che lo
// veicola (data-nl nel form rapido, data-sh nello sheet). Il valore va SEMPRE
// in data-value, altrimenti il gestore dei tap non sa cosa impostare.
function chips(host, values, current, attr, campo, cls = 'flex-1') {
  $(host).innerHTML = values.map((v) => {
    const val = typeof v === 'object' ? v.v : v;
    const lab = typeof v === 'object' ? `${v.e} ${v.v}` : v;
    return `<button type="button" class="chip ${cls}" aria-pressed="${current === val}"
              ${attr}="${campo}" data-value="${esc(val)}">${esc(lab)}</button>`;
  }).join('');
}
function badgesOf(t) {
  const out = [];
  if (t.category) out.push(`<span class="badge">${catEmoji(t.category)} ${esc(t.category)}</span>`);
  if (t.estimated_time) out.push(`<span class="badge">⏱️ ${esc(t.estimated_time)}</span>`);
  out.push(`<span class="badge badge-who">👤 ${esc(t.assigned_to)}</span>`);
  if (t.priority === 'Alta' && t.status !== 'Completato') out.push('<span class="badge badge-pri">🔥 Alta</span>');
  if (t.due_date && t.status !== 'Completato') {
    const n = daysFromToday(t.due_date);
    const cls = n < 0 ? 'badge-hot' : n === 0 ? 'badge-today' : '';
    out.push(`<span class="badge ${cls}">📅 ${esc(dateLabel(t.due_date))}</span>`);
  }
  return out.join('');
}
function photoTag(t) {
  return t.photo_url ? `<img src="${esc(t.photo_url)}" class="thumb mt-2" alt="Foto" loading="lazy" data-lb="${esc(t.photo_url)}">` : '';
}

/* ==========================================================================
   SELEZIONI / ORDINAMENTI
   ========================================================================== */
const routineDone = (t) => t.last_done_date === TODAY;
const isMine = (t) => mine === 'tutti' || t.assigned_to === me || t.assigned_to === 'Tutti';

const byUrgency = (a, b) => {
  const da = a.due_date ? daysFromToday(a.due_date) : 9e5;
  const dbb = b.due_date ? daysFromToday(b.due_date) : 9e5;
  if (da !== dbb) return da - dbb;
  const rank = { Alta: 0, Media: 1, Bassa: 2 };
  const pa = rank[a.priority] ?? 1, pb = rank[b.priority] ?? 1;
  if (pa !== pb) return pa - pb;
  return String(b.created_at).localeCompare(String(a.created_at));
};

const routines = () => tasks.filter((t) => t.kind === 'Routine').sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
const lavori   = () => tasks.filter((t) => t.kind === 'Lavoro');
const note     = () => tasks.filter((t) => t.kind === 'Nota').sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
const spesa    = () => tasks.filter((t) => t.kind === 'Spesa');

function cardLavoro(t, azioni = true) {
  const late = t.status !== 'Completato' && t.due_date && daysFromToday(t.due_date) < 0;
  return `
    <article class="card ${late ? 'card-hot' : ''} ${t.status === 'Completato' ? 'card-done' : ''}" data-open="${t.id}">
      <div class="flex items-start gap-2">
        <h3 class="flex-1 font-black text-base leading-tight ${t.status === 'Completato' ? 'line-through opacity-60' : ''}">${esc(t.title)}</h3>
        ${azioni ? `<button class="btn btn-primary btn-sm shrink-0" data-act="${t.status === 'Da fare' ? 'start' : 'done'}" data-id="${t.id}">
             ${t.status === 'Da fare' ? '▶ Inizia' : '✓ Fatto'}</button>` : ''}
      </div>
      <div class="flex flex-wrap gap-1.5 mt-2">${badgesOf(t)}</div>
      ${t.notes ? `<p class="mt-2 text-sm font-semibold" style="color:var(--ink-2)">${esc(t.notes)}</p>` : ''}
      ${photoTag(t)}
    </article>`;
}

  h += `<section>
      <h2 class="h-sec">☀️ Routine di oggi <span class="h-count">${fatte}/${rt.length}</span></h2>
      <div class="space-y-2">
        ${rt.length ? rt.map((t) => `

              <span class="mt-1 flex flex-wrap gap-1.5">
                <span class="badge badge-who">👤 ${esc(t.assigned_to)}</span>
                ${t.estimated_time ? `<span class="badge">⏱️ ${esc(t.estimated_time)}</span>` : ''}
              </span>
            </span>

      <div class="space-y-2.5">${urgenti.map((t) => cardLavoro(t)).join('')}</div></section>`;

      <div class="space-y-2.5">${inCorso.map((t) => cardLavoro(t)).join('')}</div></section>`;

  if (!urgenti.length && !inCorso.length) {
    h += `<section class="card text-center py-8">
        <div class="text-4xl">👍</div>
        <p class="mt-2 font-black">Nessuna scadenza oggi</p>
        <p class="mt-1 text-sm font-semibold" style="color:var(--ink-2)">I lavori programmati sono nella sezione Lavori.</p>

/* ==========================================================================

   ========================================================================== */
function renderStorico() {
  const fatti = tasks
    .filter((t) => (t.kind === 'Lavoro' && t.status === 'Completato') || (t.kind === 'Routine' && t.last_done_date))
    .map((t) => ({ t, quando: t.kind === 'Routine' ? (t.completed_at || t.last_done_date + 'T12:00:00') : (t.completed_at || t.created_at) }))
    .sort((a, b) => String(b.quando).localeCompare(String(a.quando)));

  if (!fatti.length) {
    $('#storico-body').innerHTML = `<p class="card text-center font-bold py-10">Ancora nessun lavoro completato.</p>`;
    return;
  }
  // raggruppo per giorno
  const gruppi = {};
  fatti.forEach((x) => { const g = String(x.quando).slice(0, 10); (gruppi[g] = gruppi[g] || []).push(x); });

  $('#storico-body').innerHTML = Object.keys(gruppi).sort().reverse().map((g) => `
    <section>
      <h2 class="h-sec">📅 ${esc(dateLabel(g) || g)} <span class="h-count">${gruppi[g].length}</span></h2>
      <div class="space-y-2.5">
        ${gruppi[g].map(({ t, quando }) => `
          <article class="card card-done" ${t.kind === 'Lavoro' ? `data-open="${t.id}"` : ''}>
            <div class="flex items-start gap-2">
              <h3 class="flex-1 font-bold text-base leading-tight">${esc(t.title)}</h3>
              <span class="badge">${esc(stampLabel(quando))}</span>
            </div>

              ${t.kind === 'Routine' ? '<span class="badge">🔁 Routine</span>' : ''}

            </div>
            ${t.notes ? `<p class="mt-2 text-sm font-semibold" style="color:var(--ink-2)">${esc(t.notes)}</p>` : ''}
            ${photoTag(t)}
          </article>`).join('')}
      </div>
    </section>`).join('');
}

/* ==========================================================================
   RENDER: dispatcher
   ========================================================================== */
function render() {
  if (loadFailed) return;
  ['oggi', 'lavori', 'registro', 'spesa', 'storico'].forEach((v) => { $('#view-' + v).hidden = (v !== view); });
  $$('#nav .tab').forEach((b) => {
    if (b.dataset.view === view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  $('#btn-me').textContent = me === 'Anna' ? 'A' : 'I';

  if (view === 'oggi')     renderOggi();
  if (view === 'lavori')   renderLavori();
  if (view === 'registro') renderRegistro();
  if (view === 'spesa')    renderSpesa();
  if (view === 'storico')  renderStorico();
}

/* ==========================================================================
   AZIONI
   ========================================================================== */
function upsertLocal(row) {
  const i = tasks.findIndex((t) => t.id === row.id);
  if (i < 0) tasks.push(row); else tasks[i] = { ...tasks[i], ...row };
}

async function patch(id, p, msg) {
  const i = tasks.findIndex((t) => t.id === id);
  if (i < 0) return;
  const before = tasks[i];
  tasks[i] = { ...before, ...p };
  render();
  try {
    await store.update(id, p);
    if (navigator.vibrate) navigator.vibrate(14);
    if (msg) toast(msg);
  } catch (e) {
    tasks[i] = before; render();
    toast('Non salvato: ' + (e.message || e), true);
  }
}

const toggleRoutine = (id) => {
  const t = tasks.find((x) => x.id === id); if (!t) return;
  const on = routineDone(t);
  patch(id, on ? { last_done_date: null, completed_at: null }
               : { last_done_date: TODAY, completed_at: new Date().toISOString() },
        on ? 'Rimesso da fare' : '✓ Fatto');
};

const toggleSpesa = (id) => {
  const t = tasks.find((x) => x.id === id); if (!t) return;
  const done = t.status === 'Completato';
  patch(id, done ? { status: 'Da fare', completed_at: null }
                 : { status: 'Completato', completed_at: new Date().toISOString() });
};

async function svuotaSpesa() {
  const presi = spesa().filter((t) => t.status === 'Completato');
  for (const t of presi) {
    try { await store.remove(t.id); tasks = tasks.filter((x) => x.id !== t.id); } catch (e) { toast('Errore: ' + e.message, true); }
  }
  render(); toast('Lista ripulita');
}

async function removeTask(id) {
  try { await store.remove(id); tasks = tasks.filter((t) => t.id !== id); render(); toast('Eliminato'); }
  catch (e) { toast('Non eliminato: ' + (e.message || e), true); }
}

}

/* ==========================================================================
   SHEET: dettaglio, modifica, eliminazione
   ========================================================================== */
function openSheet(id) {
  const t = tasks.find((x) => x.id === id); if (!t) return;
  sheetId = id;
  const isLavoro = t.kind === 'Lavoro', isRoutine = t.kind === 'Routine';
  $('#sheet-title').textContent = isRoutine ? 'Routine' : isLavoro ? 'Attività' : 'Nota';
  const foto = photo.sheet ? photo.sheet.dataUrl : t.photo_url;

  $('#sheet-body').innerHTML = `
    <div>
      <span class="lbl">Titolo</span>
      <input id="sh-title" class="field mt-1.5" value="${esc(t.title)}" maxlength="140">
    </div>
    ${isLavoro || isRoutine ? `
      <div><span class="lbl">Cosa</span><div id="sh-category" class="flex gap-2 mt-1.5 overflow-x-auto no-sb"></div></div>
      <div><span class="lbl">Tempo</span><div id="sh-time" class="flex gap-2 mt-1.5"></div></div>
      <div><span class="lbl">Chi</span><div id="sh-who" class="flex gap-2 mt-1.5"></div></div>` : ''}
    ${isLavoro ? `
      <div><span class="lbl">Priorità</span><div id="sh-priority" class="flex gap-2 mt-1.5"></div></div>
      <div><span class="lbl">Scadenza</span><input id="sh-due" type="date" class="field mt-1.5" value="${esc(t.due_date || '')}"></div>
      <div><span class="lbl">Stato</span><div id="sh-status" class="flex gap-2 mt-1.5"></div></div>` : ''}
    <div>
      <span class="lbl">Note</span>
      <textarea id="sh-notes" rows="3" class="field mt-1.5">${esc(t.notes || '')}</textarea>
    </div>
    <div>
      <span class="lbl">Foto</span>
      ${foto ? `<img src="${esc(foto)}" class="thumb mt-1.5" alt="Foto" data-lb="${esc(foto)}">` : ''}
      <div class="flex gap-2 mt-2">
        <button type="button" class="btn btn-ghost flex-1" data-photo-pick="sheet">📷 ${foto ? 'Cambia' : 'Aggiungi'} foto</button>
        ${foto ? `<button type="button" class="btn btn-danger" data-act="sh-photo-del">🗑</button>` : ''}
      </div>
    </div>
    <button class="btn btn-primary btn-wide" data-act="sh-save">💾 Salva modifiche</button>
    <button class="btn btn-danger btn-wide" data-act="sh-del">🗑 Elimina</button>`;

  const d = { category: t.category || 'Altro', estimated_time: t.estimated_time || '30m',
              assigned_to: t.assigned_to || 'Io', priority: t.priority || 'Media', status: t.status || 'Da fare' };
  $('#sheet-body').dataset.d = JSON.stringify(d);
  if (isLavoro || isRoutine) {
    chips('#sh-category', CATEGORIES, d.category, 'data-sh', 'category', '');
    chips('#sh-time', TIMES, d.estimated_time, 'data-sh', 'estimated_time');
    chips('#sh-who', WHO, d.assigned_to, 'data-sh', 'assigned_to');
  }
  if (isLavoro) {
    chips('#sh-priority', PRIORITY, d.priority, 'data-sh', 'priority');
    chips('#sh-status', ['Da fare', 'In corso', 'Completato'], d.status, 'data-sh', 'status');
  }
  $('#sheet').hidden = false;
  document.body.style.overflow = 'hidden';
}

function closeSheet() {
  $('#sheet').hidden = true; document.body.style.overflow = ''; sheetId = null; photo.sheet = null;
}

async function saveSheet() {
  const t = tasks.find((x) => x.id === sheetId); if (!t) return;
  const d = JSON.parse($('#sheet-body').dataset.d || '{}');
  const p = { title: $('#sh-title').value.trim() || t.title, notes: $('#sh-notes').value.trim() || null };
  if (t.kind === 'Lavoro' || t.kind === 'Routine') {
    p.category = d.category; p.estimated_time = d.estimated_time; p.assigned_to = d.assigned_to;
  }
  if (t.kind === 'Lavoro') {
    p.priority = d.priority;
    p.due_date = $('#sh-due').value || null;
    p.status = d.status;
    p.completed_at = d.status === 'Completato' ? (t.completed_at || new Date().toISOString()) : null;
  }
  try {
    if (photo.sheet) p.photo_url = await store.uploadPhoto(photo.sheet.blob, photo.sheet.dataUrl);
    upsertLocal(await store.update(sheetId, p));
    closeSheet(); render(); toast('Modifiche salvate');
  } catch (e) { toast('Non salvato: ' + (e.message || e), true); }
}

/* ==========================================================================
   IMPOSTAZIONI
   ========================================================================== */
function openSettings() {
  sheetId = null;
  $('#sheet-title').textContent = 'Impostazioni';
  const rt = routines();
  $('#sheet-body').innerHTML = `
    <div>
      <span class="lbl">Chi sta usando l'app</span>
      <p class="text-sm font-semibold mt-1" style="color:var(--ink-2)">Serve al filtro “Solo i miei” nella sezione Lavori.</p>
      <div class="flex gap-2 mt-2">
        <button class="chip flex-1" data-me="Io"   aria-pressed="${me === 'Io'}">Io</button>
        <button class="chip flex-1" data-me="Anna" aria-pressed="${me === 'Anna'}">Anna</button>
      </div>
    </div>
    <div>
      <span class="lbl">Collegamento</span>
      <p class="mt-1 font-bold">${CONFIGURED ? 'Database Supabase' : 'Solo questo dispositivo (Supabase non configurato)'}</p>
      <p class="text-sm font-semibold" style="color:var(--ink-2)">Stato: ${esc($('#conn').textContent)}</p>
    </div>
    <div>
      <span class="lbl">Routine giornaliere (${rt.length})</span>
      <div class="space-y-2 mt-2">
        ${rt.map((t) => `<div class="card flex items-center gap-2">
            <span class="flex-1 font-bold">${esc(t.title)}</span>
            <button class="btn btn-danger btn-sm" data-act="del-routine" data-id="${t.id}">🗑</button>
          </div>`).join('') || '<p class="text-sm font-semibold">Nessuna.</p>'}
      </div>
    </div>
    <button class="btn btn-ghost btn-wide" data-act="retry">🔄 Ricarica i dati</button>`;
  $('#sheet').hidden = false;
  document.body.style.overflow = 'hidden';
}

/* ==========================================================================
   EVENTI (un solo gestore per tutti i tap)
   ========================================================================== */
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act],[data-view],[data-open],[data-mine],[data-nl],[data-sh],[data-me],[data-lb],[data-photo-pick],[data-photo-clear],[data-qd]');
  if (!el) return;

  // navigazione
  if (el.dataset.view) { view = el.dataset.view; window.scrollTo({ top: 0 }); render(); return; }

  // foto
  if (el.dataset.photoPick) { photoTarget = el.dataset.photoPick; $('#photo-input').click(); return; }
  if (el.dataset.photoClear) {
    const k = el.dataset.photoClear; photo[k] = null;
    $(`#${k}-photo-wrap`).hidden = true; return;
  }
  if (el.dataset.lb) {
    $('#lightbox img').src = el.dataset.lb; $('#lightbox').hidden = false; return;
  }

  // chip del form rapido
  if (el.dataset.nl) { draft[el.dataset.nl] = el.dataset.value; renderQuickChips(); return; }
  if (el.hasAttribute('data-qd')) { $('#nl-due').value = el.dataset.qd; renderQuickChips(); return; }

  // chip dello sheet
  if (el.dataset.sh) {
    const d = JSON.parse($('#sheet-body').dataset.d || '{}');
    d[el.dataset.sh] = el.dataset.value;
    $('#sheet-body').dataset.d = JSON.stringify(d);
    el.parentElement.querySelectorAll('[data-sh]').forEach((b) => b.setAttribute('aria-pressed', b === el));
    return;
  }
  if (el.dataset.me) { me = el.dataset.me; localStorage.setItem('fattoria_me', me); openSettings(); render(); return; }
  if (el.dataset.mine) { mine = el.dataset.mine; render(); return; }

  const id = el.dataset.id;
  switch (el.dataset.act) {
    case 'routine':      toggleRoutine(id); return;
    case 'spesa':        toggleSpesa(id); return;
    case 'del-spesa':    ev.stopPropagation(); removeTask(id); return;
    case 'svuota-spesa': svuotaSpesa(); return;
    case 'start':        ev.stopPropagation(); patch(id, { status: 'In corso' }, '▶ In corso'); return;
    case 'done':         ev.stopPropagation(); patch(id, { status: 'Completato', completed_at: new Date().toISOString() }, '✓ Completato'); return;
    case 'retry':        closeSheet(); loadFailed = false; reload(true); return;
    case 'sh-save':      saveSheet(); return;
    case 'sh-del':
      if (el.dataset.armed !== '1') { el.dataset.armed = '1'; el.textContent = '⚠️ Tocca di nuovo per eliminare'; return; }
      removeTask(sheetId); closeSheet(); return;
    case 'sh-photo-del': patch(sheetId, { photo_url: null }); photo.sheet = null; openSheet(sheetId); return;
    case 'del-routine':  removeTask(id).then(() => openSettings()); return;
  }

  if (el.dataset.open) openSheet(el.dataset.open);
});

document.addEventListener('submit', (ev) => {
  if (ev.target.id === 'form-lavoro')  return creaLavoro(ev);
  if (ev.target.id === 'form-nota')    return creaNota(ev);
  if (ev.target.id === 'form-spesa')   return creaSpesa(ev);
  if (ev.target.id === 'form-routine') return creaRoutine(ev);
});

function renderQuickChips() {
  chips('#nl-category', CATEGORIES, draft.category, 'data-nl', 'category', '');
  chips('#nl-time', TIMES, draft.estimated_time, 'data-nl', 'estimated_time');
  chips('#nl-who', WHO, draft.assigned_to, 'data-nl', 'assigned_to');
  chips('#nl-priority', PRIORITY, draft.priority, 'data-nl', 'priority');
  const cur = $('#nl-due').value;
  $('#nl-quickdate').innerHTML = [['Oggi', TODAY], ['Domani', plusDays(1)], ['Fra 3 gg', plusDays(3)], ['Nessuna', '']]
    .map(([lab, val]) => `<button type="button" class="chip flex-1" aria-pressed="${cur === val}" data-qd="${val}">${lab}</button>`).join('');
}

$('#nl-more').addEventListener('click', () => {
  const x = $('#nl-extra'); x.hidden = !x.hidden;
  $('#nl-more').textContent = x.hidden ? '＋ Altro (data, priorità, foto, note)' : '− Chiudi extra';
});
$('#nl-due').addEventListener('change', renderQuickChips);
$('#btn-settings').addEventListener('click', openSettings);
$('#btn-me').addEventListener('click', openSettings);
$('#sheet-close').addEventListener('click', closeSheet);
$('#sheet-bg').addEventListener('click', closeSheet);
$('#lb-close').addEventListener('click', () => { $('#lightbox').hidden = true; });
$('#lightbox').addEventListener('click', (e) => { if (e.target.id === 'lightbox') $('#lightbox').hidden = true; });
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!$('#lightbox').hidden) $('#lightbox').hidden = true;
  else if (!$('#sheet').hidden) closeSheet();
});

/* ==========================================================================
   REALTIME
   ========================================================================== */
function startRealtime() {
  channel = db.channel('tasks-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, (payload) => {
      if (payload.eventType === 'DELETE') {
        const id = payload.old && payload.old.id;
        if (id) tasks = tasks.filter((t) => t.id !== id);
      } else if (payload.new) {
        upsertLocal(payload.new);
      }
      if (loadFailed) { loadFailed = false; reload(false); return; }
      render();
    })
    .subscribe((st) => {
      if (st === 'SUBSCRIBED') setConn('● Live', '#DCF0D6', '#14401A');
      else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') setConn('● Offline', '#8C1D18', '#fff');
      else setConn('● …', '#ffffffcc');
    });
}

/* ==========================================================================
   CARICAMENTO
   ========================================================================== */
async function reload(showToast) {
  const mia = ++reloadSeq;
  try {
    const data = await store.load();
    if (mia !== reloadSeq) return;
    tasks = data; loadFailed = false;
    render();
    if (showToast) toast('Dati aggiornati');
  } catch (e) {
    if (mia !== reloadSeq) return;
    loadFailed = true;
    showLoadError(e);
    toast('Dati non caricati: ' + (e.message || e), true);
  }
}

// Le routine si azzerano a mezzanotte: se l'app resta aperta tutta la notte
// bisogna ricalcolare, altrimenti resterebbero spuntate anche il giorno dopo.
setInterval(() => { if (iso(new Date()) !== TODAY) location.reload(); }, 60000);

document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (iso(new Date()) !== TODAY) { location.reload(); return; }
  if (CONFIGURED) reload(false);
});
window.addEventListener('online',  () => { if (CONFIGURED) reload(false); });
window.addEventListener('offline', () => setConn('● Offline', '#8C1D18', '#fff'));

function installIcon() {
  let icon = '';
  try {
    const c = document.createElement('canvas'); c.width = c.height = 192;
    const x = c.getContext('2d');
    x.fillStyle = '#8FA583'; x.fillRect(0, 0, 192, 192);
    x.font = '118px system-ui, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText('🚜', 96, 104);
    icon = c.toDataURL('image/png');
  } catch (e) {}
  if (icon) {
    for (const rel of ['apple-touch-icon', 'icon']) {
      const l = document.createElement('link'); l.rel = rel; l.href = icon; document.head.appendChild(l);
    }
  }
  const man = { name: 'Fattoria Tasks', short_name: 'Fattoria', start_url: './', display: 'standalone',
                orientation: 'portrait', background_color: '#EFE7D6', theme_color: '#8FA583',
                icons: icon ? [{ src: icon, sizes: '192x192', type: 'image/png', purpose: 'any' }] : [] };
  const l = document.createElement('link');
  l.rel = 'manifest'; l.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(man));
  document.head.appendChild(l);
}

(async function init() {
  installIcon();
  renderQuickChips();
  $('#btn-me').textContent = me === 'Anna' ? 'A' : 'I';

  if (CONFIGURED && window.supabase) {
    db = window.supabase.createClient(SUPABASE_URL.trim().replace(/\/$/, ''), SUPABASE_ANON_KEY.trim());
    store = remoteStore;
    setConn('● …', '#ffffffcc');
    await reload(false);
    startRealtime();
  } else {
    store = localStore;
    setConn('● Locale', '#F6D98A');
    $('#local-banner').hidden = false;
    $('#local-banner').innerHTML = CONFIGURED
      ? 'Libreria Supabase non caricata (serve internet). Sto usando i dati salvati su questo dispositivo.'
      : '<b>Modalità locale.</b> Supabase non è configurato: i dati restano su questo dispositivo, le foto non vengono caricate online e non c\'è sincronizzazione.';
    await reload(false);
  }
})();
</script>

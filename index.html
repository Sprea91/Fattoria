<script>

/* ==========================================================================

const SUPABASE_ANON_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFpb3dpdGF3a3p5b2h5Y3N4a3hpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMjgwNjMsImV4cCI6MjEwMDkwNDA2M30.w2PA_VHPZc-2LQJHy__yK73XnxVwGDOwKyiYQN5klXE';
const CONTENITORE_FOTO   = 'farm-photos';
/* ========================================================================== */

const CONFIGURATO = /^https:\/\/[a-z0-9-]+\.supabase\.(co|in)\/?$/i.test(SUPABASE_URL.trim())
                    && SUPABASE_ANON_KEY.trim().length > 20
                    && !/^INCOLLA_QUI/.test(SUPABASE_ANON_KEY.trim());

const CATEGORIE = [{ v: 'Animali', e: '🐄' }, { v: 'Recinti', e: '🚧' }, { v: 'Macchine', e: '🚜' }, { v: 'Altro', e: '📌' }];
const PERSONE   = ['Io', 'Anna', 'Tutti'];

const SPECIE    = ['Bovino', 'Ovino', 'Caprino', 'Avicolo', 'Equino', 'Suino', 'Altro'];

const TIPI_EVENTO  = ['Vaccino', 'Sverminazione', 'Visita veterinaria', 'Integratore', 'Altro'];
const RUOLI     = ['Veterinario', 'Mangimista', 'Meccanico', 'Fabbro', 'Altro'];
const emojiCat  = (v) => (CATEGORIE.find((c) => c.v === v) || {}).e || '📌';
const MESI = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];

/* ---------- Stato ---------- */
let attivita   = [];
let animali    = [];
let interventi = [];
let contatti   = [];
let vista       = 'oggi';
let filtroMiei  = 'tutti';
let filtroReg   = 'Tutti';
let io          = localStorage.getItem('fattoria_io') || 'Io';
let caricoRotto = false;
let seqCarico   = 0;

let modo = null, idAperto = null, tipoAperto = 'Lavoro', animaleAperto = null;
let mod = {};                      // valori del modulo aperto
const fotoScelta = { dati: null };
let calA, calM, calSel;

const $  = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const pul = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Formattazione italiana scritta a mano: Intl dipende dalla lingua del
// dispositivo e su alcuni browser darebbe "€1,230.00" invece di "1.230,00 €".
const euro = (n) => {
  if (n === null || n === undefined || n === '') return null;
  const v = Number(n);
  if (!isFinite(v)) return null;
  const [interi, dec] = Math.abs(v).toFixed(2).split('.');
  return (v < 0 ? '-' : '') + interi.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + dec + ' €';
};

/* ==========================================================================
   DATE
   ========================================================================== */
const isoDi = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const OGGI = isoDi(new Date());
const fraGiorni = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return isoDi(d); };

function giorniDaOggi(g) {
  if (!g) return null;
  const [y, m, d] = g.split('-').map(Number);
  const a = new Date(y, m - 1, d), b = new Date(); b.setHours(0, 0, 0, 0);
  return Math.round((a - b) / 86400000);
}
function etichettaData(g) {
  const n = giorniDaOggi(g);
  if (n === null) return '';
  if (n === 0) return 'Oggi';
  if (n === 1) return 'Domani';
  if (n === -1) return 'Ieri';
  if (n < -1) return `${Math.abs(n)} gg in ritardo`;
  const [y, m, d] = g.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' });
}
function dataLunga(g) {
  const [y, m, d] = g.split('-').map(Number);
  const t = new Date(y, m - 1, d).toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
  const pre = g === OGGI ? 'Oggi · ' : g === fraGiorni(1) ? 'Domani · ' : g === fraGiorni(-1) ? 'Ieri · ' : '';
  return pre + t.charAt(0).toUpperCase() + t.slice(1);
}
function oraLunga(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const g = isoDi(d) === OGGI ? 'Oggi' : isoDi(d) === fraGiorni(-1) ? 'Ieri'
    : d.toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' });
  return `${g} · ${d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })}`;
}
function eta(nascita) {
  if (!nascita) return '';
  const [y, m, d] = nascita.split('-').map(Number);
  const n = new Date(y, m - 1, d), o = new Date();
  let anni = o.getFullYear() - n.getFullYear();
  let mesi = o.getMonth() - n.getMonth();
  if (o.getDate() < n.getDate()) mesi--;
  if (mesi < 0) { anni--; mesi += 12; }
  if (anni <= 0) return mesi <= 1 ? `${mesi} mese` : `${mesi} mesi`;
  return anni === 1 ? (mesi ? `1 anno e ${mesi} mesi` : '1 anno') : (mesi ? `${anni} anni e ${mesi} mesi` : `${anni} anni`);
}

/* ==========================================================================

   ========================================================================== */
let sb = null, canale = null;
const CHIAVE_LOCALE = 'fattoria_v4';
const TABELLE = { attivita: 'attivita', animali: 'animali', interventi: 'interventi_animali', contatti: 'contatti' };

const archivioLocale = {
  leggi() { try { return JSON.parse(localStorage.getItem(CHIAVE_LOCALE)) || null; } catch { return null; } },
  scrivi(d) { try { localStorage.setItem(CHIAVE_LOCALE, JSON.stringify(d)); } catch (e) { avvisa('Memoria del browser piena', true); } },
  async carica() {
    let d = this.leggi();
    if (!d) {
      d = {
        attivita: [['Cibo animali', 'Tutti', 'Animali'], ['Acqua animali', 'Tutti', 'Animali'],
                   ['Raccolta uova', 'Anna', 'Animali'], ['Controllo recinti', 'Io', 'Recinti']]
          .map((r, i) => ({ id: crypto.randomUUID(), tipo: 'Routine', titolo: r[0], assegnato_a: r[1],
            categoria: r[2], routine_giornaliera: true, priorita: 'Media',
            stato: 'Da fare', ordine: i + 1, creato_il: new Date().toISOString() })),
        animali: [], interventi: [], contatti: []
      };
      this.scrivi(d);
    }
    return { attivita: d.attivita || [], animali: d.animali || [], interventi: d.interventi || [], contatti: d.contatti || [] };
  },
  async inserisci(coll, riga) {
    const d = this.leggi() || { attivita: [], animali: [], interventi: [], contatti: [] };
    const r = { id: crypto.randomUUID(), creato_il: new Date().toISOString(), ...riga };
    (d[coll] = d[coll] || []).push(r); this.scrivi(d); return r;
  },
  async modifica(coll, id, cambi) {
    const d = this.leggi(); const i = (d[coll] || []).findIndex((x) => x.id === id);
    if (i < 0) throw new Error('Non trovato');
    d[coll][i] = { ...d[coll][i], ...cambi }; this.scrivi(d); return d[coll][i];
  },
  async elimina(coll, id) {
    const d = this.leggi();
    d[coll] = (d[coll] || []).filter((x) => x.id !== id);
    if (coll === 'animali') d.interventi = (d.interventi || []).filter((x) => x.animale_id !== id);
    this.scrivi(d);
  },
  async caricaFoto(blob, dataUrl) { return dataUrl; }
};

const archivioRemoto = {
  async carica() {
    const [a, an, iv, co] = await Promise.all([
      sb.from(TABELLE.attivita).select('*').order('ordine').order('creato_il', { ascending: false }),
      sb.from(TABELLE.animali).select('*').order('nome'),
      sb.from(TABELLE.interventi).select('*').order('data_evento', { ascending: false }),
      sb.from(TABELLE.contatti).select('*').order('nome')
    ]);
    for (const r of [a, an, iv, co]) if (r.error) throw r.error;
    return { attivita: a.data || [], animali: an.data || [], interventi: iv.data || [], contatti: co.data || [] };
  },
  async inserisci(coll, riga) {
    const { data, error } = await sb.from(TABELLE[coll]).insert(riga).select().single();
    if (error) throw error; return data;
  },
  async modifica(coll, id, cambi) {
    const { data, error } = await sb.from(TABELLE[coll]).update(cambi).eq('id', id).select().single();
    if (error) throw error; return data;
  },
  async elimina(coll, id) {
    const { error } = await sb.from(TABELLE[coll]).delete().eq('id', id);
    if (error) throw error;
  },
  async caricaFoto(blob) {
    const nome = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
    const { error } = await sb.storage.from(CONTENITORE_FOTO).upload(nome, blob, { contentType: 'image/jpeg', cacheControl: '31536000' });
    if (error) throw new Error('Foto non caricata: ' + error.message);
    return sb.storage.from(CONTENITORE_FOTO).getPublicUrl(nome).data.publicUrl;
  }
};

/* ==========================================================================
   FOTO — sempre dalla fotocamera o dalla galleria, mai un indirizzo da incollare
   ========================================================================== */
async function rimpicciolisci(file, max = 1280, q = 0.72) {
  const img = await (async () => {
    if (window.createImageBitmap) { try { return await createImageBitmap(file); } catch (e) {} }
    return await new Promise((ok, ko) => {
      const im = new Image(), fr = new FileReader();
      fr.onload = () => { im.onload = () => ok(im); im.onerror = ko; im.src = fr.result; };
      fr.onerror = ko; fr.readAsDataURL(file);
    });
  })();
  const w0 = img.width || img.naturalWidth, h0 = img.height || img.naturalHeight;
  const k = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement('canvas');
  c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', q));
  return { blob, dataUrl: c.toDataURL('image/jpeg', q) };
}

$('#scegli-foto').addEventListener('change', async (ev) => {
  const input = ev.target;
  const f = input.files && input.files[0];
  if (!f) { input.value = ''; return; }
  try {
    avvisa('Preparo la foto…');
    fotoScelta.dati = await rimpicciolisci(f);
    leggiCampi();                       // non perdere quello che è già stato scritto
    disegnaPannello();
    avvisa('Foto pronta (' + Math.round(fotoScelta.dati.blob.size / 1024) + ' KB)');
  } catch (e) { avvisa('Foto non leggibile: ' + (e.message || e), true); }
  finally { input.value = ''; }
});

function pastiglie(valori, attuale, campo, classe = 'flex-1') {
  return valori.map((v) => {
    const val = typeof v === 'object' ? v.v : v;
    const et  = typeof v === 'object' ? `${v.e} ${v.v}` : v;
    return `<button type="button" class="past ${classe}" aria-pressed="${attuale === val}"
              data-imposta="${campo}" data-valore="${pul(val)}">${pul(et)}</button>`;
  }).join('');
}
function etichetteDi(t) {
  const out = [];
  // Lo stato viene per primo: è la cosa che conta guardando l'elenco.
  if (t.stato === 'In corso')   out.push('<span class="etichetta et-corso">▶ In corso</span>');
  if (t.stato === 'Completato') out.push('<span class="etichetta et-fatto">✓ Fatto</span>');
  if (t.categoria) out.push(`<span class="etichetta">${emojiCat(t.categoria)} ${pul(t.categoria)}</span>`);
  out.push(`<span class="etichetta et-chi">👤 ${pul(t.assegnato_a)}</span>`);
  if (t.priorita === 'Alta' && t.stato !== 'Completato') out.push('<span class="etichetta et-alta">🔥 Alta</span>');
  if (t.scadenza && t.stato !== 'Completato') {
    const n = giorniDaOggi(t.scadenza);
    out.push(`<span class="etichetta ${n < 0 ? 'et-ritardo' : n === 0 ? 'et-oggi' : ''}">📅 ${pul(etichettaData(t.scadenza))}</span>`);
  }
  return out.join('');
}
const tagFoto = (url, classe = 'mt-2') => url

   SELEZIONI
   ========================================================================== */
const routineFatta = (t) => t.ultimo_completamento === OGGI;
const eMio = (t) => filtroMiei === 'tutti' || t.assegnato_a === io || t.assegnato_a === 'Tutti';
const perUrgenza = (a, b) => {
  const da = a.scadenza ? giorniDaOggi(a.scadenza) : 9e5;
  const db = b.scadenza ? giorniDaOggi(b.scadenza) : 9e5;
  if (da !== db) return da - db;
  const r = { Alta: 0, Media: 1, Bassa: 2 };
  const pa = r[a.priorita] ?? 1, pb = r[b.priorita] ?? 1;
  if (pa !== pb) return pa - pb;
  return String(b.creato_il).localeCompare(String(a.creato_il));
};
const leRoutine = () => attivita.filter((t) => t.tipo === 'Routine').sort((a, b) => (a.ordine || 0) - (b.ordine || 0));
const iLavori   = () => attivita.filter((t) => t.tipo === 'Lavoro');
const leNote    = () => attivita.filter((t) => t.tipo === 'Nota').sort((a, b) => String(b.creato_il).localeCompare(String(a.creato_il)));
const laSpesa   = () => attivita.filter((t) => t.tipo === 'Spesa');
const interventiDi = (idAn) => interventi.filter((x) => x.animale_id === idAn)
  .sort((a, b) => String(b.data_evento).localeCompare(String(a.data_evento)));
const spesaTotale = (an) => Number(an.costo_acquisto || 0)
  + interventiDi(an.id).reduce((s, x) => s + Number(x.costo || 0), 0);

function avvisiCorrenti() {
  const v = [];
  const ritardo = iLavori().filter((t) => t.stato !== 'Completato' && t.scadenza && giorniDaOggi(t.scadenza) < 0);
  const oggiSc  = iLavori().filter((t) => t.stato !== 'Completato' && t.scadenza === OGGI);
  const domani  = iLavori().filter((t) => t.stato !== 'Completato' && t.scadenza === fraGiorni(1));
  const inCorso = iLavori().filter((t) => t.stato === 'In corso');
  const rtMancanti = leRoutine().filter((t) => !routineFatta(t));
  const daComprare = laSpesa().filter((t) => t.stato !== 'Completato');

  if (ritardo.length) v.push({ ico: '⛔', testo: `${ritardo.length} ${ritardo.length === 1 ? 'lavoro in ritardo' : 'lavori in ritardo'}`,
    dettaglio: ritardo.slice(0, 3).map((t) => t.titolo).join(' · '), vista: 'lavori', forte: true });
  if (oggiSc.length) v.push({ ico: '📅', testo: `${oggiSc.length} in scadenza oggi`,
    dettaglio: oggiSc.slice(0, 3).map((t) => t.titolo).join(' · '), vista: 'oggi' });
  if (inCorso.length) v.push({ ico: '🔄', testo: `${inCorso.length} ${inCorso.length === 1 ? 'lavoro iniziato' : 'lavori iniziati'} e non finiti`,
    dettaglio: inCorso.slice(0, 3).map((t) => t.titolo).join(' · '), vista: 'lavori' });
  if (rtMancanti.length) v.push({ ico: '☀️', testo: `${rtMancanti.length} routine da fare oggi`,
    dettaglio: rtMancanti.slice(0, 4).map((t) => t.titolo).join(' · '), vista: 'oggi' });
  if (daComprare.length) v.push({ ico: '🛒', testo: `${daComprare.length} ${daComprare.length === 1 ? 'articolo da comprare' : 'articoli da comprare'}`,
    dettaglio: daComprare.slice(0, 4).map((t) => t.titolo).join(' · '), vista: 'spesa' });
  if (domani.length) v.push({ ico: '🌅', testo: `${domani.length} in scadenza domani`,
    dettaglio: domani.slice(0, 3).map((t) => t.titolo).join(' · '), vista: 'oggi' });
  return v;
}

/* ==========================================================================
   SCHEDE ATTIVITÀ
   ========================================================================== */
function schedaLavoro(t, azioni = true) {
  const ritardo = t.stato !== 'Completato' && t.scadenza && giorniDaOggi(t.scadenza) < 0;
  const fatto = t.stato === 'Completato';
  return `
    <article class="scheda tocca ${ritardo ? 'scheda-urgente' : ''} ${fatto ? 'scheda-fatta' : ''}" data-apri="${t.id}" role="button" tabindex="0">
      <div class="flex items-start gap-2">
        <h3 class="flex-1 font-black text-base leading-tight ${fatto ? 'line-through opacity-60' : ''}">${pul(t.titolo)}</h3>
        ${azioni && !fatto ? `<button class="bot bot-verde bot-piccolo shrink-0" data-azione="${t.stato === 'Da fare' ? 'inizia' : 'finisci'}" data-id="${t.id}">
             ${t.stato === 'Da fare' ? '▶ Inizia' : '✓ Fatto'}</button>`
          : '<span class="text-xl shrink-0" style="color:var(--inchiostro2)">›</span>'}
      </div>
      <div class="flex flex-wrap gap-1.5 mt-2">${etichetteDi(t)}</div>
      ${t.note ? `<p class="mt-2 text-sm font-semibold" style="color:var(--inchiostro2)">${pul(t.note)}</p>` : ''}
      ${tagFoto(t.foto_url)}
    </article>`;
}

function rigaRoutine(t) {
  return `
    <div class="riga ${routineFatta(t) ? 'riga-ok' : ''}">
      <button type="button" class="cerchio" data-azione="routine" data-id="${t.id}"
              aria-label="${routineFatta(t) ? 'Annulla' : 'Segna come fatto'}">✓</button>
      <button type="button" class="riga-apri" data-apri="${t.id}">
        <span class="riga-tit">${pul(t.titolo)}</span>
        <span class="mt-1 flex flex-wrap gap-1.5">
          <span class="etichetta et-chi">👤 ${pul(t.assegnato_a)}</span>
        </span>
      </button>
      <span class="text-xl shrink-0" style="color:var(--inchiostro2)">›</span>
    </div>`;
}

/* ==========================================================================
   CALENDARIO (widget compatto, in cima alla Home)
   ========================================================================== */
function delGiorno(g) {
  const aperte = iLavori().filter((t) => t.scadenza === g && t.stato !== 'Completato').sort(perUrgenza);
  const fatte  = iLavori().filter((t) => t.stato === 'Completato'
    && (t.scadenza === g || String(t.completato_il || '').slice(0, 10) === g));
  const rt     = leRoutine().filter((t) => t.ultimo_completamento === g);
  return { aperte, fatte, rt };
}

function widgetCalendario() {
  const primo = new Date(calA, calM, 1);
  const quanti = new Date(calA, calM + 1, 0).getDate();
  const salto = (primo.getDay() + 6) % 7;              // la settimana inizia lunedì

  let celle = '';
  for (let i = 0; i < salto; i++) celle += '<div class="cal-cel cal-vuota"></div>';
  for (let d = 1; d <= quanti; d++) {
    const g = `${calA}-${String(calM + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const { aperte, fatte, rt } = delGiorno(g);
    const ritardo = aperte.some((t) => giorniDaOggi(t.scadenza) < 0);
    const corso   = aperte.some((t) => t.stato === 'In corso');
    let p = '';
    if (ritardo) p += '<span class="punto p-ritardo"></span>';
    if (corso)   p += '<span class="punto p-incorso"></span>';
    if (aperte.length && !ritardo) p += '<span class="punto p-dafare"></span>';
    if (fatte.length + rt.length) p += '<span class="punto p-fatto"></span>';
    celle += `<button type="button" class="cal-cel ${g === OGGI ? 'cal-oggi' : ''} ${g === calSel ? 'cal-sel' : ''}" data-giorno="${g}">
        <span>${d}</span><span class="punti">${p}</span></button>`;
  }

  const ritardi = iLavori().filter((t) => t.stato !== 'Completato' && t.scadenza && giorniDaOggi(t.scadenza) < 0).length;
  const oggiSc  = iLavori().filter((t) => t.stato !== 'Completato' && t.scadenza === OGGI).length;

  return `<div class="scheda scheda-fitta">
      <div class="flex items-center gap-1">
        <button class="bot bot-chiaro bot-piccolo px-3" data-azione="mese-prec" aria-label="Mese precedente">‹</button>
        <h2 class="flex-1 text-center font-black text-sm truncate">${MESI[calM]} ${calA}</h2>
        <button class="bot bot-chiaro bot-piccolo px-3" data-azione="mese-succ" aria-label="Mese successivo">›</button>
      </div>
      <div class="cal mt-2">
        ${['L', 'M', 'M', 'G', 'V', 'S', 'D'].map((d) => `<div class="cal-gg">${d}</div>`).join('')}
        ${celle}
      </div>
      <div class="flex items-center gap-2 mt-2 flex-wrap">
        ${ritardi ? `<span class="etichetta et-ritardo">⛔ ${ritardi} in ritardo</span>` : ''}
        ${oggiSc ? `<span class="etichetta et-oggi">📅 ${oggiSc} oggi</span>` : ''}
        ${!ritardi && !oggiSc ? '<span class="etichetta">nessuna scadenza urgente</span>' : ''}
        <button class="bot bot-chiaro bot-piccolo ml-auto" data-azione="cal-oggi">Oggi</button>
        <button class="bot bot-chiaro bot-piccolo" data-vista="storico">📋 Storico</button>
      </div>
    </div>`;
}

/* ==========================================================================
   HOME: scadenze -> attività del giorno scelto -> routine
   ========================================================================== */
function disegnaOggi() {
  const rt = leRoutine();
  const fatte = rt.filter(routineFatta).length;

  // 1) scadenze: in ritardo e di oggi
  const scadute = iLavori().filter((t) => t.stato !== 'Completato' && t.scadenza && giorniDaOggi(t.scadenza) <= 0).sort(perUrgenza);
  // 2) prossimi 7 giorni: da domani in poi
  const settimana = iLavori().filter((t) => {
    if (t.stato === 'Completato' || !t.scadenza) return false;
    const n = giorniDaOggi(t.scadenza);
    return n >= 1 && n <= 7;
  }).sort(perUrgenza);
  // lavori iniziati che non compaiono in nessuna delle due liste sopra
  // (senza scadenza, o con scadenza oltre i 7 giorni): altrimenti si perderebbero
  const corsoAltrove = iLavori().filter((t) => t.stato === 'In corso'
    && !scadute.includes(t) && !settimana.includes(t)).sort(perUrgenza);

  let h = '';

  h += `<section><h2 class="titolo-sez">⚠️ Scadenze <span class="conta">${scadute.length}</span></h2>
      <div class="space-y-3">${scadute.length ? scadute.map((t) => schedaLavoro(t)).join('')
        : '<div class="scheda text-center py-6"><div class="text-3xl">👍</div><p class="mt-1 font-black">Nessuna scadenza da recuperare</p></div>'}</div></section>`;

  if (corsoAltrove.length) h += `<section><h2 class="titolo-sez">🔄 Iniziati <span class="conta">${corsoAltrove.length}</span></h2>
      <div class="space-y-3">${corsoAltrove.map((t) => schedaLavoro(t)).join('')}</div></section>`;

  h += `<section><h2 class="titolo-sez">🗓️ Prossimi 7 giorni <span class="conta">${settimana.length}</span></h2>
      <div class="space-y-3">${settimana.length ? settimana.map((t) => schedaLavoro(t)).join('')
        : '<div class="scheda text-center py-6"><p class="font-black">Niente in programma questa settimana</p></div>'}</div></section>`;

  h += `<section>
      <h2 class="titolo-sez">☀️ Routine di oggi <span class="conta">${fatte}/${rt.length}</span></h2>
      <div class="space-y-2.5">${rt.length ? rt.map(rigaRoutine).join('')
        : '<p class="scheda text-center font-bold py-6">Nessuna routine. Aggiungila da ⚙️</p>'}</div>
      <p class="text-xs font-semibold mt-2 px-1" style="color:var(--inchiostro2)">Cerchietto = fatto · tocca il nome per modificarla</p>
    </section>`;

  // 4) calendario in fondo, con l'elenco del giorno scelto subito sotto
  h += `<section><h2 class="titolo-sez">📅 Calendario</h2>${widgetCalendario()}</section>`;

  if (calSel !== OGGI) {
    const { aperte, fatte: f2 } = delGiorno(calSel);
    h += `<section><h2 class="titolo-sez">${pul(dataLunga(calSel))} <span class="conta">${aperte.length}</span></h2>
        <div class="space-y-3">${aperte.length ? aperte.map((t) => schedaLavoro(t)).join('')
          : '<div class="scheda text-center py-6"><p class="font-black">Niente in programma</p></div>'}
        ${f2.length ? f2.map((t) => schedaLavoro(t, false)).join('') : ''}</div>
        <button class="bot bot-chiaro w-full mt-3" data-azione="nuovo-nel-giorno">＋ Aggiungi in questo giorno</button></section>`;
  }

  $('#corpo-oggi').innerHTML = h;
}

        <p class="mt-1 text-sm font-semibold" style="color:var(--inchiostro2)">
          Col pulsante ＋ crei la carta d'identità: foto, razza, data di nascita, codice stalla e storico sanitario.</p></div>`;
  } else {

   ========================================================================== */
function disegnaStorico() {
  const fatti = attivita
    .filter((t) => (t.tipo === 'Lavoro' && t.stato === 'Completato') || (t.tipo === 'Routine' && t.ultimo_completamento))
    .map((t) => ({ t, quando: t.tipo === 'Routine' ? (t.completato_il || t.ultimo_completamento + 'T12:00:00') : (t.completato_il || t.creato_il) }))
    .sort((a, b) => String(b.quando).localeCompare(String(a.quando)));

  let h = '<button class="bot bot-chiaro w-full" data-vista="oggi">‹ Torna alla Home</button>';
  if (!fatti.length) h += '<p class="scheda text-center font-bold py-10">Ancora nessun lavoro completato.</p>';
  else {
    const gr = {};
    fatti.forEach((x) => { const g = String(x.quando).slice(0, 10); (gr[g] = gr[g] || []).push(x); });
    h += Object.keys(gr).sort().reverse().map((g) => `
      <section><h2 class="titolo-sez">📅 ${pul(etichettaData(g) || g)} <span class="conta">${gr[g].length}</span></h2>
        <div class="space-y-3">${gr[g].map(({ t, quando }) => `
          <article class="scheda scheda-fatta ${t.tipo === 'Lavoro' ? 'tocca' : ''}" ${t.tipo === 'Lavoro' ? `data-apri="${t.id}" role="button" tabindex="0"` : ''}>
            <div class="flex items-start gap-2">
              <h3 class="flex-1 font-bold leading-tight">${pul(t.titolo)}</h3>
              <span class="etichetta shrink-0">${pul(oraLunga(quando))}</span>
            </div>
            <div class="flex flex-wrap gap-1.5 mt-2">
              ${t.tipo === 'Routine' ? '<span class="etichetta">🔁 Routine</span>' : ''}${etichetteDi(t)}
            </div>
            ${t.note ? `<p class="mt-2 text-sm font-semibold" style="color:var(--inchiostro2)">${pul(t.note)}</p>` : ''}
            ${tagFoto(t.foto_url)}
          </article>`).join('')}</div></section>`).join('');
  }
  $('#corpo-storico').innerHTML = h;
}

/* ==========================================================================
   DISEGNO GENERALE
   ========================================================================== */
const VISTE = ['oggi', 'animali', 'lavori', 'registro', 'spesa', 'storico'];
const ETICHETTA_BOT = { oggi: 'Attività', animali: 'Animale', lavori: 'Attività', registro: 'Nota', spesa: 'Spesa', storico: 'Attività' };

function disegna() {
  if (caricoRotto) return;
  VISTE.forEach((v) => { $('#vista-' + v).hidden = (v !== vista); });
  $$('#barra .voce').forEach((b) => {
    if (b.dataset.vista === vista) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  $('#bot-io').textContent = io === 'Anna' ? 'A' : 'I';
  $('#etichetta-aggiungi').textContent = ETICHETTA_BOT[vista] || 'Attività';
  aggiornaPallino();

  if (vista === 'oggi')     disegnaOggi();
  if (vista === 'animali')  disegnaAnimali();
  if (vista === 'lavori')   disegnaLavori();
  if (vista === 'registro') disegnaRegistro();
  if (vista === 'spesa')    disegnaSpesa();
  if (vista === 'storico')  disegnaStorico();
}

function mostraErrore(e) {
  const senzaRete = !navigator.onLine;
  const m = (e && e.message) || String(e);
  const vecchiNomi = /attivita|does not exist|schema cache/i.test(m);
  $('#corpo-oggi').innerHTML = `
    <div class="scheda scheda-urgente text-center">
      <div class="text-5xl">${senzaRete ? '📵' : '⚠️'}</div>
      <p class="mt-2 font-black text-lg" style="color:var(--allarme)">${senzaRete ? 'Nessuna connessione' : 'Dati non caricati'}</p>
      <p class="mt-1 text-sm font-bold">${senzaRete
        ? 'I dati sono al sicuro nel database e ricompariranno appena torni in linea.'
        : vecchiNomi ? 'Sembra che il database non abbia ancora la struttura nuova: esegui <b>schema-v4.sql</b> nell\'SQL Editor di Supabase.'
                     : 'Non riesco a leggere i dati dal database.'}</p>
      <p class="mt-2 text-xs font-mono break-words" style="color:var(--allarme)">${pul(m)}</p>
      <button class="bot bot-verde bot-largo mt-3" data-azione="riprova">🔄 Riprova</button>
    </div>`;
  VISTE.forEach((v) => { $('#vista-' + v).hidden = (v !== 'oggi'); });
}

/* ==========================================================================
   OPERAZIONI
   ========================================================================== */
function metti(coll, riga) {
  const arr = elenco[coll]();
  const i = arr.findIndex((x) => x.id === riga.id);
  if (i < 0) arr.push(riga); else arr[i] = { ...arr[i], ...riga };
}

async function cambia(coll, id, cambi, messaggio) {
  const arr = elenco[coll]();
  const i = arr.findIndex((x) => x.id === id);
  if (i < 0) return;
  const prima = arr[i];
  arr[i] = { ...prima, ...cambi };
  disegna();
  try {
    await archivio.modifica(coll, id, cambi);
    if (navigator.vibrate) navigator.vibrate(14);
    if (messaggio) avvisa(messaggio);
  } catch (e) { arr[i] = prima; disegna(); avvisa('Non salvato: ' + (e.message || e), true); }
}

const spuntaRoutine = (id) => {
  const t = attivita.find((x) => x.id === id); if (!t) return;
  const su = routineFatta(t);
  cambia('attivita', id, su ? { ultimo_completamento: null, completato_il: null }
                            : { ultimo_completamento: OGGI, completato_il: new Date().toISOString() },
         su ? 'Rimesso da fare' : '✓ Fatto');
};
const spuntaSpesa = (id) => {
  const t = attivita.find((x) => x.id === id); if (!t) return;
  const fatto = t.stato === 'Completato';
  cambia('attivita', id, fatto ? { stato: 'Da fare', completato_il: null }
                               : { stato: 'Completato', completato_il: new Date().toISOString() },
         fatto ? 'Rimesso in lista' : '✓ Comprato');
};
async function svuotaComprati() {
  for (const t of laSpesa().filter((x) => x.stato === 'Completato')) {
    try { await archivio.elimina('attivita', t.id); attivita = attivita.filter((x) => x.id !== t.id); }
    catch (e) { avvisa('Errore: ' + e.message, true); }
  }
  disegna(); avvisa('Lista ripulita');
}
async function elimina(coll, id) {
  try {
    await archivio.elimina(coll, id);
    if (coll === 'attivita') attivita = attivita.filter((x) => x.id !== id);
    if (coll === 'animali') { animali = animali.filter((x) => x.id !== id); interventi = interventi.filter((x) => x.animale_id !== id); }
    if (coll === 'interventi') interventi = interventi.filter((x) => x.id !== id);
    if (coll === 'contatti') contatti = contatti.filter((x) => x.id !== id);
    disegna(); avvisa('Eliminato');
  } catch (e) { avvisa('Non eliminato: ' + (e.message || e), true); }
}

   MODULI (un solo pannello per creare e modificare tutto)

function apriNuovo(tipo, scadenza) {
  modo = 'nuovo'; idAperto = null; tipoAperto = tipo; fotoScelta.dati = null;
  mod = { titolo: '', categoria: 'Animali',
          assegnato_a: io, priorita: 'Media', stato: 'Da fare', scadenza: scadenza || '', note: '',
          specie: 'Bovino', razza: '', data_nascita: '', codice_stalla: '', costo_acquisto: '',
          tipo_evento: 'Visita veterinaria', data_evento: OGGI, descrizione: '', nome_veterinario: '', costo: '',
          ruolo: 'Veterinario', telefono: '', extra: false };
  disegnaPannello(); apriPannello();
}

function apriModifica(id) {
  const t = attivita.find((x) => x.id === id); if (!t) return;
  modo = 'modifica'; idAperto = id; tipoAperto = t.tipo || 'Lavoro'; fotoScelta.dati = null;
  mod = { titolo: t.titolo || '', categoria: t.categoria || 'Altro',
          assegnato_a: t.assegnato_a || 'Io', priorita: t.priorita || 'Media', stato: t.stato || 'Da fare',
          scadenza: t.scadenza || '', note: t.note || '', foto_url: t.foto_url || null, extra: true };
  disegnaPannello(); apriPannello();
}

function apriModificaAnimale(id) {
  const a = animali.find((x) => x.id === id); if (!a) return;
  modo = 'animale-modifica'; idAperto = id; tipoAperto = 'Animale'; fotoScelta.dati = null;
  mod = { titolo: a.nome || '', specie: a.specie || 'Bovino', razza: a.razza || '',
          data_nascita: a.data_nascita || '', codice_stalla: a.codice_stalla || '',
          costo_acquisto: a.costo_acquisto ?? '', note: a.note || '', foto_url: a.foto_url || null };
  disegnaPannello(); apriPannello();
}

function apriIntervento(id) {
  const x = interventi.find((y) => y.id === id); if (!x) return;
  modo = 'intervento-modifica'; idAperto = id; tipoAperto = 'Intervento';
  animaleAperto = x.animale_id; fotoScelta.dati = null;
  mod = { tipo_evento: x.tipo_evento || 'Altro', data_evento: x.data_evento || OGGI,
          descrizione: x.descrizione || '', nome_veterinario: x.nome_veterinario || '',
          costo: x.costo ?? '', foto_url: x.foto_ricevuta_url || null };
  disegnaPannello(); apriPannello();
}

function apriPannello() { $('#pannello').hidden = false; document.body.style.overflow = 'hidden'; }
function chiudiPannello() {
  $('#pannello').hidden = true; document.body.style.overflow = '';
  modo = null; idAperto = null; fotoScelta.dati = null;
}

function leggiCampi() {
  const g = (id) => { const e = $(id); return e ? e.value : undefined; };
  const v = {
    titolo: g('#m-titolo'), note: g('#m-note'), scadenza: g('#m-scadenza'),
    razza: g('#m-razza'), data_nascita: g('#m-nascita'), codice_stalla: g('#m-codice'),
    costo_acquisto: g('#m-costo-acquisto'), descrizione: g('#m-descrizione'),
    nome_veterinario: g('#m-veterinario'), costo: g('#m-costo'), data_evento: g('#m-data-evento'),
    telefono: g('#m-telefono')
  };
  Object.keys(v).forEach((k) => { if (v[k] !== undefined) mod[k] = v[k]; });
}

function disegnaPannello() {
  if (modo === 'impostazioni') return disegnaImpostazioni();
  if (modo === 'contatti')     return apriContatti();
  const nuovo = modo === 'nuovo';
  const k = tipoAperto;
  const foto = fotoScelta.dati ? fotoScelta.dati.dataUrl : mod.foto_url;

      <div><label class="didascalia" for="m-costo-acquisto">Costo d'acquisto (€)</label>

      <div><label class="didascalia" for="m-note">Note</label>

async function salva() {
  leggiCampi();
  const k = tipoAperto;
  const nuovo = modo === 'nuovo';
  const bot = $('[data-azione="salva"]');
  const titolo = String(mod.titolo || '').trim();

  if (k !== 'Intervento' && !titolo) { avvisa('Scrivi prima il nome', true); const e = $('#m-titolo'); if (e) e.focus(); return; }
  if (bot) { bot.disabled = true; bot.textContent = 'Salvo…'; }

  try {
    let urlFoto = null;
    if (fotoScelta.dati) urlFoto = await archivio.caricaFoto(fotoScelta.dati.blob, fotoScelta.dati.dataUrl);

    if (k === 'Animale') {
      const riga = { nome: titolo, specie: mod.specie, razza: mod.razza || null,
        data_nascita: mod.data_nascita || null, codice_stalla: mod.codice_stalla || null,
        costo_acquisto: mod.costo_acquisto === '' ? null : Number(mod.costo_acquisto),
        note: (mod.note || '').trim() || null };
      if (urlFoto) riga.foto_url = urlFoto;
      metti('animali', nuovo ? await archivio.inserisci('animali', riga) : await archivio.modifica('animali', idAperto, riga));
      chiudiPannello(); disegna(); avvisa(nuovo ? 'Animale aggiunto' : 'Modifiche salvate');
      return;
    }

    if (k === 'Intervento') {
      const riga = { animale_id: animaleAperto, tipo_evento: mod.tipo_evento,
        data_evento: mod.data_evento || OGGI, descrizione: (mod.descrizione || '').trim() || null,
        nome_veterinario: (mod.nome_veterinario || '').trim() || null,
        costo: mod.costo === '' ? null : Number(mod.costo) };
      if (urlFoto) riga.foto_ricevuta_url = urlFoto;
      metti('interventi', nuovo ? await archivio.inserisci('interventi', riga) : await archivio.modifica('interventi', idAperto, riga));
      disegna(); avvisa(nuovo ? 'Intervento aggiunto' : 'Modifiche salvate');
      apriAnimale(animaleAperto);            // torno alla carta d'identità aggiornata
      return;
    }

    if (k === 'Contatto') {
      const riga = { nome: titolo, ruolo: mod.ruolo, telefono: (mod.telefono || '').trim() || null,
        note: (mod.note || '').trim() || null };
      metti('contatti', await archivio.inserisci('contatti', riga));
      disegna(); avvisa('Contatto aggiunto'); apriContatti();
      return;
    }

    // attività / routine / nota / spesa
    const riga = { titolo, note: (mod.note || '').trim() || null };
    if (k === 'Lavoro' || k === 'Routine' || k === 'Nota') riga.categoria = mod.categoria;
    if (k === 'Lavoro' || k === 'Routine') riga.assegnato_a = mod.assegnato_a;
    if (k === 'Lavoro') {
      riga.priorita = mod.priorita;
      riga.scadenza = mod.scadenza || null;
      riga.stato = mod.stato;
      riga.completato_il = mod.stato === 'Completato' ? new Date().toISOString() : null;
    }
    if (k === 'Nota')  riga.assegnato_a = io;
    if (k === 'Spesa') riga.assegnato_a = 'Tutti';
    if (urlFoto) riga.foto_url = urlFoto;

    if (nuovo) {
      riga.tipo = k;
      riga.stato = riga.stato || 'Da fare';
      if (k === 'Routine') { riga.routine_giornaliera = true; riga.ordine = leRoutine().length + 1; }
      metti('attivita', await archivio.inserisci('attivita', riga));
      if (k === 'Spesa') {                       // resto nel modulo per aggiungerne altri
        mod.titolo = ''; disegnaPannello(); disegna();
        const e = $('#m-titolo'); if (e) e.focus();
        avvisa('Aggiunto alla lista'); return;
      }
      chiudiPannello(); disegna(); avvisa(k === 'Nota' ? 'Nota salvata' : 'Aggiunto');
    } else {
      metti('attivita', await archivio.modifica('attivita', idAperto, riga));
      chiudiPannello(); disegna(); avvisa('Modifiche salvate');
    }
  } catch (e) {
    avvisa('Non salvato: ' + (e.message || e), true);
    if (bot) { bot.disabled = false; disegnaPannello(); }
  }
}

function googleCalendar(id) {
  const t = attivita.find((x) => x.id === id);
  if (!t || !t.scadenza) { avvisa('Serve una scadenza', true); return; }
  const g = t.scadenza.replace(/-/g, '');
  const dopo = new Date(t.scadenza); dopo.setDate(dopo.getDate() + 1);
  const g2 = isoDi(dopo).replace(/-/g, '');
  const dett = [t.note, t.categoria ? 'Categoria: ' + t.categoria : '', 'Chi: ' + t.assegnato_a,
                'Stato: ' + t.stato].filter(Boolean).join('\n');
  const url = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent('🚜 ' + t.titolo)
    + '&dates=' + g + '/' + g2
    + '&details=' + encodeURIComponent(dett);
  window.open(url, '_blank', 'noopener');
}

function scarica(nomeFile, contenuto, tipo) {
  const b = new Blob([contenuto], { type: tipo });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = nomeFile;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function inCsv(righe) {
  if (!righe.length) return '';
  const col = Object.keys(righe[0]);
  const cella = (v) => {
    const s = v === null || v === undefined ? '' : String(v);
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return [col.join(';')].concat(righe.map((r) => col.map((c) => cella(r[c])).join(';'))).join('\r\n');
}
function backupJson() {
  const d = { esportato_il: new Date().toISOString(), attivita, animali, interventi, contatti };
  scarica(`fattoria-backup-${OGGI}.json`, JSON.stringify(d, null, 2), 'application/json');
  avvisa('Backup JSON scaricato');
}
function backupCsv() {
  const parti = [['ATTIVITA', attivita], ['ANIMALI', animali], ['INTERVENTI', interventi], ['CONTATTI', contatti]]
    .filter(([, r]) => r.length)
    .map(([n, r]) => n + '\r\n' + inCsv(r)).join('\r\n\r\n');
  scarica(`fattoria-backup-${OGGI}.csv`, '﻿' + parti, 'text/csv;charset=utf-8');
  avvisa('Backup CSV scaricato');
}

/* ==========================================================================
   EVENTI
   ========================================================================== */
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-azione],[data-vista],[data-apri],[data-miei],[data-imposta],[data-io],[data-lente],[data-giorno],[data-animale],[data-intervento],[data-filtro-reg]');
  if (!el) return;

  if (el.dataset.vista) {
    if (!$('#pannello').hidden) chiudiPannello();
    vista = el.dataset.vista; window.scrollTo({ top: 0 }); disegna(); return;
  }
  if (el.dataset.giorno)  { calSel = el.dataset.giorno; disegna(); return; }
  if (el.dataset.lente)   { $('#lente img').src = el.dataset.lente; $('#lente').hidden = false; return; }
  if (el.dataset.miei)    { filtroMiei = el.dataset.miei; disegna(); return; }
  if (el.dataset.filtroReg) { filtroReg = el.dataset.filtroReg; disegna(); return; }
  if (el.dataset.io)      { io = el.dataset.io; localStorage.setItem('fattoria_io', io); disegnaImpostazioni(); disegna(); return; }
  if (el.dataset.animale) { apriAnimale(el.dataset.animale); return; }
  if (el.dataset.intervento) { apriIntervento(el.dataset.intervento); return; }
  if (el.dataset.imposta) { leggiCampi(); mod[el.dataset.imposta] = el.dataset.valore; disegnaPannello(); return; }

  const id = el.dataset.id;
  switch (el.dataset.azione) {
    case 'routine':  spuntaRoutine(id); return;
    case 'spesa':    spuntaSpesa(id); return;
    case 'inizia':   ev.stopPropagation(); cambia('attivita', id, { stato: 'In corso' }, '▶ In corso'); return;
    case 'finisci':  ev.stopPropagation(); cambia('attivita', id, { stato: 'Completato', completato_il: new Date().toISOString() }, '✓ Completato'); return;
    case 'elimina':  ev.stopPropagation(); elimina('attivita', id).then(() => { if (modo === 'impostazioni') disegnaImpostazioni(); }); return;
    case 'elimina-contatto': elimina('contatti', id).then(() => apriContatti()); return;
    case 'svuota-comprati': svuotaComprati(); return;
    case 'riprova':  chiudiPannello(); caricoRotto = false; ricarica(true); return;
    case 'mese-prec': calM--; if (calM < 0) { calM = 11; calA--; } disegna(); return;
    case 'mese-succ': calM++; if (calM > 11) { calM = 0; calA++; } disegna(); return;
    case 'cal-oggi': { const d = new Date(); calA = d.getFullYear(); calM = d.getMonth(); calSel = OGGI; disegna(); return; }
    case 'nuovo-nel-giorno': apriNuovo('Lavoro', calSel); return;
    case 'nuova-routine':    apriNuovo('Routine'); return;
    case 'nuovo-contatto':   apriNuovo('Contatto'); return;
    case 'nuovo-intervento': apriNuovo('Intervento'); return;
    case 'modifica-animale': apriModificaAnimale(animaleAperto); return;
    case 'elimina-animale':
      if (el.dataset.armato !== '1') { el.dataset.armato = '1'; el.textContent = '⚠️ Tocca di nuovo: elimina anche gli interventi'; return; }
      { const x = animaleAperto; chiudiPannello(); elimina('animali', x); } return;
    case 'apri-contatti': apriContatti(); return;
    case 'extra':    leggiCampi(); mod.extra = true; disegnaPannello(); return;
    case 'prendi-foto': $('#scegli-foto').click(); return;
    case 'togli-foto':  leggiCampi(); fotoScelta.dati = null; mod.foto_url = null; disegnaPannello(); return;
    case 'salva':    salva(); return;
    case 'google-calendar': googleCalendar(idAperto); return;
    case 'backup-json': backupJson(); return;
    case 'backup-csv':  backupCsv(); return;
    case 'elimina-nel-pannello':
      if (el.dataset.armato !== '1') { el.dataset.armato = '1'; el.textContent = '⚠️ Tocca di nuovo per eliminare'; return; }
      {
        const x = idAperto, k = tipoAperto, an = animaleAperto;
        if (k === 'Animale') { chiudiPannello(); elimina('animali', x); }
        else if (k === 'Intervento') { elimina('interventi', x).then(() => apriAnimale(an)); }
        else { chiudiPannello(); elimina('attivita', x); }
      } return;
  }

  if (el.dataset.apri) apriModifica(el.dataset.apri);
});

$('#aggiungi').addEventListener('click', () => {
  if (vista === 'animali')  apriNuovo('Animale');
  else if (vista === 'registro') apriNuovo('Nota');
  else if (vista === 'spesa')    apriNuovo('Spesa');
  else apriNuovo('Lavoro', vista === 'oggi' && calSel !== OGGI ? calSel : '');
});
$('#bot-avvisi').addEventListener('click', apriAvvisi);
$('#bot-impostazioni').addEventListener('click', apriImpostazioni);
$('#bot-io').addEventListener('click', apriImpostazioni);
$('#pannello-chiudi').addEventListener('click', chiudiPannello);
$('#pannello-sfondo').addEventListener('click', chiudiPannello);
$('#lente-chiudi').addEventListener('click', () => { $('#lente').hidden = true; });
$('#lente').addEventListener('click', (e) => { if (e.target.id === 'lente') $('#lente').hidden = true; });
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!$('#lente').hidden) $('#lente').hidden = true;
  else if (!$('#pannello').hidden) chiudiPannello();
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'm-scadenza') { mod.scadenza = e.target.value; disegnaPannello(); }
});

/* ==========================================================================
   SINCRONIZZAZIONE ISTANTANEA
   ========================================================================== */
const COLL_DI_TABELLA = { attivita: 'attivita', animali: 'animali', interventi_animali: 'interventi', contatti: 'contatti' };

function avviaSincronia() {
  canale = sb.channel('fattoria-live');
  Object.keys(COLL_DI_TABELLA).forEach((tab) => {
    canale.on('postgres_changes', { event: '*', schema: 'public', table: tab }, (p) => {
      const coll = COLL_DI_TABELLA[tab];
      if (p.eventType === 'DELETE') {
        const id = p.old && p.old.id;
        if (id) {
          if (coll === 'attivita') attivita = attivita.filter((x) => x.id !== id);
          if (coll === 'animali') animali = animali.filter((x) => x.id !== id);
          if (coll === 'interventi') interventi = interventi.filter((x) => x.id !== id);
          if (coll === 'contatti') contatti = contatti.filter((x) => x.id !== id);
        }
      } else if (p.new) metti(coll, p.new);
      if (caricoRotto) { caricoRotto = false; ricarica(false); return; }
      disegna();
      if (modo === 'animale' && animaleAperto) apriAnimale(animaleAperto);
    });
  });
  canale.subscribe((st) => {
    if (st === 'SUBSCRIBED') statoRete('● Live', '#DCF0D6', '#14401A');
    else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') statoRete('● Offline', '#8C1D18', '#fff');
    else statoRete('● …', '#ffffffcc');
  });
}

/* ==========================================================================
   CARICAMENTO
   ========================================================================== */
async function ricarica(conMessaggio) {
  const mia = ++seqCarico;
  try {
    const d = await archivio.carica();
    if (mia !== seqCarico) return;
    attivita = d.attivita; animali = d.animali; interventi = d.interventi; contatti = d.contatti;
    caricoRotto = false; disegna();
    if (conMessaggio) avvisa('Dati aggiornati');
  } catch (e) {
    if (mia !== seqCarico) return;
    caricoRotto = true; mostraErrore(e);
    avvisa('Dati non caricati: ' + (e.message || e), true);
  }
}

setInterval(() => { if (isoDi(new Date()) !== OGGI) location.reload(); }, 60000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (isoDi(new Date()) !== OGGI) { location.reload(); return; }
  if (CONFIGURATO) ricarica(false);
});
window.addEventListener('online',  () => { if (CONFIGURATO) ricarica(false); });
window.addEventListener('offline', () => statoRete('● Offline', '#8C1D18', '#fff'));

function installaIcona() {
  let icona = '';
  try {
    const c = document.createElement('canvas'); c.width = c.height = 192;
    const x = c.getContext('2d');
    x.fillStyle = '#8FA583'; x.fillRect(0, 0, 192, 192);
    x.font = '118px system-ui, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText('🚜', 96, 104);
    icona = c.toDataURL('image/png');
  } catch (e) {}
  if (icona) for (const rel of ['apple-touch-icon', 'icon']) {
    const l = document.createElement('link'); l.rel = rel; l.href = icona; document.head.appendChild(l);
  }
  const man = { name: 'Fattoria Tasks', short_name: 'Fattoria', start_url: './', display: 'standalone',
                orientation: 'portrait', background_color: '#E6D8BC', theme_color: '#8FA583',
                icons: icona ? [{ src: icona, sizes: '192x192', type: 'image/png', purpose: 'any' }] : [] };
  const l = document.createElement('link');
  l.rel = 'manifest'; l.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(man));
  document.head.appendChild(l);
}

(async function avvio() {
  installaIcona();
  const d = new Date(); calA = d.getFullYear(); calM = d.getMonth(); calSel = OGGI;
  $('#bot-io').textContent = io === 'Anna' ? 'A' : 'I';

  if (CONFIGURATO && window.supabase) {
    sb = window.supabase.createClient(SUPABASE_URL.trim().replace(/\/$/, ''), SUPABASE_ANON_KEY.trim());
    archivio = archivioRemoto;
    statoRete('● …', '#ffffffcc');
    await ricarica(false);
    avviaSincronia();
  } else {
    archivio = archivioLocale;
    statoRete('● Locale', '#F6D98A');
    $('#avviso-locale').hidden = false;
    $('#avviso-locale').innerHTML = CONFIGURATO
      ? 'Libreria Supabase non caricata (serve internet). Sto usando i dati di questo dispositivo.'
      : '<b>Modalità locale.</b> Supabase non è configurato: i dati restano su questo dispositivo e non si sincronizzano.';
    await ricarica(false);
  }
})();

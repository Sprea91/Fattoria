async function salva() {
  leggiCampi();
  const k = tipoAperto;
  const nuovo = modo === 'nuovo';
  const bot = $('[data-azione="salva"]');
  const titolo = String(mod.titolo || '').trim();

  if (k !== 'Intervento' && !titolo) { avvisa('Scrivi prima il nome', true); const e = $('#m-titolo'); if (e) e.focus(); return; }
  if (bot) { bot.disabled = true; bot.textContent = 'Salvo…'; }

  try {
    let urlFoto = null;
    if (fotoScelta.dati) urlFoto = await archivio.caricaFoto(fotoScelta.dati.blob, fotoScelta.dati.dataUrl);

    if (k === 'Animale') {
      const riga = { nome: titolo, specie: mod.specie, razza: mod.razza || null,
        data_nascita: mod.data_nascita || null, codice_stalla: mod.codice_stalla || null,
        costo_acquisto: mod.costo_acquisto === '' ? null : Number(mod.costo_acquisto),
        note: (mod.note || '').trim() || null };
      if (urlFoto) riga.foto_url = urlFoto;
      // l'inquadratura si invia solo se scelta: l'app funziona anche prima che
      // la colonna esista nel database
      if (mod.foto_inquadratura && mod.foto_inquadratura !== '50% 50%') riga.foto_inquadratura = mod.foto_inquadratura;
      else if (mod.avevaInquadratura) riga.foto_inquadratura = null;
      const salvatoAn = nuovo ? await archivio.inserisci('animali', riga) : await archivio.modifica('animali', idAperto, riga);
      metti('animali', salvatoAn);
      annota(nuovo ? 'Aggiunto' : 'Modificato', 'Animale', titolo, null, (salvatoAn && salvatoAn.id) || idAperto);
      chiudiPannello(); disegna(); avvisa(nuovo ? 'Animale aggiunto' : 'Modifiche salvate');
      return;
    }

    if (k === 'Intervento') {
      const riga = { animale_id: animaleAperto, tipo_evento: mod.tipo_evento,
        data_evento: mod.data_evento || OGGI, descrizione: (mod.descrizione || '').trim() || null,
        nome_veterinario: (mod.nome_veterinario || '').trim() || null,
        costo: mod.costo === '' ? null : Number(mod.costo) };
      if (urlFoto) riga.foto_ricevuta_url = urlFoto;
      // come per gli altri campi nuovi: lo invio solo quando serve
      if (mod.prossimo_il) riga.prossimo_il = mod.prossimo_il;
      else if (mod.avevaProssimo) riga.prossimo_il = null;
      const salvatoIv = nuovo ? await archivio.inserisci('interventi', riga) : await archivio.modifica('interventi', idAperto, riga);
      metti('interventi', salvatoIv);
      { const anRif = animali.find((z) => z.id === animaleAperto);
        annota(nuovo ? 'Aggiunto' : 'Modificato', 'Intervento',
               riga.tipo_evento + (anRif ? ' — ' + anRif.nome : ''),
               riga.costo ? euro(riga.costo) : null, (salvatoIv && salvatoIv.id) || idAperto); }
      if (mod.prossimo_il) await creaPromemoriaSanitario(animaleAperto, mod.tipo_evento, mod.prossimo_il, mod.descrizione);
      disegna(); avvisa(nuovo ? 'Intervento aggiunto' : 'Modifiche salvate');
      apriAnimale(animaleAperto);            // torno alla carta d'identità aggiornata
      return;
    }

    if (k === 'Contatto') {
      const riga = { nome: titolo, ruolo: mod.ruolo, telefono: (mod.telefono || '').trim() || null,
        note: (mod.note || '').trim() || null };
      const salvatoCo = await archivio.inserisci('contatti', riga);
      metti('contatti', salvatoCo);
      annota('Aggiunto', 'Contatto', titolo, riga.ruolo, salvatoCo && salvatoCo.id);
      disegna(); avvisa('Contatto aggiunto'); apriContatti();
      return;
    }

    // attività / routine / nota / spesa
    const riga = { titolo, note: (mod.note || '').trim() || null };
    if (k === 'Lavoro' || k === 'Routine' || k === 'Nota') riga.categoria = mod.categoria;
    if (k === 'Lavoro' || k === 'Routine') riga.assegnato_a = mod.assegnato_a;
    if (k === 'Lavoro') {
      riga.priorita = mod.priorita;
      riga.scadenza = mod.scadenza || null;
      riga.stato = mod.stato;
      riga.completato_il = mod.stato === 'Completato' ? new Date().toISOString() : null;
      // L'orario viene inviato solo se serve davvero: così l'app continua a
      // funzionare anche se la colonna `ora` non è ancora stata aggiunta.
      // come per l'orario: mando il campo solo quando serve, così l'app
      // continua a funzionare anche prima di aggiungere la colonna al database
      if (mod.ricorrenza && mod.ricorrenza !== 'Mai') riga.ricorrenza = mod.ricorrenza;
      else if (mod.avevaRicorrenza) riga.ricorrenza = null;
      if (mod.ora) riga.ora = mod.ora;
      else if (mod.avevaOra) riga.ora = null;          // l'orario c'era ed è stato togliato
      if (!mod.scadenza) riga.ora = mod.avevaOra ? null : undefined;
      if (riga.ora === undefined) delete riga.ora;
    }
    if (k === 'Routine' && modo !== 'nuovo' && mod.momento && mod.momento !== MOMENTO_DOPPIO) riga.momento = mod.momento;
    if (k === 'Nota') {
      riga.assegnato_a = io;
      // come per gli altri campi nuovi: inviato solo quando serve
      if (mod.animale_id) riga.animale_id = mod.animale_id;
      else if (mod.avevaAnimale) riga.animale_id = null;
    }
    if (k === 'Spesa') riga.assegnato_a = 'Tutti';
    if (urlFoto) riga.foto_url = urlFoto;

    if (nuovo) {
      riga.tipo = k;
      riga.stato = riga.stato || 'Da fare';
      if (k === 'Routine') {
        riga.routine_giornaliera = true;
        riga.ordine = leRoutine().length + 1;
        // "Mattina e sera" crea due routine gemelle, una per momento
        if (mod.momento === MOMENTO_DOPPIO) {
          for (const m of ['Mattina', 'Sera']) {
            const gemella = { ...riga, momento: m, ordine: leRoutine().length + 1 };
            metti('attivita', await archivio.inserisci('attivita', gemella));
            annota('Aggiunto', 'Routine', titolo, m.toLowerCase(), null);
          }
          chiudiPannello(); disegna(); avvisa('Create due routine: mattino e sera');
          return;
        }
        riga.momento = mod.momento || 'Mattina';
      }
      const salvataAt = await archivio.inserisci('attivita', riga);
      metti('attivita', salvataAt);
      annota('Aggiunto', k, titolo, k === 'Lavoro' && riga.scadenza
        ? 'per il ' + riga.scadenza.split('-').reverse().join('/') : null, salvataAt && salvataAt.id);
      if (k === 'Spesa') {                       // resto nel modulo per aggiungerne altri
        mod.titolo = ''; disegnaPannello(); disegna();
        const e = $('#m-titolo'); if (e) e.focus();
        avvisa('Aggiunto alla lista'); return;
      }
      chiudiPannello(); disegna(); avvisa(k === 'Nota' ? 'Nota salvata' : 'Aggiunto');
    } else {
      metti('attivita', await archivio.modifica('attivita', idAperto, riga));
      const idSalvato = idAperto;
      annota(riga.stato === 'Completato' ? 'Fatto' : 'Modificato', k, titolo, null, idSalvato);
      chiudiPannello(); disegna(); avvisa('Modifiche salvate');
      if (k === 'Lavoro' && riga.stato === 'Completato') await ripetiSeServe(idSalvato);
    }
  } catch (e) {
    const m = (e && e.message) || String(e);
    if (/column|colonna|schema cache/i.test(m) && /\bora\b/.test(m)) {
      avvisa('Per usare l\'orario esegui nell\'SQL Editor di Supabase: '
             + 'alter table public.attivita add column if not exists ora text;', true);
    } else if (/column|colonna|schema cache/i.test(m) && /ricorrenza/i.test(m)) {
      avvisa('Per usare le ripetizioni esegui nell\'SQL Editor di Supabase: '
             + 'alter table public.attivita add column if not exists ricorrenza text;', true);
    } else avvisa('Non salvato: ' + m, true);
    if (bot) { bot.disabled = false; disegnaPannello(); }
  }
}

/* ==========================================================================
   GOOGLE CALENDAR / BACKUP
   ========================================================================== */
function googleCalendar(id) {
  const t = attivita.find((x) => x.id === id);
  if (!t || !t.scadenza) { avvisa('Serve una scadenza', true); return; }
  let g, g2;
  if (t.ora && /^\d{2}:\d{2}/.test(t.ora)) {
    // con orario: appuntamento di un'ora, non evento di giornata intera
    const [hh, mm] = t.ora.split(':').map(Number);
    const inizio = new Date(t.scadenza + 'T00:00:00');
    inizio.setHours(hh, mm, 0, 0);
    const fine = new Date(inizio.getTime() + 3600000);
    const f = (d) => isoDi(d).replace(/-/g, '') + 'T'
      + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0') + '00';
    g = f(inizio); g2 = f(fine);
  } else {
    g = t.scadenza.replace(/-/g, '');
    const dopo = new Date(t.scadenza); dopo.setDate(dopo.getDate() + 1);
    g2 = isoDi(dopo).replace(/-/g, '');
  }
  const dett = [t.note, t.categoria ? 'Categoria: ' + t.categoria : '', 'Chi: ' + t.assegnato_a,
                'Stato: ' + t.stato].filter(Boolean).join('\n');
  const url = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent('🚜 ' + t.titolo)
    + '&dates=' + g + '/' + g2
    + '&details=' + encodeURIComponent(dett);
  window.open(url, '_blank', 'noopener');
}

/* ==========================================================================
   REGISTRO SANITARIO DA STAMPARE
   Prepara un foglio e apre la stampa del telefono, da cui si può anche
   scegliere "Salva come PDF".
   ========================================================================== */
function fogliettoAnimale(a) {
  const iv = interventiDi(a.id).slice().sort((x, y) => String(x.data_evento).localeCompare(String(y.data_evento)));
  const gg = (d) => d ? String(d).split('-').reverse().join('/') : '';
  const totInterventi = iv.reduce((s, x) => s + Number(x.costo || 0), 0);
  const dati = [
    ['Nome', a.nome], ['Specie', a.specie], ['Razza', a.razza],
    ['Data di nascita', a.data_nascita ? gg(a.data_nascita) + ' (' + eta(a.data_nascita) + ')' : ''],
    ['Codice stalla / microchip', a.codice_stalla],
    ['Costo d\'acquisto', euro(a.costo_acquisto) || ''],
    ['Spesa totale sostenuta', euro(spesaTotale(a)) || '']
  ].filter(([, v]) => v);

  return `<section class="animale">
    <h1>Registro sanitario — ${pul(a.nome)}</h1>
    <table class="anagrafica">
      ${dati.map(([k, v]) => `<tr><td>${pul(k)}</td><td><b>${pul(v)}</b></td></tr>`).join('')}
    </table>
    ${a.note ? `<p><i>${pul(a.note)}</i></p>` : ''}
    <h2>Interventi e trattamenti (${iv.length})</h2>
    ${iv.length ? `<table>

function stampaRegistro(idAnimale) {

  setTimeout(() => { try { window.print(); } catch (e) { avvisa('Stampa non disponibile su questo dispositivo', true); } }, 250);

function scarica(nomeFile, contenuto, tipo) {
  const b = new Blob([contenuto], { type: tipo });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = nomeFile;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function inCsv(righe) {
  if (!righe.length) return '';
  const col = Object.keys(righe[0]);
  const cella = (v) => {
    const s = v === null || v === undefined ? '' : String(v);
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return [col.join(';')].concat(righe.map((r) => col.map((c) => cella(r[c])).join(';'))).join('\r\n');
}
function backupJson() {
  const d = { esportato_il: new Date().toISOString(), attivita, animali, interventi, contatti, diario };
  scarica(`fattoria-backup-${OGGI}.json`, JSON.stringify(d, null, 2), 'application/json');
  avvisa('Backup JSON scaricato');
}
function backupCsv() {
  const parti = [['ATTIVITA', attivita], ['ANIMALI', animali], ['INTERVENTI', interventi], ['CONTATTI', contatti]]
    .filter(([, r]) => r.length)
    .map(([n, r]) => n + '\r\n' + inCsv(r)).join('\r\n\r\n');
  scarica(`fattoria-backup-${OGGI}.csv`, '﻿' + parti, 'text/csv;charset=utf-8');
  avvisa('Backup CSV scaricato');
}

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-azione],[data-vista],[data-apri],[data-miei],[data-imposta],[data-io],[data-sono],[data-lente],[data-giorno],[data-animale],[data-intervento],[data-filtro-reg],[data-inquadra],[data-scheda],[data-animale-nota]');
  if (!el) return;

  if (el.dataset.vista) {
    if (!$('#pannello').hidden) chiudiPannello();
    vista = el.dataset.vista; window.scrollTo({ top: 0 }); disegna(); return;
  }
  if (el.dataset.giorno)  { calSel = el.dataset.giorno; disegna(); return; }
  if (el.dataset.lente)   { $('#lente img').src = el.dataset.lente; $('#lente').hidden = false; return; }
  if (el.dataset.miei)    { filtroMiei = el.dataset.miei; disegna(); return; }
  if (el.dataset.filtroReg) { filtroReg = el.dataset.filtroReg; disegna(); return; }
  if (el.dataset.scheda)    { schedaStorico = el.dataset.scheda; disegna(); return; }
  if (el.dataset.io)      { io = el.dataset.io; localStorage.setItem('fattoria_io', io); disegnaImpostazioni(); disegna(); return; }
  if (el.dataset.sono)    { impostaIdentita(el.dataset.sono); return; }
  if (el.dataset.animale) { apriAnimale(el.dataset.animale); return; }
  if (el.dataset.intervento) { apriIntervento(el.dataset.intervento); return; }
  if (el.hasAttribute('data-animale-nota')) {
    leggiCampi();
    mod.animale_id = el.dataset.animaleNota || null;
    disegnaPannello();
    return;
  }
  if (el.dataset.inquadra) {
    leggiCampi();
    if (el.dataset.inquadra === 'intera') mod.foto_inquadratura = 'intera';
    if (el.dataset.inquadra === 'riempi') mod.foto_inquadratura = '50% 50%';
    if (el.dataset.inquadra === 'centra') mod.foto_inquadratura = '50% 50%';
    disegnaPannello();
    return;
  }
  if (el.dataset.imposta) {
    leggiCampi();
    mod[el.dataset.imposta] = el.dataset.valore;
    // "quando va rifatto": traduco la scelta in una data vera
    if (el.dataset.imposta === 'prossimo') {
      const p = PROSSIMI.find((x) => x.v === el.dataset.valore);
      mod.prossimo_il = (p && p.mesi) ? spostaMesi(mod.data_evento || OGGI, p.mesi) : '';
    }
    disegnaPannello();
    return;
  }

  const id = el.dataset.id;
  switch (el.dataset.azione) {
    case 'routine':  spuntaRoutine(id); return;
    case 'spesa':    spuntaSpesa(id); return;
    case 'inizia':   ev.stopPropagation();
      { const t = attivita.find((x) => x.id === id);
        cambia('attivita', id, { stato: 'In corso' }, '▶ In corso');
        annota('Iniziato', 'Lavoro', t && t.titolo, null, id); }
      return;
    case 'finisci':  ev.stopPropagation();
      { const t = attivita.find((x) => x.id === id);
        cambia('attivita', id, { stato: 'Completato', completato_il: new Date().toISOString() }, '✓ Completato')
          .then(() => ripetiSeServe(id));
        annota('Fatto', t && t.tipo === 'Routine' ? 'Routine' : 'Lavoro', t && t.titolo, null, id); }
      return;
    case 'elimina':  ev.stopPropagation(); elimina('attivita', id).then(() => { if (modo === 'impostazioni') disegnaImpostazioni(); }); return;
    case 'elimina-contatto': elimina('contatti', id).then(() => apriContatti()); return;
    case 'svuota-comprati': svuotaComprati(); return;
    case 'riprova':  chiudiPannello(); caricoRotto = false; ricarica(true); return;
    case 'mese-prec': calM--; if (calM < 0) { calM = 11; calA--; } disegna(); return;
    case 'mese-succ': calM++; if (calM > 11) { calM = 0; calA++; } disegna(); return;
    case 'cal-oggi': { const d = new Date(); calA = d.getFullYear(); calM = d.getMonth(); calSel = OGGI; disegna(); return; }
    case 'nuovo-nel-giorno': apriNuovo('Lavoro', calSel); return;
    case 'nuova-routine':    apriNuovo('Routine'); return;
    case 'su-routine':       spostaRoutine(id, -1); return;
    case 'giu-routine':      spostaRoutine(id, 1); return;
    case 'nuovo-contatto':   apriNuovo('Contatto'); return;
    case 'nuovo-intervento': apriNuovo('Intervento'); return;
    case 'nuova-nota-animale':
      { const rif = animaleAperto; apriNuovo('Nota'); mod.animale_id = rif; disegnaPannello(); }
      return;
    case 'modifica-animale': apriModificaAnimale(animaleAperto); return;
    case 'stampa-animale':   stampaRegistro(animaleAperto); return;
    case 'stampa-tutti':     stampaRegistro(null); return;
    case 'elimina-animale':
      if (el.dataset.armato !== '1') { el.dataset.armato = '1'; el.textContent = '⚠️ Tocca di nuovo: elimina anche gli interventi'; return; }
      { const x = animaleAperto; chiudiPannello(); elimina('animali', x); } return;
    case 'apri-contatti': apriContatti(); return;
    case 'extra':    leggiCampi(); mod.extra = true; disegnaPannello(); return;
    case 'prendi-foto': apriSelettoreFoto(false); return;   // galleria o file
    case 'scatta-foto': apriSelettoreFoto(true); return;    // fotocamera diretta
    case 'togli-foto':  leggiCampi(); fotoScelta.dati = null; mod.foto_url = null; disegnaPannello(); return;
    case 'salva':    salva(); return;
    case 'google-calendar': googleCalendar(idAperto); return;
    case 'backup-json': backupJson(); return;
    case 'backup-csv':  backupCsv(); return;
    case 'apri-accesso':    chiudiPannello(); mostraAccesso('entra'); return;
    case 'esci':            esci(); return;
    case 'cambia-password': cambiaPasswordDaDentro(); return;
    case 'attiva-notifiche': attivaNotifiche(); return;
    case 'spegni-notifiche': spegniNotifiche(); return;
    case 'prova-notifica':   provaNotifica(); return;
    case 'elimina-iscrizione': elimina('iscrizioni', id).then(() => disegnaImpostazioni()); return;
    case 'elimina-nel-pannello':
      if (el.dataset.armato !== '1') { el.dataset.armato = '1'; el.textContent = '⚠️ Tocca di nuovo per eliminare'; return; }
      {
        const x = idAperto, k = tipoAperto, an = animaleAperto;
        if (k === 'Animale') { chiudiPannello(); elimina('animali', x); }
        else if (k === 'Intervento') { elimina('interventi', x).then(() => apriAnimale(an)); }
        else { chiudiPannello(); elimina('attivita', x); }
      } return;
  }

  if (el.dataset.apri) apriModifica(el.dataset.apri);
});

/* ==========================================================================
   TRASCINAMENTO LATERALE
   Tre difese contro il gesto involontario:
   1) soglia ampia (un terzo della scheda, minimo 70 px)
   2) si può rilasciare prima della soglia e non succede niente
   3) dopo l'azione resta "Annulla" per sei secondi
   ========================================================================== */
const SOGLIA_FRAZ = 0.33, SOGLIA_MIN = 70;
let gesto = null;

document.addEventListener('pointerdown', (ev) => {
  if (ev.pointerType === 'mouse' && ev.button !== 0) return;
  const dentro = ev.target.closest('.scorrevole');
  if (!dentro) return;
  // i tap sui pulsanti e sulle foto restano tap
  if (ev.target.closest('button, a, input, textarea, select, [data-lente]')) return;
  const box = dentro.closest('.swipe');
  if (!box) return;
  gesto = { box, dentro, x0: ev.clientX, y0: ev.clientY, dx: 0, attivo: false,
            largh: box.clientWidth || 320, id: box.dataset.swId,
            azDx: box.dataset.dx || '', azSx: box.dataset.sx || '' };
});

document.addEventListener('pointermove', (ev) => {
  if (!gesto) return;
  const dx = ev.clientX - gesto.x0, dy = ev.clientY - gesto.y0;
  if (!gesto.attivo) {
    if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 8) { gesto = null; return; }  // sta scorrendo la pagina
    if (Math.abs(dx) < 10) return;
    gesto.attivo = true;
    gesto.dentro.style.transition = 'none';
  }
  // non lascio trascinare verso un lato che non ha azione
  let d = dx;
  if (d > 0 && !gesto.azDx) d = 0;
  if (d < 0 && !gesto.azSx) d = 0;
  gesto.dx = d;
  gesto.dentro.style.transform = 'translateX(' + d + 'px)';
  gesto.box.dataset.dir = d > 0 ? 'dx' : d < 0 ? 'sx' : '';
  const soglia = Math.max(SOGLIA_MIN, gesto.largh * SOGLIA_FRAZ);
  const superata = Math.abs(d) >= soglia;
  gesto.box.classList.toggle('pronto', superata);
  if (superata && !gesto.vibrato) { gesto.vibrato = true; if (navigator.vibrate) navigator.vibrate(12); }
  if (!superata) gesto.vibrato = false;
});

function fineGesto() {
  if (!gesto) return;
  const g = gesto; gesto = null;
  g.dentro.style.transition = 'transform .18s ease';
  g.dentro.style.transform = 'translateX(0)';
  g.box.classList.remove('pronto');
  setTimeout(() => { if (g.box) g.box.dataset.dir = ''; }, 180);
  if (!g.attivo) return;
  const soglia = Math.max(SOGLIA_MIN, g.largh * SOGLIA_FRAZ);
  if (Math.abs(g.dx) < soglia) return;                  // rilasciato prima: non succede nulla
  eseguiSwipe(g.dx > 0 ? g.azDx : g.azSx, g.id);
}
document.addEventListener('pointerup', fineGesto);
document.addEventListener('pointercancel', fineGesto);

function eseguiSwipe(azione, id) {
  const t = attivita.find((x) => x.id === id);
  if (!azione || !t) return;

  if (azione === 'finisci') {
    const prima = { stato: t.stato, completato_il: t.completato_il };
    cambia('attivita', id, { stato: 'Completato', completato_il: new Date().toISOString() })
      .then(() => ripetiSeServe(id));
    annota('Fatto', 'Lavoro', t.titolo, 'con il gesto', id);
    avvisaAnnullabile('✓ ' + t.titolo, () => cambia('attivita', id, prima, 'Rimesso come prima'));
    return;
  }
  if (azione === 'inizia') {
    const prima = { stato: t.stato };
    cambia('attivita', id, { stato: 'In corso' });
    annota('Iniziato', 'Lavoro', t.titolo, 'con il gesto', id);
    avvisaAnnullabile('▶ ' + t.titolo, () => cambia('attivita', id, prima, 'Rimesso come prima'));
    return;
  }
  if (azione === 'routine') {
    const era = routineFatta(t);
    spuntaRoutine(id, true);
    avvisaAnnullabile((era ? '↩ ' : '✓ ') + t.titolo, () => spuntaRoutine(id));
    return;
  }
  if (azione === 'spesa') {
    const era = t.stato === 'Completato';
    spuntaSpesa(id, true);
    avvisaAnnullabile((era ? '↩ ' : '🛒 ') + t.titolo, () => spuntaSpesa(id));
    return;
  }
  if (azione === 'elimina-spesa') {
    // conservo la riga per poterla ricreare identica
    const copia = { tipo: t.tipo, titolo: t.titolo, assegnato_a: t.assegnato_a,
                    stato: t.stato, priorita: t.priorita, categoria: t.categoria, note: t.note };
    eliminaSilenzioso('attivita', id);
    avvisaAnnullabile('🗑 ' + t.titolo, async () => {
      try {
        metti('attivita', await archivio.inserisci('attivita', copia));
        annota('Aggiunto', copia.tipo, copia.titolo, 'ripristinato', null);
        disegna(); avvisa('Rimesso in lista');
      } catch (e) { avvisa('Non ripristinato: ' + (e.message || e), true); }
    });
  }
}

/* ==========================================================================
   SINCRONIZZAZIONE ISTANTANEA
   ========================================================================== */
const COLL_DI_TABELLA = { attivita: 'attivita', animali: 'animali', interventi_animali: 'interventi', contatti: 'contatti' };

function avviaSincronia() {
  canale = sb.channel('fattoria-live');
  Object.keys(COLL_DI_TABELLA).forEach((tab) => {
    canale.on('postgres_changes', { event: '*', schema: 'public', table: tab }, (p) => {
      const coll = COLL_DI_TABELLA[tab];
      if (p.eventType === 'DELETE') {
        const id = p.old && p.old.id;
        if (id) {
          if (coll === 'attivita') attivita = attivita.filter((x) => x.id !== id);
          if (coll === 'animali') animali = animali.filter((x) => x.id !== id);
          if (coll === 'interventi') interventi = interventi.filter((x) => x.id !== id);
          if (coll === 'contatti') contatti = contatti.filter((x) => x.id !== id);
        }
      } else if (p.new) metti(coll, p.new);
      if (caricoRotto) { caricoRotto = false; ricarica(false); return; }
      disegna();
      if (modo === 'animale' && animaleAperto) apriAnimale(animaleAperto);
    });
  });
  canale.subscribe((st) => {
    if (st === 'SUBSCRIBED') statoRete('● Live', '#DCF0D6', '#14401A');
    else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') statoRete('● Offline', '#8C1D18', '#fff');
    else statoRete('● …', '#ffffffcc');
  });
}

/* ==========================================================================
   CARICAMENTO
   ========================================================================== */
async function ricarica(conMessaggio) {
  const mia = ++seqCarico;
  try {
    const d = await archivio.carica();
    if (mia !== seqCarico) return;
    attivita = d.attivita; animali = d.animali; interventi = d.interventi; contatti = d.contatti;
    iscrizioni = d.iscrizioni || [];
    diario = d.diario || [];
    caricoRotto = false; disegna();
    if (conMessaggio) avvisa('Dati aggiornati');
  } catch (e) {
    if (mia !== seqCarico) return;
    caricoRotto = true; mostraErrore(e);
    avvisa('Dati non caricati: ' + (e.message || e), true);
  }
}

// A mezzanotte le routine devono tornare tutte "da fare". Non serve azzerare
// niente: si confronta la data dell'ultima spunta con quella di oggi. Però la
// pagina aperta ha in memoria la data di ieri, quindi va ricaricata.
const giornoCambiato = (adesso) => isoDi(adesso || new Date()) !== OGGI;

setInterval(() => { if (giornoCambiato()) location.reload(); }, 60000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (giornoCambiato()) { location.reload(); return; }
  if (CONFIGURATO) ricarica(false);
});
window.addEventListener('online',  () => { if (CONFIGURATO) { ricarica(false); riparaIscrizione(); } });
window.addEventListener('offline', () => statoRete('● Offline', '#8C1D18', '#fff'));

// Se manifest.json o le icone non ci sono (per esempio aprendo il file da solo,
// senza gli altri file accanto), ne creo una versione al volo così l'app resta
// installabile e con la sua icona.
function riservaIconaEManifest() {
  const c = document.createElement('canvas'); c.width = c.height = 192;
  const x = c.getContext('2d');
  x.fillStyle = '#8FA583'; x.fillRect(0, 0, 192, 192);
  x.fillStyle = '#E6D8BC'; x.fillRect(0, 138, 192, 54);
  x.font = '100px system-ui, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('🚜', 96, 84);
  const icona = c.toDataURL('image/png');
  document.querySelectorAll('link[rel="icon"],link[rel="apple-touch-icon"]').forEach((l) => { l.href = icona; });
  const man = { name: 'Fattoria Tasks', short_name: 'Fattoria', start_url: './', display: 'standalone',
                orientation: 'portrait', background_color: '#E6D8BC', theme_color: '#8FA583',
                icons: [{ src: icona, sizes: '192x192', type: 'image/png', purpose: 'any' }] };
  const l = document.querySelector('link[rel="manifest"]');
  if (l) l.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(man));
}

(async function avvio() {
  fetch('./icona-192.png', { method: 'HEAD' }).then((r) => { if (!r.ok) riservaIconaEManifest(); })
    .catch(() => riservaIconaEManifest());
  registraServiceWorker();
  const d = new Date(); calA = d.getFullYear(); calM = d.getMonth(); calSel = OGGI;
  $('#bot-io').textContent = (io || '?').charAt(0).toUpperCase();

  if (CONFIGURATO && window.supabase) {
    sb = window.supabase.createClient(SUPABASE_URL.trim().replace(/\/$/, ''), SUPABASE_ANON_KEY.trim());
    archivio = archivioRemoto;
    statoRete('● …', '#ffffffcc');

    // Sessione già salvata su questo telefono?
    try {
      const { data } = await sb.auth.getSession();
      utente = (data && data.session && data.session.user) || null;
      allineaIdentita();
    } catch (e) {}

    // Il link della email di recupero riporta qui: il client legge il codice
    // dall'indirizzo ed emette PASSWORD_RECOVERY.
    sb.auth.onAuthStateChange((evento, sessione) => {
      utente = (sessione && sessione.user) || null;
      allineaIdentita();
      if (evento === 'PASSWORD_RECOVERY') { mostraAccesso('nuova-password'); return; }
      if (evento === 'SIGNED_OUT' && ACCESSO_OBBLIGATORIO) { mostraAccesso('entra'); return; }
      if (!$('#pannello').hidden && modo === 'impostazioni') disegnaImpostazioni();
    });

    if (ACCESSO_OBBLIGATORIO && !utente) {
      mostraAccesso('entra');
      return;                                   // niente dati finché non entra
    }

    await ricarica(false);
    avviaSincronia();
    riparaIscrizione();          // se le notifiche erano decadute, si riattaccano
  } else {
    archivio = archivioLocale;
    statoRete('● Locale', '#F6D98A');
    $('#avviso-locale').hidden = false;
    $('#avviso-locale').innerHTML = CONFIGURATO
      ? 'Libreria Supabase non caricata (serve internet). Sto usando i dati di questo dispositivo.'
      : '<b>Modalità locale.</b> Supabase non è configurato: i dati restano su questo dispositivo e non si sincronizzano.';
    await ricarica(false);
  }
})();

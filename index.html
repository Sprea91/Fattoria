  FATTORIA TASKS — v3 (Single Page PWA, file unico)
  ============================================================================
  Sezioni:  Oggi · Calendario · Lavori · Registro · Spesa   (+ Storico dal calendario)
  Aggiunta: bottone verde in basso a destra, cambia in base alla sezione.
  Dettagli: un tap sulla scheda (o sul nome della routine) apre il dettaglio

            resto della riga apre i dettagli.

  Lo schema del database è lo stesso della v2, non serve rifarlo se l'hai già fatto.

const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

const plusDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
const MESI = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];

function daysFromToday(isoDate) {
  if (!isoDate) return null;
  const [y, m, d] = isoDate.split('-').map(Number);
  const a = new Date(y, m - 1, d), b = new Date(); b.setHours(0, 0, 0, 0);
  return Math.round((a - b) / 86400000);
}
function dateLabel(isoDate) {
  const n = daysFromToday(isoDate);
  if (n === null) return '';
  if (n === 0) return 'Oggi';
  if (n === 1) return 'Domani';
  if (n === -1) return 'Ieri';
  if (n < -1) return `${Math.abs(n)} gg in ritardo`;
  const [y, m, d] = isoDate.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' });
}
function dateLungo(isoDate) {
  const [y, m, d] = isoDate.split('-').map(Number);
  const t = new Date(y, m - 1, d).toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
  const pre = isoDate === TODAY ? 'Oggi · ' : isoDate === plusDays(1) ? 'Domani · ' : isoDate === plusDays(-1) ? 'Ieri · ' : '';
  return pre + t.charAt(0).toUpperCase() + t.slice(1);
}
function stampLabel(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const g = iso(d) === TODAY ? 'Oggi' : iso(d) === plusDays(-1) ? 'Ieri'

  return `${g} · ${d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })}`;
}

/* ==========================================================================
   FOTO
   ========================================================================== */
async function shrink(file, max = 1280, q = 0.72) {
  const bmp = await (async () => {
    if (window.createImageBitmap) { try { return await createImageBitmap(file); } catch (e) {} }
    return await new Promise((res, rej) => {
      const im = new Image(), fr = new FileReader();
      fr.onload = () => { im.onload = () => res(im); im.onerror = rej; im.src = fr.result; };
      fr.onerror = rej; fr.readAsDataURL(file);
    });
  })();
  const w0 = bmp.width || bmp.naturalWidth, h0 = bmp.height || bmp.naturalHeight;
  const k = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement('canvas');
  c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', q));
  return { blob, dataUrl: c.toDataURL('image/jpeg', q) };
}

  } catch (e) { toast('Foto non leggibile: ' + (e.message || e), true); }
  finally { input.value = ''; }
});

/* ==========================================================================
   UI DI SERVIZIO
   ========================================================================== */
let toastTimer = null;
function toast(msg, err = false) {
  const el = $('#toast');
  el.textContent = msg; el.style.background = err ? '#8C1D18' : '#20281A'; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, err ? 5000 : 2100);
}
function setConn(text, bg, fg) {
  const el = $('#conn'); el.textContent = text;
  el.style.background = bg; el.style.color = fg || '#14200F'; el.style.borderColor = 'transparent';
}
function chipRow(values, current, campo, cls = 'flex-1') {
  return values.map((v) => {
    const val = typeof v === 'object' ? v.v : v;
    const lab = typeof v === 'object' ? `${v.e} ${v.v}` : v;
    return `<button type="button" class="chip ${cls}" aria-pressed="${current === val}"
              data-set="${campo}" data-value="${esc(val)}">${esc(lab)}</button>`;
  }).join('');
}
function badgesOf(t) {
  const out = [];
  if (t.category) out.push(`<span class="badge">${catEmoji(t.category)} ${esc(t.category)}</span>`);
  if (t.estimated_time) out.push(`<span class="badge">⏱️ ${esc(t.estimated_time)}</span>`);
  out.push(`<span class="badge badge-who">👤 ${esc(t.assigned_to)}</span>`);
  if (t.priority === 'Alta' && t.status !== 'Completato') out.push('<span class="badge badge-pri">🔥 Alta</span>');
  if (t.due_date && t.status !== 'Completato') {
    const n = daysFromToday(t.due_date);
    out.push(`<span class="badge ${n < 0 ? 'badge-hot' : n === 0 ? 'badge-today' : ''}">📅 ${esc(dateLabel(t.due_date))}</span>`);
  }
  return out.join('');
}
const photoTag = (t, cls = 'mt-2') => t.photo_url
  ? `<img src="${esc(t.photo_url)}" class="thumb ${cls}" alt="Foto" loading="lazy" data-lb="${esc(t.photo_url)}">` : '';

/* ==========================================================================
   SELEZIONI
   ========================================================================== */
const routineDone = (t) => t.last_done_date === TODAY;
const isMine = (t) => mine === 'tutti' || t.assigned_to === me || t.assigned_to === 'Tutti';
const byUrgency = (a, b) => {
  const da = a.due_date ? daysFromToday(a.due_date) : 9e5;
  const dbb = b.due_date ? daysFromToday(b.due_date) : 9e5;
  if (da !== dbb) return da - dbb;
  const r = { Alta: 0, Media: 1, Bassa: 2 };
  const pa = r[a.priority] ?? 1, pb = r[b.priority] ?? 1;
  if (pa !== pb) return pa - pb;
  return String(b.created_at).localeCompare(String(a.created_at));
};
const routines = () => tasks.filter((t) => t.kind === 'Routine').sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
const lavori   = () => tasks.filter((t) => t.kind === 'Lavoro');
const note     = () => tasks.filter((t) => t.kind === 'Nota').sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
const spesa    = () => tasks.filter((t) => t.kind === 'Spesa');

/* ==========================================================================
   SCHEDE
   ========================================================================== */
function cardLavoro(t, azioni = true) {
  const late = t.status !== 'Completato' && t.due_date && daysFromToday(t.due_date) < 0;
  const fatto = t.status === 'Completato';
  return `
    <article class="card card-tap ${late ? 'card-hot' : ''} ${fatto ? 'card-done' : ''}" data-open="${t.id}" role="button" tabindex="0">
      <div class="flex items-start gap-2">
        <h3 class="flex-1 font-black text-base leading-tight ${fatto ? 'line-through opacity-60' : ''}">${esc(t.title)}</h3>
        ${azioni && !fatto ? `<button class="btn btn-primary btn-sm shrink-0" data-act="${t.status === 'Da fare' ? 'start' : 'done'}" data-id="${t.id}">
             ${t.status === 'Da fare' ? '▶ Inizia' : '✓ Fatto'}</button>`
          : `<span class="text-xl shrink-0" style="color:var(--ink-2)">›</span>`}
      </div>
      <div class="flex flex-wrap gap-1.5 mt-2">${badgesOf(t)}</div>
      ${t.notes ? `<p class="mt-2 text-sm font-semibold" style="color:var(--ink-2)">${esc(t.notes)}</p>` : ''}
      ${photoTag(t)}
    </article>`;
}

function rigaRoutine(t) {
  return `
    <div class="rt ${routineDone(t) ? 'rt-on' : ''}">
      <button type="button" class="rt-box" data-act="routine" data-id="${t.id}"
              aria-label="${routineDone(t) ? 'Annulla' : 'Segna come fatto'}">✓</button>
      <button type="button" class="rt-open" data-open="${t.id}">
        <span class="rt-title">${esc(t.title)}</span>
        <span class="mt-1 flex flex-wrap gap-1.5">
          <span class="badge badge-who">👤 ${esc(t.assigned_to)}</span>
          ${t.estimated_time ? `<span class="badge">⏱️ ${esc(t.estimated_time)}</span>` : ''}
        </span>
      </button>
      <span class="text-xl" style="color:var(--ink-2)">›</span>
    </div>`;
}

/* ==========================================================================
   SEZIONE: OGGI
   ========================================================================== */
function renderOggi() {
  const rt = routines();
  const fatte = rt.filter(routineDone).length;
  const inCorso = lavori().filter((t) => t.status === 'In corso').sort(byUrgency);
  const urgenti = lavori().filter((t) => t.status === 'Da fare' && t.due_date && daysFromToday(t.due_date) <= 0).sort(byUrgency);
  const domani  = lavori().filter((t) => t.status === 'Da fare' && t.due_date && daysFromToday(t.due_date) === 1).sort(byUrgency);

  let h = '';
  if (urgenti.length) h += `<section><h2 class="h-sec">⚠️ Da fare oggi <span class="h-count">${urgenti.length}</span></h2>
      <div class="space-y-3">${urgenti.map((t) => cardLavoro(t)).join('')}</div></section>`;
  if (inCorso.length) h += `<section><h2 class="h-sec">🔄 In corso <span class="h-count">${inCorso.length}</span></h2>
      <div class="space-y-3">${inCorso.map((t) => cardLavoro(t)).join('')}</div></section>`;
  if (!urgenti.length && !inCorso.length) h += `<section class="card text-center py-8">
      <div class="text-4xl">👍</div><p class="mt-2 font-black">Nessuna scadenza oggi</p>
      <p class="mt-1 text-sm font-semibold" style="color:var(--ink-2)">Guarda il Calendario per i prossimi giorni.</p></section>`;

  h += `<section>
      <h2 class="h-sec">☀️ Routine di oggi <span class="h-count">${fatte}/${rt.length}</span></h2>
      <div class="space-y-2.5">${rt.length ? rt.map(rigaRoutine).join('')
        : '<p class="card text-center font-bold py-6">Nessuna routine. Aggiungila col pulsante ＋</p>'}</div>
      <p class="text-xs font-semibold mt-2 px-1" style="color:var(--ink-2)">
        Cerchietto = fatto · tocca il nome per modificarla</p>
    </section>`;

  if (domani.length) h += `<section><h2 class="h-sec">🌅 Domani <span class="h-count">${domani.length}</span></h2>
      <div class="space-y-3">${domani.map((t) => cardLavoro(t)).join('')}</div></section>`;

  $('#oggi-body').innerHTML = h;
}

/* ==========================================================================
   SEZIONE: CALENDARIO
   ========================================================================== */
function delGiorno(g) {
  const aperte  = lavori().filter((t) => t.due_date === g && t.status !== 'Completato').sort(byUrgency);
  const fatte   = lavori().filter((t) => t.due_date === g && t.status === 'Completato');
  const fatteIn = lavori().filter((t) => t.status === 'Completato' && t.due_date !== g
                                        && String(t.completed_at || '').slice(0, 10) === g);
  const rtFatte = routines().filter((t) => t.last_done_date === g);
  return { aperte, fatte: fatte.concat(fatteIn), rtFatte };
}

function renderCalendario() {
  const primo = new Date(calY, calM, 1);
  const giorniMese = new Date(calY, calM + 1, 0).getDate();
  const offset = (primo.getDay() + 6) % 7;            // settimana che inizia lunedì

  let celle = '';
  for (let i = 0; i < offset; i++) celle += '<div class="cal-cell out"></div>';
  for (let d = 1; d <= giorniMese; d++) {
    const g = `${calY}-${String(calM + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const { aperte, fatte, rtFatte } = delGiorno(g);
    const late = aperte.some((t) => daysFromToday(t.due_date) < 0);
    const run  = aperte.some((t) => t.status === 'In corso');
    let dots = '';
    if (late) dots += '<span class="dot dot-late"></span>';
    if (run)  dots += '<span class="dot dot-run"></span>';
    if (aperte.length && !late) dots += '<span class="dot dot-open"></span>';
    if (fatte.length + rtFatte.length) dots += '<span class="dot dot-done"></span>';
    const cls = ['cal-cell', g === TODAY ? 'today' : '', g === calSel ? 'sel' : ''].join(' ');
    celle += `<button type="button" class="${cls}" data-cal="${g}">
        <span>${d}</span><span class="cal-dots">${dots}</span></button>`;
  }

  const { aperte, fatte, rtFatte } = delGiorno(calSel);

  $('#calendario-body').innerHTML = `
    <div class="card">
      <div class="flex items-center gap-2">
        <button class="btn btn-ghost btn-sm" data-act="cal-prev" aria-label="Mese precedente">‹</button>
        <h2 class="flex-1 text-center font-black text-base">${MESI[calM]} ${calY}</h2>
        <button class="btn btn-ghost btn-sm" data-act="cal-next" aria-label="Mese successivo">›</button>
      </div>
      <div class="cal-grid mt-3">
        ${['L', 'M', 'M', 'G', 'V', 'S', 'D'].map((d) => `<div class="cal-dow">${d}</div>`).join('')}
        ${celle}
      </div>
      <div class="flex flex-wrap gap-3 mt-3 text-xs font-bold" style="color:var(--ink-2)">
        <span class="flex items-center gap-1"><span class="dot dot-late"></span>in ritardo</span>
        <span class="flex items-center gap-1"><span class="dot dot-open"></span>da fare</span>
        <span class="flex items-center gap-1"><span class="dot dot-run"></span>in corso</span>
        <span class="flex items-center gap-1"><span class="dot dot-done"></span>fatto</span>
      </div>
      <div class="flex gap-2 mt-3">
        <button class="btn btn-ghost btn-sm flex-1" data-act="cal-today">Vai a oggi</button>
        <button class="btn btn-ghost btn-sm flex-1" data-view="storico">📋 Storico completo</button>
      </div>
    </div>

    <section>
      <h2 class="h-sec">${esc(dateLungo(calSel))}</h2>
      ${aperte.length ? `<div class="space-y-3">${aperte.map((t) => cardLavoro(t)).join('')}</div>`
        : `<div class="card text-center py-6">
             <p class="font-black">Niente in programma</p>
             <button class="btn btn-primary btn-wide mt-3" data-act="new-per-giorno">＋ Aggiungi attività per questo giorno</button>
           </div>`}
      ${aperte.length ? `<button class="btn btn-ghost w-full mt-3" data-act="new-per-giorno">＋ Aggiungi in questo giorno</button>` : ''}
    </section>

    ${(fatte.length || rtFatte.length) ? `<section>
      <h2 class="h-sec">✅ Fatto in questo giorno <span class="h-count">${fatte.length + rtFatte.length}</span></h2>
      <div class="space-y-3">
        ${fatte.map((t) => cardLavoro(t, false)).join('')}
        ${rtFatte.map((t) => `<article class="card card-done">
            <div class="flex items-start gap-2">
              <h3 class="flex-1 font-bold">${esc(t.title)}</h3>
              <span class="badge">🔁 Routine</span>
            </div></article>`).join('')}
      </div></section>` : ''}`;
}

/* ==========================================================================
   SEZIONE: LAVORI
   ========================================================================== */
function renderLavori() {
  const v = lavori().filter(isMine);
  const daFare  = v.filter((t) => t.status === 'Da fare').sort(byUrgency);
  const inCorso = v.filter((t) => t.status === 'In corso').sort(byUrgency);
  const senzaData = daFare.filter((t) => !t.due_date);
  const conData   = daFare.filter((t) => t.due_date);

  let h = `<div class="flex gap-2">
      <button class="chip flex-1" data-mine="tutti" aria-pressed="${mine === 'tutti'}">Tutti i lavori</button>
      <button class="chip flex-1" data-mine="miei"  aria-pressed="${mine === 'miei'}">Solo i miei</button>
    </div>`;
  if (inCorso.length) h += `<section><h2 class="h-sec">🔄 In corso <span class="h-count">${inCorso.length}</span></h2>
      <div class="space-y-3">${inCorso.map((t) => cardLavoro(t)).join('')}</div></section>`;
  h += `<section><h2 class="h-sec">🔨 Con scadenza <span class="h-count">${conData.length}</span></h2>
      <div class="space-y-3">${conData.length ? conData.map((t) => cardLavoro(t)).join('')
        : '<p class="card text-center font-bold py-6">Nessun lavoro in scadenza 🎉</p>'}</div></section>`;
  if (senzaData.length) h += `<section><h2 class="h-sec">📥 Senza data <span class="h-count">${senzaData.length}</span></h2>
      <div class="space-y-3">${senzaData.map((t) => cardLavoro(t)).join('')}</div></section>`;
  $('#lavori-body').innerHTML = h;
}

/* ==========================================================================
   SEZIONE: REGISTRO
   ========================================================================== */
function renderRegistro() {
  const n = note();
  $('#registro-body').innerHTML = n.length ? n.map((t) => `
      <article class="card card-tap" data-open="${t.id}" role="button" tabindex="0">
        <div class="flex items-start gap-2">
          <h3 class="flex-1 font-black text-base leading-tight">${esc(t.title)}</h3>
          <span class="badge">${stampLabel(t.created_at)}</span>
        </div>
        ${t.notes ? `<p class="mt-2 text-sm font-semibold" style="color:var(--ink-2)">${esc(t.notes)}</p>` : ''}
        ${photoTag(t)}
      </article>`).join('')
    : `<p class="card text-center font-bold py-8">Nessuna nota.<br>
        <span class="font-semibold text-sm">Col pulsante ＋ annoti animali e attrezzature, anche con foto.</span></p>`;
}

/* ==========================================================================
   SEZIONE: SPESA
   ========================================================================== */
function renderSpesa() {
  const s = spesa();
  const da = s.filter((t) => t.status !== 'Completato');
  const presi = s.filter((t) => t.status === 'Completato');
  const riga = (t) => `
    <div class="rt ${t.status === 'Completato' ? 'rt-on' : ''}">
      <button type="button" class="rt-box" data-act="spesa" data-id="${t.id}" aria-label="Preso">✓</button>
      <span class="rt-title flex-1">${esc(t.title)}</span>
      <button type="button" class="text-xl px-2" data-act="del" data-id="${t.id}" aria-label="Elimina">🗑</button>
    </div>`;
  let h = `<section><h2 class="h-sec">🛒 Da comprare <span class="h-count">${da.length}</span></h2>
      <div class="space-y-2.5">${da.length ? da.map(riga).join('')
        : '<p class="card text-center font-bold py-6">Lista vuota</p>'}</div></section>`;
  if (presi.length) h += `<section><h2 class="h-sec">✅ Presi <span class="h-count">${presi.length}</span></h2>
      <div class="space-y-2.5">${presi.map(riga).join('')}</div>
      <button class="btn btn-ghost w-full mt-3" data-act="svuota-spesa">🧹 Togli dalla lista i ${presi.length} presi</button></section>`;
  $('#spesa-body').innerHTML = h;
}

/* ==========================================================================
   SEZIONE: STORICO
   ========================================================================== */
function renderStorico() {
  const fatti = tasks
    .filter((t) => (t.kind === 'Lavoro' && t.status === 'Completato') || (t.kind === 'Routine' && t.last_done_date))
    .map((t) => ({ t, quando: t.kind === 'Routine' ? (t.completed_at || t.last_done_date + 'T12:00:00') : (t.completed_at || t.created_at) }))
    .sort((a, b) => String(b.quando).localeCompare(String(a.quando)));

  let h = `<button class="btn btn-ghost w-full" data-view="calendario">‹ Torna al calendario</button>`;
  if (!fatti.length) {
    h += '<p class="card text-center font-bold py-10">Ancora nessun lavoro completato.</p>';
  } else {
    const gruppi = {};
    fatti.forEach((x) => { const g = String(x.quando).slice(0, 10); (gruppi[g] = gruppi[g] || []).push(x); });
    h += Object.keys(gruppi).sort().reverse().map((g) => `
      <section><h2 class="h-sec">📅 ${esc(dateLabel(g) || g)} <span class="h-count">${gruppi[g].length}</span></h2>
        <div class="space-y-3">${gruppi[g].map(({ t, quando }) => `
          <article class="card card-done ${t.kind === 'Lavoro' ? 'card-tap' : ''}" ${t.kind === 'Lavoro' ? `data-open="${t.id}" role="button" tabindex="0"` : ''}>
            <div class="flex items-start gap-2">
              <h3 class="flex-1 font-bold text-base leading-tight">${esc(t.title)}</h3>
              <span class="badge">${esc(stampLabel(quando))}</span>
            </div>
            <div class="flex flex-wrap gap-1.5 mt-2">
              ${t.kind === 'Routine' ? '<span class="badge">🔁 Routine</span>' : ''}${badgesOf(t)}
            </div>
            ${t.notes ? `<p class="mt-2 text-sm font-semibold" style="color:var(--ink-2)">${esc(t.notes)}</p>` : ''}
            ${photoTag(t)}
          </article>`).join('')}</div></section>`).join('');
  }
  $('#storico-body').innerHTML = h;
}

/* ==========================================================================
   RENDER
   ========================================================================== */
const VIEWS = ['oggi', 'calendario', 'lavori', 'registro', 'spesa', 'storico'];
const FAB_LABEL = { oggi: 'Attività', calendario: 'Attività', lavori: 'Attività', registro: 'Nota', spesa: 'Spesa', storico: 'Attività' };

function render() {
  if (loadFailed) return;
  VIEWS.forEach((v) => { $('#view-' + v).hidden = (v !== view); });
  $$('#nav .tab').forEach((b) => {
    if (b.dataset.view === view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  $('#btn-me').textContent = me === 'Anna' ? 'A' : 'I';
  $('#fab-label').textContent = FAB_LABEL[view] || 'Attività';

  if (view === 'oggi')       renderOggi();
  if (view === 'calendario') renderCalendario();
  if (view === 'lavori')     renderLavori();
  if (view === 'registro')   renderRegistro();
  if (view === 'spesa')      renderSpesa();
  if (view === 'storico')    renderStorico();
}

function showLoadError(e) {
  const off = !navigator.onLine;
  $('#oggi-body').innerHTML = `
    <div class="card card-hot text-center">
      <div class="text-5xl">${off ? '📵' : '⚠️'}</div>
      <p class="mt-2 font-black text-lg" style="color:var(--danger)">${off ? 'Nessuna connessione' : 'Dati non caricati'}</p>
      <p class="mt-1 text-sm font-bold">${off ? 'I lavori sono al sicuro nel database e ricompariranno appena torni in linea.'
                                              : 'Non riesco a leggere l\'elenco dal database.'}</p>
      <p class="mt-2 text-xs font-mono break-words" style="color:var(--danger)">${esc((e && e.message) || e)}</p>
      <button class="btn btn-primary btn-wide mt-3" data-act="retry">🔄 Riprova</button>
    </div>`;
  VIEWS.forEach((v) => { $('#view-' + v).hidden = (v !== 'oggi'); });
}

/* ==========================================================================
   AZIONI
   ========================================================================== */
function upsertLocal(row) {
  const i = tasks.findIndex((t) => t.id === row.id);
  if (i < 0) tasks.push(row); else tasks[i] = { ...tasks[i], ...row };
}

async function patch(id, p, msg) {
  const i = tasks.findIndex((t) => t.id === id);
  if (i < 0) return;
  const before = tasks[i];
  tasks[i] = { ...before, ...p };
  render();
  try {
    await store.update(id, p);
    if (navigator.vibrate) navigator.vibrate(14);
    if (msg) toast(msg);
  } catch (e) { tasks[i] = before; render(); toast('Non salvato: ' + (e.message || e), true); }
}

const toggleRoutine = (id) => {
  const t = tasks.find((x) => x.id === id); if (!t) return;
  const on = routineDone(t);
  patch(id, on ? { last_done_date: null, completed_at: null }
               : { last_done_date: TODAY, completed_at: new Date().toISOString() },
        on ? 'Rimesso da fare' : '✓ Fatto');
};
const toggleSpesa = (id) => {
  const t = tasks.find((x) => x.id === id); if (!t) return;
  const done = t.status === 'Completato';
  patch(id, done ? { status: 'Da fare', completed_at: null }
                 : { status: 'Completato', completed_at: new Date().toISOString() });
};
async function svuotaSpesa() {
  for (const t of spesa().filter((x) => x.status === 'Completato')) {
    try { await store.remove(t.id); tasks = tasks.filter((x) => x.id !== t.id); }
    catch (e) { toast('Errore: ' + e.message, true); }
  }
  render(); toast('Lista ripulita');
}
async function removeTask(id) {
  try { await store.remove(id); tasks = tasks.filter((t) => t.id !== id); render(); toast('Eliminato'); }
  catch (e) { toast('Non eliminato: ' + (e.message || e), true); }
}

/* ==========================================================================
   SHEET: un solo form per creare e per modificare
   ========================================================================== */
function openNew(kind, dueDate) {
  sheetMode = 'new'; sheetId = null; sheetKind = kind;
  photo.sheet = null;
  form = {
    title: '', category: 'Animali', estimated_time: '30m', assigned_to: me,
    priority: 'Media', status: 'Da fare', due_date: dueDate || '', notes: '', extra: false
  };
  buildSheet(); apriSheet();
}

function openEdit(id) {
  const t = tasks.find((x) => x.id === id); if (!t) return;
  sheetMode = 'edit'; sheetId = id; sheetKind = t.kind || 'Lavoro';
  photo.sheet = null;
  form = {
    title: t.title || '', category: t.category || 'Altro', estimated_time: t.estimated_time || '30m',
    assigned_to: t.assigned_to || 'Io', priority: t.priority || 'Media', status: t.status || 'Da fare',
    due_date: t.due_date || '', notes: t.notes || '', photo_url: t.photo_url || null, extra: true
  };
  buildSheet(); apriSheet();
}

function apriSheet() { $('#sheet').hidden = false; document.body.style.overflow = 'hidden'; }
function closeSheet() {
  $('#sheet').hidden = true; document.body.style.overflow = '';
  sheetMode = null; sheetId = null; photo.sheet = null;
}

function buildSheet() {
  if (sheetMode === 'settings') return buildSettings();
  const nuovo = sheetMode === 'new';
  const k = sheetKind;
  const isLav = k === 'Lavoro', isRot = k === 'Routine', isNota = k === 'Nota', isSpesa = k === 'Spesa';

  $('#sheet-title').textContent = nuovo
    ? (isNota ? 'Nuova nota' : isSpesa ? 'Aggiungi alla spesa' : isRot ? 'Nuova routine' : 'Nuova attività')
    : (isNota ? 'Nota' : isSpesa ? 'Articolo' : isRot ? 'Routine giornaliera' : 'Attività');

  const foto = photo.sheet ? photo.sheet.dataUrl : form.photo_url;

  let h = `<div>
      <label class="lbl" for="f-title">${isNota ? 'Cosa annoti' : isSpesa ? 'Cosa serve' : 'Cosa c\'è da fare'}</label>
      <input id="f-title" class="field mt-1.5" maxlength="140" autocomplete="off"
             value="${esc(form.title)}" placeholder="${isNota ? 'Es. Vacca 12 — zoppia zampa dx' : isSpesa ? 'Es. Mangime 25 kg' : isRot ? 'Es. Cibo animali' : 'Es. Riparare recinto pascolo sud'}">
    </div>`;

  if (isSpesa) {
    h += `<button class="btn btn-primary btn-wide" data-act="save">${nuovo ? '＋ Aggiungi alla lista' : '💾 Salva'}</button>`;
    if (!nuovo) h += `<button class="btn btn-danger btn-wide" data-act="del-sheet">🗑 Elimina</button>`;
    $('#sheet-body').innerHTML = h;
    return;
  }

  if (isLav || isRot) {
    h += `<div><span class="lbl">Cosa</span><div class="flex flex-wrap gap-2 mt-1.5">${chipRow(CATEGORIES, form.category, 'category', '')}</div></div>
          <div><span class="lbl">Tempo</span><div class="flex gap-2 mt-1.5">${chipRow(TIMES, form.estimated_time, 'estimated_time')}</div></div>
          <div><span class="lbl">Chi lo fa</span><div class="flex gap-2 mt-1.5">${chipRow(WHO, form.assigned_to, 'assigned_to')}</div></div>`;
  }

  if (isLav) {
    if (nuovo && !form.extra) {
      h += `<button type="button" class="btn btn-ghost btn-sm w-full" data-act="extra">＋ Altro (data, priorità, foto, note)</button>`;
    } else {
      h += `<div><span class="lbl">Scadenza</span>
              <div class="flex gap-2 mt-1.5 overflow-x-auto no-sb">
                ${[['Oggi', TODAY], ['Domani', plusDays(1)], ['Fra 3 gg', plusDays(3)], ['Nessuna', '']]
                  .map(([l, v]) => `<button type="button" class="chip flex-1" aria-pressed="${form.due_date === v}" data-set="due_date" data-value="${v}">${l}</button>`).join('')}
              </div>
              <input id="f-due" type="date" class="field mt-2" value="${esc(form.due_date)}">
            </div>
            <div><span class="lbl">Priorità</span><div class="flex gap-2 mt-1.5">${chipRow(PRIORITY, form.priority, 'priority')}</div></div>`;
      if (!nuovo) h += `<div><span class="lbl">Stato</span><div class="flex gap-2 mt-1.5">${chipRow(STATI, form.status, 'status')}</div></div>`;
    }
  }

  if (isLav ? (form.extra || !nuovo) : true) {
    h += `<div><label class="lbl" for="f-notes">Note</label>
            <textarea id="f-notes" rows="3" class="field mt-1.5" placeholder="Dettagli (opzionale)">${esc(form.notes)}</textarea></div>
          <div><span class="lbl">Foto</span>
            ${foto ? `<img src="${esc(foto)}" class="thumb mt-1.5" alt="Foto" data-lb="${esc(foto)}">` : ''}
            <div class="flex gap-2 mt-2">
              <button type="button" class="btn btn-ghost flex-1" data-act="pick-photo">📷 ${foto ? 'Cambia' : 'Scatta o scegli'} foto</button>
              ${foto ? '<button type="button" class="btn btn-danger" data-act="clear-photo">🗑</button>' : ''}
            </div></div>`;
  }

  h += `<button class="btn btn-primary btn-wide" data-act="save">${nuovo ? '＋ Aggiungi' : '💾 Salva modifiche'}</button>`;
  if (!nuovo) h += `<button class="btn btn-danger btn-wide" data-act="del-sheet">🗑 Elimina</button>`;
  if (!nuovo && isRot) h += `<p class="text-xs font-semibold text-center" style="color:var(--ink-2)">
      Le routine tornano “da fare” ogni giorno. Non hanno scadenza.</p>`;

  $('#sheet-body').innerHTML = h;
}

// tiene aggiornato `form` con quello che è stato scritto nei campi liberi
function leggiCampi() {
  const t = $('#f-title'); if (t) form.title = t.value;
  const n = $('#f-notes'); if (n) form.notes = n.value;
  const d = $('#f-due');   if (d) form.due_date = d.value;
}

async function salvaSheet() {
  leggiCampi();
  const titolo = (form.title || '').trim();
  if (!titolo) { toast('Scrivi prima cosa serve', true); const e = $('#f-title'); if (e) e.focus(); return; }
  const btn = $('[data-act="save"]');
  if (btn) { btn.disabled = true; btn.textContent = 'Salvo…'; }

  const k = sheetKind;
  const row = { title: titolo, notes: (form.notes || '').trim() || null };
  if (k === 'Lavoro' || k === 'Routine') {
    row.category = form.category; row.estimated_time = form.estimated_time; row.assigned_to = form.assigned_to;
  }
  if (k === 'Lavoro') {
    row.priority = form.priority;
    row.due_date = form.due_date || null;
    row.status = form.status;
    row.completed_at = form.status === 'Completato' ? (new Date()).toISOString() : null;
  }
  if (k === 'Nota')  { row.assigned_to = me; }
  if (k === 'Spesa') { row.assigned_to = 'Tutti'; }

  try {
    if (photo.sheet) row.photo_url = await store.uploadPhoto(photo.sheet.blob, photo.sheet.dataUrl);
    if (sheetMode === 'new') {
      row.kind = k;
      row.status = row.status || 'Da fare';
      if (k === 'Routine') { row.is_daily_routine = true; row.sort_order = routines().length + 1; }
      upsertLocal(await store.insert(row));
      // nella spesa resto nel form per aggiungerne altri di fila
      if (k === 'Spesa') {
        form.title = ''; buildSheet(); render();
        const e = $('#f-title'); if (e) e.focus();
        toast('Aggiunto alla lista'); return;
      }
      closeSheet(); render(); toast(k === 'Nota' ? 'Nota salvata' : 'Aggiunto');
    } else {
      if (sheetKind === 'Lavoro' && form.status !== 'Completato') row.completed_at = null;
      upsertLocal(await store.update(sheetId, row));
      closeSheet(); render(); toast('Modifiche salvate');
    }
  } catch (e) {
    toast('Non salvato: ' + (e.message || e), true);
    if (btn) { btn.disabled = false; buildSheet(); }
  }
}

/* ==========================================================================
   IMPOSTAZIONI
   ========================================================================== */
function openSettings() { sheetMode = 'settings'; buildSettings(); apriSheet(); }
function buildSettings() {
  $('#sheet-title').textContent = 'Impostazioni';
  const rt = routines();
  $('#sheet-body').innerHTML = `
    <div><span class="lbl">Chi sta usando l'app</span>
      <p class="text-sm font-semibold mt-1" style="color:var(--ink-2)">Serve al filtro “Solo i miei” e come valore predefinito nelle nuove attività.</p>
      <div class="flex gap-2 mt-2">
        <button class="chip flex-1" data-me="Io"   aria-pressed="${me === 'Io'}">Io</button>
        <button class="chip flex-1" data-me="Anna" aria-pressed="${me === 'Anna'}">Anna</button>
      </div>
    </div>
    <div><span class="lbl">Collegamento</span>
      <p class="mt-1 font-bold">${CONFIGURED ? 'Database Supabase' : 'Solo questo dispositivo'}</p>
      <p class="text-sm font-semibold" style="color:var(--ink-2)">Stato: ${esc($('#conn').textContent)}</p>
    </div>
    <div><span class="lbl">Routine giornaliere (${rt.length})</span>
      <p class="text-sm font-semibold mt-1" style="color:var(--ink-2)">Tocca il nome per modificarla. Si possono modificare anche dalla sezione Oggi.</p>
      <div class="space-y-2 mt-2">
        ${rt.map((t) => `<div class="card flex items-center gap-2">
            <button type="button" class="flex-1 text-left" data-open="${t.id}">
              <span class="block font-bold">${esc(t.title)} <span style="color:var(--ink-2)">›</span></span>
              <span class="block text-xs font-semibold mt-0.5" style="color:var(--ink-2)">${esc(t.assigned_to)}${t.estimated_time ? ' · ' + esc(t.estimated_time) : ''}</span>
            </button>
            <button class="btn btn-danger btn-sm" data-act="del" data-id="${t.id}">🗑</button>
          </div>`).join('') || '<p class="text-sm font-semibold">Nessuna routine.</p>'}
      </div>
      <button class="btn btn-ghost w-full mt-2" data-act="new-routine">＋ Nuova routine</button>
    </div>
    <button class="btn btn-ghost btn-wide" data-act="retry">🔄 Ricarica i dati</button>`;
}

/* ==========================================================================
   EVENTI
   ========================================================================== */
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act],[data-view],[data-open],[data-mine],[data-set],[data-me],[data-lb],[data-cal]');
  if (!el) return;

  if (el.dataset.view) {
    if (!$('#sheet').hidden) closeSheet();
    view = el.dataset.view; window.scrollTo({ top: 0 }); render(); return;
  }
  if (el.dataset.cal) { calSel = el.dataset.cal; render(); return; }
  if (el.dataset.lb)  { $('#lightbox img').src = el.dataset.lb; $('#lightbox').hidden = false; return; }
  if (el.dataset.mine) { mine = el.dataset.mine; render(); return; }
  if (el.dataset.me)   { me = el.dataset.me; localStorage.setItem('fattoria_me', me); buildSettings(); render(); return; }

  if (el.dataset.set) {                       // chip del form
    leggiCampi();
    form[el.dataset.set] = el.dataset.value;
    buildSheet();
    return;
  }

  const id = el.dataset.id;
  switch (el.dataset.act) {
    case 'routine':  toggleRoutine(id); return;
    case 'spesa':    toggleSpesa(id); return;
    case 'start':    ev.stopPropagation(); patch(id, { status: 'In corso' }, '▶ In corso'); return;
    case 'done':     ev.stopPropagation(); patch(id, { status: 'Completato', completed_at: new Date().toISOString() }, '✓ Completato'); return;
    case 'del':      ev.stopPropagation(); removeTask(id).then(() => { if (sheetMode === 'settings') buildSettings(); }); return;
    case 'svuota-spesa': svuotaSpesa(); return;
    case 'retry':    closeSheet(); loadFailed = false; reload(true); return;
    case 'cal-prev': calM--; if (calM < 0) { calM = 11; calY--; } render(); return;
    case 'cal-next': calM++; if (calM > 11) { calM = 0; calY++; } render(); return;
    case 'cal-today': { const d = new Date(); calY = d.getFullYear(); calM = d.getMonth(); calSel = TODAY; render(); return; }
    case 'new-per-giorno': openNew('Lavoro', calSel); return;
    case 'new-routine': openNew('Routine'); return;
    case 'extra':    leggiCampi(); form.extra = true; buildSheet(); return;
    case 'pick-photo':  $('#photo-input').click(); return;
    case 'clear-photo': leggiCampi(); photo.sheet = null; form.photo_url = null; buildSheet(); return;
    case 'save':     salvaSheet(); return;
    case 'del-sheet':
      if (el.dataset.armed !== '1') { el.dataset.armed = '1'; el.textContent = '⚠️ Tocca di nuovo per eliminare'; return; }
      { const x = sheetId; closeSheet(); removeTask(x); } return;
  }

  if (el.dataset.open) openEdit(el.dataset.open);
});

$('#fab').addEventListener('click', () => {
  if (view === 'registro') openNew('Nota');
  else if (view === 'spesa') openNew('Spesa');
  else if (view === 'calendario') openNew('Lavoro', calSel);
  else openNew('Lavoro');
});
$('#btn-settings').addEventListener('click', openSettings);
$('#btn-me').addEventListener('click', openSettings);
$('#sheet-close').addEventListener('click', closeSheet);
$('#sheet-bg').addEventListener('click', closeSheet);
$('#lb-close').addEventListener('click', () => { $('#lightbox').hidden = true; });
$('#lightbox').addEventListener('click', (e) => { if (e.target.id === 'lightbox') $('#lightbox').hidden = true; });
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!$('#lightbox').hidden) $('#lightbox').hidden = true;
  else if (!$('#sheet').hidden) closeSheet();
});
document.addEventListener('change', (e) => { if (e.target.id === 'f-due') { form.due_date = e.target.value; buildSheet(); } });

/* ==========================================================================
   REALTIME
   ========================================================================== */
function startRealtime() {
  channel = db.channel('tasks-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, (payload) => {
      if (payload.eventType === 'DELETE') {
        const id = payload.old && payload.old.id;
        if (id) tasks = tasks.filter((t) => t.id !== id);
      } else if (payload.new) upsertLocal(payload.new);
      if (loadFailed) { loadFailed = false; reload(false); return; }
      render();
    })
    .subscribe((st) => {
      if (st === 'SUBSCRIBED') setConn('● Live', '#DCF0D6', '#14401A');
      else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') setConn('● Offline', '#8C1D18', '#fff');
      else setConn('● …', '#ffffffcc');
    });
}

/* ==========================================================================
   CARICAMENTO
   ========================================================================== */
async function reload(showToast) {
  const mia = ++reloadSeq;
  try {
    const data = await store.load();
    if (mia !== reloadSeq) return;
    tasks = data; loadFailed = false; render();
    if (showToast) toast('Dati aggiornati');
  } catch (e) {
    if (mia !== reloadSeq) return;
    loadFailed = true; showLoadError(e);
    toast('Dati non caricati: ' + (e.message || e), true);
  }
}

setInterval(() => { if (iso(new Date()) !== TODAY) location.reload(); }, 60000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (iso(new Date()) !== TODAY) { location.reload(); return; }
  if (CONFIGURED) reload(false);
});
window.addEventListener('online',  () => { if (CONFIGURED) reload(false); });
window.addEventListener('offline', () => setConn('● Offline', '#8C1D18', '#fff'));

function installIcon() {
  let icon = '';
  try {
    const c = document.createElement('canvas'); c.width = c.height = 192;
    const x = c.getContext('2d');
    x.fillStyle = '#8FA583'; x.fillRect(0, 0, 192, 192);
    x.font = '118px system-ui, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText('🚜', 96, 104);
    icon = c.toDataURL('image/png');
  } catch (e) {}
  if (icon) for (const rel of ['apple-touch-icon', 'icon']) {
    const l = document.createElement('link'); l.rel = rel; l.href = icon; document.head.appendChild(l);
  }
  const man = { name: 'Fattoria Tasks', short_name: 'Fattoria', start_url: './', display: 'standalone',
                orientation: 'portrait', background_color: '#E6D8BC', theme_color: '#8FA583',
                icons: icon ? [{ src: icon, sizes: '192x192', type: 'image/png', purpose: 'any' }] : [] };
  const l = document.createElement('link');
  l.rel = 'manifest'; l.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(man));
  document.head.appendChild(l);
}

(async function init() {
  installIcon();
  const d = new Date(); calY = d.getFullYear(); calM = d.getMonth(); calSel = TODAY;
  $('#btn-me').textContent = me === 'Anna' ? 'A' : 'I';

  if (CONFIGURED && window.supabase) {
    db = window.supabase.createClient(SUPABASE_URL.trim().replace(/\/$/, ''), SUPABASE_ANON_KEY.trim());
    store = remoteStore;
    setConn('● …', '#ffffffcc');
    await reload(false);
    startRealtime();
  } else {
    store = localStore;
    setConn('● Locale', '#F6D98A');
    $('#local-banner').hidden = false;
    $('#local-banner').innerHTML = CONFIGURED
      ? 'Libreria Supabase non caricata (serve internet). Sto usando i dati di questo dispositivo.'
      : '<b>Modalità locale.</b> Supabase non è configurato: i dati restano su questo dispositivo e non si sincronizzano.';
    await reload(false);
  }
})();
</script>
